<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progression Technologie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concept : cahier de progression d'un prof de techno. Frise verticale (page 1), grille séquences x séances (page 2). */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14232b; --muted:#5b6d75; --line:#d5dddb;
  --accent:#0b6e6e; --accent-ink:#ffffff; --accent-soft:#d8ecea;
  --board:#1f4b57; --desk:#dde5e3;
  --signal:#e8590c; --signal-soft:#fde8d9;
  --pres:#6b5bb5; --synth:#b5497a;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1f; --surface:#17252c; --ink:#e6eeee; --muted:#93a6ad; --line:#2a3d45;
  --accent:#4fc3c0; --accent-ink:#06201f; --accent-soft:#1b3a3b; --board:#0d2a31; --desk:#0a1418;
  --signal:#ff8a4c; --signal-soft:#3a2418; --pres:#a99bf0; --synth:#f08cba; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#17252c; --ink:#e6eeee; --muted:#93a6ad; --line:#2a3d45;
  --accent:#4fc3c0; --accent-ink:#06201f; --accent-soft:#1b3a3b; --board:#0d2a31; --desk:#0a1418;
  --signal:#ff8a4c; --signal-soft:#3a2418; --pres:#a99bf0; --synth:#f08cba; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font:700 1.15rem var(--f-display);letter-spacing:-.01em}
.brand small{display:block;font:500 .72rem var(--f-body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:4px}
nav a{padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:500;color:var(--muted)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav a:hover:not([aria-current]){background:var(--accent-soft);color:var(--ink)}

main{padding-block:32px 72px}
h1{font:700 clamp(1.8rem,4vw,2.6rem)/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 32px;max-width:62ch}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:500 .85rem var(--f-body);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn svg{width:15px;height:15px;flex:none}

/* ---------- Page 1 : frise horizontale ---------- */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-8px 0 8px}
.tools .hint{color:var(--muted);font-size:.85rem;flex:1;min-width:200px}
.hscroll{position:relative;overflow-x:auto;padding:8px 0 28px;scroll-snap-type:x proximity;cursor:grab;scrollbar-width:thin;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.hscroll.drag{cursor:grabbing;scroll-snap-type:none;user-select:none}
.track{--lineY:150px;position:relative;display:flex;width:max-content;padding-right:40px}
.track::before{content:"";position:absolute;left:0;right:0;top:var(--lineY);height:5px;border-radius:3px;background:var(--line)}
.packet{position:absolute;top:calc(var(--lineY) - 6px);left:0;width:17px;height:17px;border-radius:5px;background:var(--signal);pointer-events:none;animation:travel 22s linear infinite;z-index:1}
.packet::after{content:"";position:absolute;left:3px;right:3px;top:5px;height:2px;background:#fff;box-shadow:0 4px 0 #fff}
@keyframes travel{from{left:0}to{left:calc(100% - 17px)}}
.hseq{flex:none;width:650px;scroll-snap-align:start;padding-right:24px;position:relative}
.hseq-head{display:flex;align-items:flex-end;gap:12px;height:120px;margin-bottom:12px}
.mascot{flex:none;width:92px;height:92px}
.mascot svg{width:100%;height:100%;overflow:visible}
.hseq.empty .mascot{filter:grayscale(.55);opacity:.8}
.hseq-title{min-width:0;padding-bottom:10px}
.hseq.empty .hseq-title .tag{background:transparent;color:var(--muted);padding:0}
.hseq-title .tag{font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:#fff;background:var(--sq,var(--accent));padding:2px 9px;border-radius:99px;display:inline-block}
.hseq.empty .hseq-title .tag{color:var(--muted)}
.hseq-title h2{font:700 1.2rem/1.2 var(--f-display);margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hseq.empty h2{color:var(--muted)}
.stops{display:flex}
.stop{flex:0 0 126px;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0 5px 6px;text-align:center;border-radius:8px}
.dot{position:relative;width:28px;height:28px;border-radius:50%;background:var(--sq,var(--accent));border:4px solid var(--bg);box-shadow:0 0 0 2px var(--sq,var(--accent));transition:transform .18s}
.stop.pres .dot{background:var(--sq,var(--pres));box-shadow:0 0 0 2px var(--sq,var(--pres))}
.stop.synth .dot{background:var(--sq,var(--synth));box-shadow:0 0 0 2px var(--sq,var(--synth))}
.stop.todo .dot{background:var(--bg);box-shadow:0 0 0 2px var(--muted)}
.stop:not(.todo) .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid currentColor;opacity:0;color:var(--accent);animation:ring 3.2s ease-out infinite}
.stop.pres .dot::after{color:var(--sq,var(--pres))} .stop.synth .dot::after{color:var(--sq,var(--synth))}
@keyframes ring{0%{transform:scale(.6);opacity:.7}70%,100%{transform:scale(1.25);opacity:0}}
.stop:hover .dot,.stop[aria-expanded="true"] .dot{transform:scale(1.3)}
.stop[aria-expanded="true"] .dot{background:var(--signal);box-shadow:0 0 0 2px var(--signal)}
.stop .k{font:700 .68rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--sq,var(--accent))}
.stop.pres .k{color:var(--pres)} .stop.synth .k{color:var(--synth)} .stop.todo .k{color:var(--muted)}
.stop .tt{font:500 .82rem/1.3 var(--f-body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stop.todo .tt{color:var(--muted)}
.stop:hover .tt{text-decoration:underline}

.actions{display:flex;flex-wrap:wrap;gap:6px}
/* fenêtre au clic */
.pop{position:fixed;z-index:60;width:244px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;animation:popin .15s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.pop .arrow{position:absolute;width:13px;height:13px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);top:-8px}
.pop.above .arrow{top:auto;bottom:-8px;transform:rotate(225deg)}
.pop .kind{font:600 .7rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);padding-right:24px}
.pop.pres .kind{color:var(--pres)} .pop.synth .kind{color:var(--synth)} .pop.todo .kind{color:var(--muted)}
.pop h3{font:600 1rem/1.3 var(--f-body);margin:0}
.pop p{margin:0;color:var(--muted);font-size:.88rem}
.pop .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer}
.pop .x:hover{background:var(--accent-soft);color:var(--ink)}
.pop .actions{flex-direction:column;align-items:flex-start;margin-top:4px}

/* mascottes animées */
.mascot .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot .bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mascot .shackle{animation:shackle 3.6s ease-in-out infinite}
@keyframes shackle{0%,55%,100%{transform:translateY(0)}65%,85%{transform:translateY(-5px)}}
.mascot .spin{transform-origin:32px 32px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mascot .wave{transform-box:view-box;transform-origin:44px 46px;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(22deg)}}
.mascot .pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
.mascot .glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{fill:#ffd966}50%{fill:#fff1a8}}
.mascot .rays{animation:rays 2s ease-in-out infinite}
@keyframes rays{0%,100%{opacity:.25}50%{opacity:1}}
.mascot .flame{transform-box:fill-box;transform-origin:50% 0;animation:flame .25s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.8)}to{transform:scaleY(1.25)}}
.mascot .sway{transform-box:view-box;transform-origin:32px 44px;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.mascot .bar{animation:charge 2.4s steps(1) infinite;opacity:.15}
.mascot .bar:nth-of-type(2){animation-delay:.6s}.mascot .bar:nth-of-type(3){animation-delay:1.2s}
@keyframes charge{0%{opacity:.15}25%,80%{opacity:1}100%{opacity:.15}}
.mascot .pin{animation:rays 1.6s ease-in-out infinite}
.mascot .shift{animation:bob 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.mascot *,.packet,.dot::after{animation:none!important}}

/* ---------- Page 2 : tableau ---------- */
.tablewrap{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tablewrap.full{overflow:auto;max-height:78vh}
.tablewrap.fit{overflow:visible}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.full table{min-width:1570px}
col.w1{width:170px} col.w2{width:230px} col.wc{width:130px}
.fit col.w1{width:11%} .fit col.w2{width:21%} .fit col.wc{width:7.55%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
thead th{position:sticky;background:var(--accent);color:var(--accent-ink);border-color:rgba(255,255,255,.25);z-index:3}
.full thead tr:first-child th{top:0}
.full thead tr:nth-child(2) th{top:var(--h1,52px)}
thead tr:first-child th{font:700 .9rem/1.25 var(--f-display)}
thead tr:nth-child(2) th{font:500 .74rem/1.3 var(--f-body);background:var(--accent-soft);color:var(--ink);border-color:var(--line);overflow-wrap:break-word}
thead th.th-t2{background:#0a5c8a;color:#fff} thead th.th-t3{background:#7a4a16;color:#fff}
.tablewrap thead th.corner{background:var(--ink);color:var(--bg);z-index:5}
thead tr:nth-child(2) th b{display:block;font:700 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.th-sub{display:block;font:500 .72rem var(--f-body);opacity:.9}
.full .short{display:none} .fit .long{display:none}
.full .c1{position:sticky;left:0;z-index:2;background:var(--surface)}
.full .c2{position:sticky;left:170px;z-index:2;background:var(--surface);box-shadow:2px 0 0 var(--line)}
.fit td.c1,.fit td.c2{background:var(--surface)}
thead th.c1,thead th.c2{z-index:5}
td.c1{font:700 .92rem/1.25 var(--f-display)}
td.c1 small{display:block;font:500 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
td.c1.empty{color:var(--muted)}
tr.first>td{border-top:3px solid var(--ink)}
td.c2 .sc{display:flex;justify-content:space-between;align-items:center;gap:6px}
td.c2 .k{font:700 .68rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--sq,var(--accent))}
tbody td.c1:not(.empty){border-left:7px solid var(--sq,var(--accent))}
tbody td.c1:not(.empty) small{color:var(--sq,var(--muted));font-weight:700}
tbody td.c2{border-left:3px solid var(--sq,var(--line))}
td.c2 .t{font-weight:500;font-size:.86rem;line-height:1.3;display:block;margin:2px 0 6px}
td.c2.todo .t,td.c2.todo .k{color:var(--muted)}
td.c2 a.t{text-decoration:none} td.c2 a.t:hover{color:var(--signal);text-decoration:underline}
.mini{display:flex;gap:4px}
.mini .btn{padding:5px 8px;font-size:.78rem}
td.chk{position:relative;text-align:center;vertical-align:middle;padding:0}
td.chk label{display:grid;place-items:center;height:100%;min-height:62px;cursor:pointer}
td.chk input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
td.chk.on{background:var(--accent-soft)}
.info{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:700 .72rem/20px var(--f-display);font-style:italic;padding:0;cursor:pointer;transition:transform .12s}
.info:hover,.info[aria-expanded="true"]{transform:scale(1.2);background:var(--signal);color:#fff}
/* vue ajustée à l'écran : lignes compactes, pas de défilement horizontal */
.fit th,.fit td{padding:4px 6px}
.fit thead tr:first-child th{top:var(--hb,64px);font-size:.78rem;padding:5px 6px}
.fit thead tr:nth-child(2) th{top:calc(var(--hb,64px) + var(--h1,40px));font-size:.66rem;line-height:1.2;padding:4px 4px}
.fit thead tr:nth-child(2) th b{font-size:.66rem;margin-bottom:1px}
.fit td.c1{font-size:.8rem;line-height:1.2}
.fit td.c1 small{font-size:.62rem}
.fit td.c2 .k{font-size:.6rem}
.fit td.c2 .t{font-size:.76rem;line-height:1.2;margin:1px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fit .mini .btn{padding:3px 5px}
.fit .mini .btn svg{width:13px;height:13px}
.fit td.chk label{min-height:36px}
.fit td.chk input{width:17px;height:17px}
.fit .info{width:15px;height:15px;font-size:.6rem;line-height:15px;top:2px;right:2px}
.fit tr.vide td{padding-block:1px}
.fit tr.vide td.c2{white-space:nowrap}
.fit tr.vide td.c2 .k,.fit tr.vide td.c2 a.t{display:inline;margin:0 6px 0 0;font-size:.7rem}
.fit tr.vide td.chk label{min-height:20px}
.fit tr.vide td.chk input{width:14px;height:14px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:28px}
.legend section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.legend h2{font:700 1rem/1.3 var(--f-display);margin:0 0 8px}
.legend ol{margin:0;padding-left:0;list-style:none;display:grid;gap:6px;font-size:.88rem}
.legend li b{color:var(--accent);font-size:.75rem;letter-spacing:.06em;margin-right:6px}
.note{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.pop.note{width:340px}
.pop.note .from{font-size:.8rem}
.pop.note label{font:600 .75rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pop.note textarea{width:100%;min-height:180px;font:400 .88rem/1.45 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.pop.note .hint{font-size:.74rem}

/* ---------- Page en construction ---------- */
.construction{display:grid;place-items:center;text-align:center;padding:56px 16px;border:2px dashed var(--line);border-radius:12px;background:var(--surface);gap:14px}
.construction svg{width:84px;height:84px;color:var(--signal)}
.construction h1{margin:0}
.construction p{margin:0;color:var(--muted);max-width:52ch}
.stripes{height:14px;width:min(340px,80%);border-radius:3px;background:repeating-linear-gradient(135deg,var(--signal) 0 14px,var(--ink) 14px 28px)}

/* ---------- Visionneuse PDF ---------- */
dialog{border:0;padding:0;border-radius:10px;width:min(960px,96vw);height:min(92vh,1100px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,16,20,.65)}
dialog[open]{display:flex;flex-direction:column}
.dlg-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dlg-head strong{flex:1;min-width:180px;font:600 .95rem var(--f-body)}
dialog iframe{flex:1;border:0;width:100%;background:#888}
.toast{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50;max-width:92vw}

[hidden]{display:none!important}
/* ---------- Page 3 : classeur élève ---------- */
body.route-classeur main.wrap{max-width:none;padding-block:12px 12px}
body.zen header.top .brand,body.zen header.top nav{display:none}
.binder{position:relative;display:flex;flex-direction:column;gap:8px;height:calc(100vh - var(--hb,52px) - 20px);min-height:480px}
body.route-classeur header.top .wrap{max-width:none;padding-block:6px;gap:10px;flex-wrap:nowrap}
body.route-classeur header.top .brand{font-size:1rem;white-space:nowrap}
body.route-classeur header.top .brand small{display:none}
body.route-classeur nav a{padding:6px 10px;font-size:.88rem;white-space:nowrap}
header.top .b-top{flex:1;min-width:0;justify-content:flex-end;flex-wrap:nowrap}
header.top .b-top .btn{padding:6px 10px;white-space:nowrap}
body.role-prof.route-classeur header.top .wrap{flex-wrap:wrap}body.role-prof.route-classeur header.top .b-top{flex-wrap:wrap;order:3;flex-basis:100%}
@media (max-width:1100px){body.route-classeur header.top .wrap{flex-wrap:wrap}header.top .b-top{flex-wrap:wrap;order:3;flex-basis:100%}}
.b-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.b-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.b-title strong,.b-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-title strong{font:700 1rem var(--f-display)}
.b-title span{font-size:.78rem;color:var(--muted)}
header.top .switch{font-size:.82rem;white-space:nowrap;gap:8px}
header.top .switch .sw{width:38px;height:22px}
header.top .switch .sw::after{width:16px;height:16px}
header.top .switch input:checked+.sw::after{transform:translateX(16px)}
.b-zoom{display:flex;align-items:center;gap:4px;font-size:.82rem}
.b-zoom span{min-width:42px;text-align:center;color:var(--muted)}
.btn[aria-expanded]::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:5px;transition:transform .15s}
.btn[aria-expanded="true"]::after{transform:rotate(-135deg) translateY(-1px)}
.b-zoom .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.b-top .btn[aria-expanded="false"]{background:var(--surface);color:var(--muted)}
.b-body{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;transition:grid-template-columns .28s ease,gap .28s ease}
.b-body.nav-closed{grid-template-columns:0px minmax(0,1fr);gap:0}
.b-body.nav-closed .cl-side{opacity:0;visibility:hidden;border-color:transparent}
.cl-side{min-width:0;transition:opacity .2s ease,visibility 0s linear 0s}
.b-body.nav-closed .cl-side{transition:opacity .2s ease,visibility 0s linear .28s}
.drawer-handle{position:absolute;left:0;top:26%;z-index:65;width:22px;height:70px;border:0;border-radius:0 10px 10px 0;background:var(--board);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:2px 2px 6px rgba(0,0,0,.35)}

.cl-nav{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;min-height:0}

.cl-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:500 .85rem/1.3 var(--f-body);padding:7px 9px;border-radius:6px;cursor:pointer}

.cl-bar{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:70;width:max-content;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.35)}

.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}

/* le classeur : bureau, plateau, anneaux, intercalaires */
.desk-wrap{position:relative;min-width:0;min-height:0}

.rings i{position:absolute;left:calc(2.9% - 17px);width:34px;height:12px;border-radius:6px;background:linear-gradient(#f7f9fa,#9ea8ad 52%,#d9dfe2);box-shadow:0 2px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.18);transform:translateY(-50%);z-index:40;pointer-events:none}
.rings i:nth-child(1){top:14%}.rings i:nth-child(2){top:38%}.rings i:nth-child(3){top:62%}.rings i:nth-child(4){top:86%}

.tabs{position:absolute;right:-40px;top:14px;display:flex;flex-direction:column;gap:5px;z-index:2}

/* feuille */
.pg{position:relative;width:100%;aspect-ratio:595.3/841.89;background:#fff;container-type:inline-size;overflow:hidden;touch-action:pan-y}
.stage .pg{box-shadow:0 2px 14px rgba(0,0,0,.4)}

.leaf .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 60%);opacity:0;pointer-events:none}
.cl-main.on .pg.t-text{cursor:text}

.tbw .rsz{right:-9px;top:50%;transform:translateY(-50%);width:12px;height:30px;max-height:100%;border-radius:6px;background:#1a4fd6;cursor:ew-resize;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.3);background-image:linear-gradient(90deg,transparent 3px,#fff 3px,#fff 4px,transparent 4px,transparent 7px,#fff 7px,#fff 8px,transparent 8px)}
.cf{position:absolute;border:0;border-bottom:1.5px solid #14232b;background:transparent;font-family:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive,sans-serif;font-size:2.52cqw;color:#1a4fd6;padding:0 .2em;outline:none;border-radius:0}
.cl-main.on .cf{background:rgba(26,79,214,.07)}
.cl-main.on .cf:focus{background:rgba(26,79,214,.14)}

#printzone{display:none}

/* panneau de gauche à onglets : Sommaire / Outils */

function fitPage(){

  host.appendChild(leaf);

function snap(pid){ CL.undo.push({pid:pid, d:JSON.stringify(pd(pid)), cover:pid === "garde" ? JSON.stringify(CLS.cover) : null}); if (CL.undo.length > 60) CL.undo.shift(); }

/* --- couche d'écriture d'une page --- */
function pgPos(pg, e){ var r = pg.getBoundingClientRect(); return {x:(e.clientX - r.left)/r.width, y:(e.clientY - r.top)/r.width}; }
function bindPage(pg){
  var pid = pg.getAttribute("data-pid"), cur = null, erasing = false;
  pg.addEventListener("pointerdown", function(e){
    if (!CL.on || e.button > 0) return;
    var d = pd(pid), p = pgPos(pg, e);
    if (CL.tool === "text") {
      if (e.target.closest(".tbw") || e.target.closest(".cf")) return;
      e.preventDefault(); snap(pid);
      var t = {id:uid(), x:Math.max(0, Math.min(p.x, .62)), y:p.y, w:.36, s:CL.size, c:CL.color, t:""};
      d.texts.push(t); var box = addTextBox(pg, t); box.querySelector("textarea").focus(); clSave();
    } else if (CL.tool === "pen") {
      e.preventDefault(); snap(pid);
      cur = {c:CL.color, w:.004, pts:[[p.x, p.y]]}; d.strokes.push(cur);
      pg.setPointerCapture(e.pointerId); redrawInk(pg);
    } else if (CL.tool === "erase") {
      e.preventDefault(); snap(pid); erasing = true; pg.setPointerCapture(e.pointerId); eraseAt(pg, pid, p);
    }
  });
  pg.addEventListener("pointermove", function(e){
    if (cur) { var p = pgPos(pg, e); cur.pts.push([p.x, p.y]); redrawInk(pg); }
    else if (erasing) eraseAt(pg, pid, pgPos(pg, e));
  });
  function end(){ if (cur || erasing) { cur = null; erasing = false; clSave(); } }
  pg.addEventListener("pointerup", end); pg.addEventListener("pointercancel", end);
}
function segDist(p, a, b){
  var dx = b[0]-a[0], dy = b[1]-a[1], l = dx*dx + dy*dy, t = l ? Math.max(0, Math.min(1, ((p.x-a[0])*dx + (p.y-a[1])*dy)/l)) : 0;
  var x = a[0] + t*dx - p.x, y = a[1] + t*dy - p.y; return Math.sqrt(x*x + y*y);
}
function eraseAt(pg, pid, p){
  var d = pd(pid), n = d.strokes.length;
  d.strokes = d.strokes.filter(function(st){
    for (var i = 0; i < st.pts.length; i++) { var a = st.pts[i], b = st.pts[i+1] || a; if (segDist(p, a, b) < .02) return false; }
    return true;
  });
  if (d.strokes.length !== n) redrawInk(pg);
}
function redrawInk(pg){
  var cv = pg.querySelector("canvas.ink"), cw = pg.clientWidth, ch = pg.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!cw) return;
  if (cv.width !== Math.round(cw*dpr) || cv.height !== Math.round(ch*dpr)) { cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr); }
  var ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cw,ch);
  drawStrokes(ctx, pd(pg.getAttribute("data-pid")).strokes, cw);
}
function drawStrokes(ctx, strokes, W){
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  strokes.forEach(function(st){
    ctx.strokeStyle = st.c; ctx.fillStyle = st.c; ctx.lineWidth = st.w * W;
    if (st.pts.length === 1) { ctx.beginPath(); ctx.arc(st.pts[0][0]*W, st.pts[0][1]*W, st.w*W/2, 0, 6.3); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(st.pts[0][0]*W, st.pts[0][1]*W);
    for (var i = 1; i < st.pts.length; i++) ctx.lineTo(st.pts[i][0]*W, st.pts[i][1]*W);
    ctx.stroke();
  });
}

function autosize(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
function renderLayer(pg){
  var pid = pg.getAttribute("data-pid"), layer = pg.querySelector(".layer"); layer.innerHTML = "";
  if (pid === "garde") COVER.fields.forEach(function(f){
    var i = document.createElement("input"); i.type = "text"; i.className = "cf"; i.id = "cf-" + f.id; i.value = CLS.cover[f.id] || "";
    i.setAttribute("aria-label", {nom:"Nom", prenom:"Prénom", prof:"Professeur", an1:"Année de début", an2:"Année de fin"}[f.id]);
    i.style.left = (f.x/COVER.w*100) + "%"; i.style.top = (f.y/COVER.h*100) + "%"; i.style.width = (f.w/COVER.w*100) + "%"; i.style.height = (f.h/COVER.h*100) + "%";
    i.readOnly = !CL.on;
    i.addEventListener("focus", function(){ snap("garde"); });
    i.addEventListener("input", function(){ CLS.cover[f.id] = i.value; clSave(); });
    layer.appendChild(i);
  });
  pd(pid).texts.forEach(function(t){ addTextBox(pg, t); });
  redrawInk(pg);
  layer.querySelectorAll("textarea").forEach(autosize);
}
function addTextBox(pg, t){
  var pid = pg.getAttribute("data-pid"), layer = pg.querySelector(".layer");
  var w = document.createElement("div"); w.className = "tbw";
  w.style.left = (t.x*100) + "%"; w.style.top = (t.y/PAGE_R*100) + "%"; w.style.width = (t.w*100) + "%";
  w.innerHTML = '<span class="grip" title="Déplacer le texte"></span><button type="button" class="del" title="Supprimer ce texte" aria-label="Supprimer ce texte">&times;</button><textarea rows="1" spellcheck="false" aria-label="Texte à écrire"></textarea><span class="rsz" title="Élargir ou rétrécir le cadre"></span>';
  var ta = w.querySelector("textarea"); ta.value = t.t; ta.style.fontSize = (t.s*100) + "cqw"; ta.style.color = t.c; ta.readOnly = !CL.on;
  ta.addEventListener("input", function(){ t.t = ta.value; autosize(ta); clSave(); });
  ta.addEventListener("focus", function(){ CL.focus = {t:t, ta:ta}; });
  ta.addEventListener("blur", function(){
    setTimeout(function(){
      if (CL.focus && CL.focus.t === t) CL.focus = null;
      if (!t.t.trim() && w.parentNode) { var d = pd(pid); d.texts = d.texts.filter(function(x){ return x !== t; }); w.remove(); clSave(); }
    }, 150);
  });
  w.querySelector(".del").addEventListener("click", function(){ snap(pid); var d = pd(pid); d.texts = d.texts.filter(function(x){ return x !== t; }); w.remove(); clSave(); });
  drag(w.querySelector(".grip"), pg, function(){ return {x:t.x, y:t.y}; }, function(o, dx, dy){
    t.x = Math.max(0, Math.min(1 - t.w, o.x + dx)); t.y = Math.max(0, o.y + dy);
    w.style.left = (t.x*100) + "%"; w.style.top = (t.y/PAGE_R*100) + "%";
  }, pid);
  drag(w.querySelector(".rsz"), pg, function(){ return {w:t.w}; }, function(o, dx){
    t.w = Math.max(.1, Math.min(1 - t.x, o.w + dx)); w.style.width = (t.w*100) + "%"; autosize(ta);
  }, pid);
  layer.appendChild(w); return w;
}
function drag(handle, pg, start, move, pid){
  handle.addEventListener("pointerdown", function(e){
    e.preventDefault(); e.stopPropagation(); snap(pid);
    var p0 = pgPos(pg, e), o = start();
    handle.setPointerCapture(e.pointerId);
    function mv(ev){ var p = pgPos(pg, ev); move(o, p.x - p0.x, p.y - p0.y); }
    function up(){ handle.removeEventListener("pointermove", mv); handle.removeEventListener("pointerup", up); clSave(); }
    handle.addEventListener("pointermove", mv); handle.addEventListener("pointerup", up);
  });
}

/* --- export : assemble chaque page (fond + écriture) --- */
function loadImg(src){ return new Promise(function(res, rej){ var i = new Image(); i.onload = function(){ res(i); }; i.onerror = function(){ rej(new Error("image introuvable")); }; i.src = src; }); }
function wrapLines(ctx, text, maxW){
  var out = [];
  text.split("\n").forEach(function(par){
    var words = par.split(" "), line = "";
    words.forEach(function(w){
      var test = line ? line + " " + w : w;
      if (line && ctx.measureText(test).width > maxW) { out.push(line); line = w; } else line = test;
    });
    out.push(line);
  });
  return out;
}
function composePage(pid){
  return loadImg(pageImg(pid)).then(function(img){
    var W = img.naturalWidth, H = img.naturalHeight, c = document.createElement("canvas"); c.width = W; c.height = H;
    var ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0);
    var d = pd(pid);
    if (pid === "garde") {
      ctx.fillStyle = COLORS[0]; ctx.textBaseline = "alphabetic"; ctx.font = (15.5/COVER.w*W) + "px " + FONT_C;
      COVER.fields.forEach(function(f){ var v = CLS.cover[f.id]; if (v) ctx.fillText(v, (f.x + 3)/COVER.w*W, (f.y + f.h - 5)/COVER.w*W, f.w/COVER.w*W); });
    }
    drawStrokes(ctx, d.strokes, W);
    d.texts.forEach(function(t){
      var px = t.s*W; ctx.font = px + "px " + FONT_T; ctx.fillStyle = t.c; ctx.textBaseline = "top";
      var padX = .2*px, padY = .1*px, lines = wrapLines(ctx, t.t, t.w*W - 2*padX);
      lines.forEach(function(l, i){ ctx.fillText(l, t.x*W + padX, t.y*W + padY + i*px*1.25 + (px*1.25 - px)/2 - 1); });
    });
    return c;
  });
}
function fileName(base){
  var who = [CLS.cover.nom, CLS.cover.prenom].filter(Boolean).join("-").replace(/[^\wÀ-ÿ-]+/g, "_");
  return (who ? who + "_" : "") + base + ".pdf";
}
function buildPdf(jpegs){

  push("%PDF-1.4\n");

  offs[2] = len; push("2 0 obj\n<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + n + " >>\nendobj\n");
  jpegs.forEach(function(j, i){
    var pw = j.pw || 595.28, ph = +(pw*j.h/j.w).toFixed(2), po = 3 + 3*i, co = po + 1, io = po + 2;
    var content = "q " + pw + " 0 0 " + ph + " 0 0 cm /Im0 Do Q";
    offs[po] = len; push(po + " 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pw + " " + ph + "] /Resources << /XObject << /Im0 " + io + " 0 R >> >> /Contents " + co + " 0 R >>\nendobj\n");
    offs[co] = len; push(co + " 0 obj\n<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream\nendobj\n");
    offs[io] = len; push(io + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + j.w + " /Height " + j.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + j.bytes.length + " >>\nstream\n");
    push(j.bytes); push("\nendstream\nendobj\n");
  });
  var total = 3 + 3*n, xref = len, x = "xref\n0 " + total + "\n0000000000 65535 f \n";
  for (var k = 1; k < total; k++) x += ("0000000000" + offs[k]).slice(-10) + " 00000 n \n";
  push(x + "trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF");
  return new Blob(parts, {type:"application/pdf"});
}
function exportPids(pids, name){
  toast("Préparation du PDF…");
  Promise.all(pids.map(composePage)).then(function(cs){
    return Promise.all(cs.map(function(c){ return new Promise(function(res){ c.toBlob(function(b){ b.arrayBuffer().then(function(ab){ res({bytes:new Uint8Array(ab), w:c.width, h:c.height}); }); }, "image/jpeg", .92); }); }));
  }).then(function(js){
    var url = URL.createObjectURL(buildPdf(js)), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); toast("PDF téléchargé : " + name);
  }).catch(function(e){ toast("L'export a échoué : " + e.message); });
}
function printPids(pids){
  Promise.all(pids.map(composePage)).then(function(cs){
    var z = document.getElementById("printzone");
    z.innerHTML = cs.map(function(c){ return '<img alt="" src="' + c.toDataURL("image/jpeg", .92) + '">'; }).join("");
    document.body.classList.add("printing");
    function done(){ document.body.classList.remove("printing"); z.innerHTML = ""; window.removeEventListener("afterprint", done); }
    window.addEventListener("afterprint", done);
    setTimeout(function(){ window.print(); }, 150);
  }).catch(function(e){ toast("L'impression a échoué : " + e.message); });
}


/* Fenêtre au clic sur un point de la frise */
var pop = null, popAnchor = null, dragMoved = false;
function findQ(key){ var i = parseInt(key.slice(1), 10) - 1; return DATA[i]; }
var noteBtnRef = null;
function closePop(){
  if (typeof noteBtn !== "undefined" && noteBtn) { noteBtn.setAttribute("aria-expanded","false"); noteBtn = null; }
  if (pop) { pop.remove(); pop = null; }
  if (popAnchor) { popAnchor.setAttribute("aria-expanded","false"); popAnchor = null; }
}
function openPop(btn, focus){
  var key = btn.getAttribute("data-key"), s = find(key), q = findQ(key);
  closePop();
  popAnchor = btn; btn.setAttribute("aria-expanded","true");
  var el = document.createElement("div");
  el.className = "pop " + s.type + (s.dispo ? "" : " todo");
  el.setAttribute("role","dialog"); el.setAttribute("aria-label", s.label);
  el.innerHTML = '<span class="arrow"></span><button class="x" type="button" aria-label="Fermer">&times;</button>'+
    '<span class="kind">'+s.label+' · Séquence '+q.n+'</span>'+
    (s.dispo
      ? '<h3>'+esc(s.titre)+'</h3>'+actions(s,false)
      : '<h3>En construction</h3><p>La fiche n\'a pas encore été ajoutée.</p><div class="actions"><a class="btn primary" href="#/construction/'+s.key+'">Ouvrir la page</a></div>');
  document.body.appendChild(el); pop = el;
  var r = btn.getBoundingClientRect(), dr = btn.querySelector(".dot").getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
  var cx = dr.left + dr.width/2, left = Math.max(8, Math.min(window.innerWidth - w - 8, cx - w/2));
  var below = r.bottom + 12 + hh < window.innerHeight || r.top - 12 - hh < 0;
  el.style.left = left + "px";
  el.style.top = (below ? r.bottom + 12 : r.top - 12 - hh) + "px";
  if (!below) el.classList.add("above");
  el.querySelector(".arrow").style.left = Math.max(12, Math.min(w - 26, cx - left - 6)) + "px";
  if (focus) { var first = el.querySelector(".btn"); if (first) first.focus({preventScroll:true}); }
}
document.addEventListener("click", function(e){
  var ib = e.target.closest && e.target.closest(".info");
  if (ib) { if (ib === noteBtn) closePop(); else openNote(ib); return; }
  var stop = e.target.closest && e.target.closest(".stop");
  if (stop) { if (dragMoved) return; if (stop === popAnchor) { if (e.detail === 0) closePop(); } else openPop(stop, e.detail === 0); return; }
  if (pop && pop.contains(e.target)) {
    if (e.target.closest(".x")) { closePop(); return; }
    var b = e.target.closest("button[data-act]");
    if (b) { var s = find(b.getAttribute("data-key")); closePop(); openViewer(s, b.getAttribute("data-act") === "print"); }
    else if (e.target.closest("a")) { setTimeout(closePop, 0); }
    return;
  }
  closePop();
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePop(); });
/* Ouverture au survol (souris) : la fenêtre reste ouverte tant que la souris est sur le point ou sur la fenêtre */
var hoverT = null;
function cancelClose(){ clearTimeout(hoverT); }
function schedClose(){ cancelClose(); hoverT = setTimeout(closePop, 300); }
document.addEventListener("pointerover", function(e){
  if (e.pointerType !== "mouse" || dragMoved) return;
  var st = e.target.closest && e.target.closest(".stop");
  if (st) { cancelClose(); if (st !== popAnchor) openPop(st, false); return; }
  if (pop && pop.contains(e.target)) cancelClose();
});
document.addEventListener("pointerout", function(e){
  if (e.pointerType !== "mouse" || (pop && pop.classList.contains("note"))) return;
  var from = e.target.closest && e.target.closest(".stop"), inPop = pop && pop.contains(e.target);
  if (!from && !inPop) return;
  var to = e.relatedTarget;
  if (to && to.closest && ((from && to.closest(".stop") === from) || (pop && pop.contains(to)))) return;
  schedClose();
});
window.addEventListener("resize", closePop);
window.addEventListener("scroll", closePop, {passive:true});

function initFrise(){
  var sc = document.getElementById("hscroll"); if (!sc) return;
  var down = false, sx = 0, sl = 0;
  sc.addEventListener("scroll", closePop, {passive:true});
  sc.addEventListener("pointerdown", function(e){ if (e.pointerType !== "mouse") return; down = true; dragMoved = false; sx = e.clientX; sl = sc.scrollLeft; });
  window.addEventListener("pointermove", function(e){
    if (!down) return; var dx = e.clientX - sx;
    if (Math.abs(dx) > 5) { dragMoved = true; sc.classList.add("drag"); }
    if (dragMoved) sc.scrollLeft = sl - dx;
  });
  window.addEventListener("pointerup", function(){ if (!down) return; down = false; sc.classList.remove("drag"); setTimeout(function(){ dragMoved = false; }, 0); });
  function step(d){ var w = sc.querySelector(".hseq").offsetWidth; sc.scrollBy({left: d*w, behavior:"smooth"}); }
  document.getElementById("frise-prev").addEventListener("click", function(){ step(-1); });
  document.getElementById("frise-next").addEventListener("click", function(){ step(1); });
}

document.getElementById("app").addEventListener("change", function(e){
  var c = e.target.closest("input[data-chk]"); if (!c) return;
  var id = c.getAttribute("data-chk");
  if (c.checked) CHECKS[id] = 1; else delete CHECKS[id];
  var td = c.closest("td"); td.classList.toggle("on", c.checked);
  var ex = td.querySelector(".info"); if (ex) ex.remove();
  if (c.checked) td.insertAdjacentHTML("beforeend", infoBtn(id));
  saveChecks();
});
document.getElementById("app").addEventListener("click", function(e){
  if (e.target.closest("#t-pdf")) { exportTable(); return; }
  var v = e.target.closest("button[data-vue]"); if (!v) return;
  TVIEW = v.getAttribute("data-vue");
  try { localStorage.setItem("progression-techno-vue", TVIEW); } catch(x) {}
  var w = document.getElementById("tablewrap"); w.classList.remove("fit","full"); w.classList.add(TVIEW);
  document.querySelectorAll("button[data-vue]").forEach(function(b){ b.setAttribute("aria-pressed", String(b === v)); });
  closePop(); headerOffset();
});
function headerOffset(){
  var hd = document.querySelector("header.top"); if (hd) document.documentElement.style.setProperty("--hb", hd.offsetHeight + "px");
  var th = document.querySelector("thead th[colspan]");
  if (th) document.documentElement.style.setProperty("--h1", th.getBoundingClientRect().height + "px");
}
window.addEventListener("resize", headerOffset);

/* Sauvegarde / restauration (changement d'appareil) */
function backupKeys(){ var k = []; try { for (var i = 0; i < localStorage.length; i++) { var n = localStorage.key(i); if (/^(progression-techno|classeur-eleve)/.test(n)) k.push(n); } } catch(e) {} return k; }
function openBackup(){
  var old = document.getElementById("bk"); if (old) { old.remove(); return; }
  var d = document.createElement("div"); d.id = "bk"; d.className = "bk"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Sauvegarde");
  d.innerHTML = '<button class="x" type="button" aria-label="Fermer">&times;</button><h3>Sauvegarde de mes données</h3>'+
    '<p>Tes cases cochées, tes précisions et ton classeur (ce que tu as écrit) sont gardés <b>dans ce navigateur seulement</b>. Pour les retrouver sur un autre ordinateur ou un téléphone :</p>'+
    '<ol><li>ici, clique sur <b>Enregistrer</b> : un fichier est téléchargé ;</li><li>sur l\'autre appareil, ouvre le site, puis clique sur <b>Restaurer</b> et choisis ce fichier.</li></ol>'+
    '<div class="bk-btns"><button type="button" class="btn primary" id="bk-save">Enregistrer ma sauvegarde</button><button type="button" class="btn" id="bk-load">Restaurer une sauvegarde</button></div>'+
    '<input type="file" id="bk-file" accept=".json,application/json" hidden><p class="hint">Restaurer remplace les données de cet appareil.</p>';
  document.body.appendChild(d);
  d.querySelector(".x").addEventListener("click", function(){ d.remove(); });
  document.getElementById("bk-save").addEventListener("click", function(){
    var data = {app:"progression-techno", version:1, date:new Date().toISOString(), data:{}};
    backupKeys().forEach(function(k){ data.data[k] = localStorage.getItem(k); });
    var b = new Blob([JSON.stringify(data)], {type:"application/json"}), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = "sauvegarde-techno-" + new Date().toISOString().slice(0,10) + ".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000); toast("Sauvegarde téléchargée. Garde ce fichier précieusement.");
  });
  var fi = document.getElementById("bk-file");
  document.getElementById("bk-load").addEventListener("click", function(){ fi.click(); });
  fi.addEventListener("change", function(){
    var f = fi.files[0]; if (!f) return; var r = new FileReader();
    r.onload = function(){
      try {
        var o = JSON.parse(r.result); if (!o || o.app !== "progression-techno" || !o.data) throw new Error("fichier non reconnu");
        backupKeys().forEach(function(k){ localStorage.removeItem(k); });
        Object.keys(o.data).forEach(function(k){ if (/^(progression-techno|classeur-eleve)/.test(k)) localStorage.setItem(k, o.data[k]); });
        toast("Sauvegarde restaurée, rechargement…"); setTimeout(function(){ location.reload(); }, 700);
      } catch(e) { toast("Restauration impossible : " + e.message); }
    };
    r.readAsText(f);
  });
}
document.getElementById("save-btn").addEventListener("click", openBackup);
document.getElementById("role-switch").addEventListener("click", clearRole);
document.querySelectorAll("#lvl button").forEach(function(b){ b.addEventListener("click", function(){
  var l = b.getAttribute("data-lvl"); if (l === LEVEL) return;
  try { localStorage.setItem("progression-techno-niveau", l); } catch(e) {}
  location.reload();
}); });
window.addEventListener("hashchange", route);
applyRole();
if (ROLE === "eleve" && !/^#\/classeur/.test(location.hash)) location.hash = "#/classeur";
route();
