<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Quête des Mots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --ink: #142033;
    --ink-soft: #3a4a63;
    --bg: #eef2f6;
    --bg-deep: #10213a;
    --bg-deep-2: #1b3358;
    --paper: #fffdf7;
    --paper-line: #e7ded0;
    --gold: #e7a92c;
    --gold-dark: #b9791a;
    --grammaire: #2f8f5b;
    --grammaire-soft: #d9f0e3;
    --conjugaison: #e85d4e;
    --conjugaison-soft: #fbe1dc;
    --defi: #6a4fc0;
    --defi-soft: #e7e0fb;
    --locked: #b9c2cf;
    --ok: #2f8f5b;
    --ko: #d64545;
    --shadow: rgba(16,33,58,.18);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1626;
      --paper: #182946;
      --paper-line: #2b3f5f;
      --ink: #eef2f6;
      --ink-soft: #b7c3d6;
      --shadow: rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1626;
    --paper: #182946;
    --paper-line: #2b3f5f;
    --ink: #eef2f6;
    --ink-soft: #b7c3d6;
    --shadow: rgba(0,0,0,.45);
  }
  html, body { height: 100%; margin: 0; }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  h1, h2, h3, .display { font-family: 'Baloo 2', sans-serif; margin: 0; }
  button { font-family: inherit; cursor: pointer; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; display: flex; flex-direction: column; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
    color: #fff; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 6px 16px var(--shadow);
  }
  .topbar .title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .stat-pills { display: flex; gap: 8px; }
  .pill { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2); border-radius: 999px;
    padding: 5px 11px; font-size: .78rem; font-weight: 700; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .nav-tabs { display: flex; gap: 6px; padding: 10px 16px; background: var(--bg-deep-2); }
  .nav-tab { flex: 1; background: rgba(255,255,255,.08); border: none; color: rgba(255,255,255,.75);
    padding: 9px 6px; border-radius: 10px; font-weight: 700; font-size: .85rem; }
  .nav-tab.active { background: var(--gold); color: #10213a; }
  .back-row { display:flex; align-items:center; gap:10px; padding: 12px 16px 0; }
  .back-btn { border:none; background: var(--paper); color: var(--ink-soft); font-weight:800; font-size:.82rem;
    padding: 7px 13px; border-radius: 999px; box-shadow: 0 3px 8px var(--shadow); display:flex; align-items:center; gap:6px; }

  /* ---------- World hub ---------- */
  .worlds-wrap { flex:1; padding: 22px 18px 50px; }
  .worlds-wrap h1.display { font-size: 1.4rem; margin-bottom: 4px; }
  .worlds-wrap p.sub { color: var(--ink-soft); font-size: .88rem; margin-bottom: 18px; }
  .world-card { display:flex; align-items:center; gap:14px; background: var(--paper); border:1px solid var(--paper-line);
    border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 4px 12px var(--shadow); position:relative; }
  .world-card .w-icon { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; flex-shrink:0; }
  .world-card .w-body { flex:1; min-width:0; }
  .world-card .w-name { font-weight:800; font-size: .98rem; margin-bottom:4px; }
  .world-card .w-track { height:8px; background: var(--paper-line); border-radius:999px; overflow:hidden; }
  .world-card .w-fill { height:100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); border-radius:999px; }
  .world-card .w-count { font-size:.72rem; font-weight:700; color: var(--ink-soft); margin-top:4px; }
  .world-card .w-chev { font-size: 1.1rem; color: var(--ink-soft); flex-shrink:0; }
  .world-card.locked { opacity: .55; }

  /* ---------- Map screen (inside a world) ---------- */
  .map-wrap { flex: 1; padding: 20px 20px 60px; position: relative; }
  .map-path { position: relative; max-width: 320px; margin: 0 auto; }
  .node-row { display: flex; justify-content: center; margin-bottom: 6px; }
  .node-row.left { justify-content: flex-start; }
  .node-row.right { justify-content: flex-end; }
  .level-node { position: relative; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 0 22px; }
  .node-btn { width: 66px; height: 66px; border-radius: 50%; border: none; font-size: 1.7rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 0 rgba(0,0,0,.18), 0 8px 14px var(--shadow); position: relative; transition: transform .12s ease; }
  .node-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .node-btn.locked { background: var(--locked); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.1); }
  .node-btn.grammaire { background: var(--grammaire); }
  .node-btn.conjugaison { background: var(--conjugaison); }
  .node-btn.defi { background: var(--defi); }
  .node-btn.done { outline: 3px solid var(--gold); outline-offset: 3px; }
  .node-num { position: absolute; top: -6px; right: -6px; background: var(--paper); color: var(--ink);
    border-radius: 999px; font-size: .64rem; font-weight: 800; padding: 2px 6px; border: 2px solid var(--bg); }
  .node-label { font-size: .66rem; font-weight: 700; text-align: center; color: var(--ink-soft); line-height: 1.15; max-width: 84px; }
  .node-stars { font-size: .6rem; letter-spacing: 1px; color: var(--gold); height: 12px; }

  .map-header { text-align: center; margin-bottom: 18px; }
  .map-header .display { font-size: 1.3rem; color: var(--ink); }
  .map-header p { color: var(--ink-soft); font-size: .88rem; margin-top: 4px; }

  .progress-band { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 16px; padding: 12px 16px;
    margin: 0 0 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 10px var(--shadow); max-width:320px; margin-left:auto; margin-right:auto; }
  .progress-band .bar-track { flex: 1; height: 10px; background: var(--paper-line); border-radius: 999px; overflow: hidden; }
  .progress-band .bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); border-radius: 999px; transition: width .4s ease; }
  .progress-band .bar-txt { font-size: .76rem; font-weight: 800; color: var(--ink-soft); white-space: nowrap; }

  /* ---------- Level intro sheet ---------- */
  .sheet-overlay { position: fixed; inset: 0; background: rgba(10,18,32,.55); display: flex; align-items: flex-end; z-index: 40; }
  .sheet { background: var(--paper); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 22px 22px 0 0;
    padding: 26px 24px calc(env(safe-area-inset-bottom, 0px) + 26px); text-align: center; animation: slideUp .22s ease; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0;} to { transform: translateY(0); opacity: 1; } }
  .sheet .badge-icon { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 2.4rem; margin: 0 auto 14px; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
  .sheet h2 { font-size: 1.2rem; margin-bottom: 6px; }
  .sheet .cat-tag { display: inline-block; font-size: .72rem; font-weight: 800; padding: 4px 10px; border-radius: 999px; margin-bottom: 12px; }
  .sheet p.desc { color: var(--ink-soft); font-size: .92rem; margin-bottom: 20px; }
  .btn-primary { width: 100%; border: none; background: var(--gold); color: #10213a; font-weight: 800; font-size: 1rem;
    padding: 15px; border-radius: 14px; box-shadow: 0 4px 0 var(--gold-dark); }
  .btn-primary:active { transform: translateY(3px); box-shadow: none; }
  .btn-secondary { width: 100%; border: none; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: .9rem; padding: 12px; margin-top: 6px; }

  /* ---------- Quiz screen ---------- */
  .quiz-wrap { flex: 1; display: flex; flex-direction: column; padding: 16px 20px 30px; }
  .quiz-top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .close-x { border: none; background: var(--paper); width: 36px; height: 36px; border-radius: 50%; font-size: 1rem;
    color: var(--ink-soft); box-shadow: 0 2px 6px var(--shadow); flex-shrink: 0; }
  .quiz-progress { flex: 1; height: 9px; background: var(--paper-line); border-radius: 999px; overflow: hidden; display: flex; gap: 2px; }
  .quiz-progress .seg { flex: 1; background: var(--paper-line); }
  .quiz-progress .seg.filled { background: var(--gold); }
  .quiz-progress .seg.current { background: var(--ink-soft); }

  .q-card { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 18px; padding: 20px;
    box-shadow: 0 6px 16px var(--shadow); margin-bottom: 18px; }
  .q-eyebrow { font-size: .72rem; font-weight: 800; color: var(--ink-soft); margin-bottom: 8px; }
  .q-text { font-size: 1.08rem; font-weight: 700; line-height: 1.4; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { text-align: left; background: var(--paper); border: 2px solid var(--paper-line); border-radius: 14px;
    padding: 13px 15px; font-size: .96rem; font-weight: 700; color: var(--ink); display: flex; align-items: center;
    justify-content: space-between; transition: background .12s ease, border-color .12s ease; }
  .choice-btn.correct { background: var(--grammaire-soft); border-color: var(--ok); color: var(--ok); }
  .choice-btn.wrong { background: var(--conjugaison-soft); border-color: var(--ko); color: var(--ko); }
  .choice-btn:disabled { opacity: .85; }

  .feedback-box { margin-top: 16px; padding: 14px 16px; border-radius: 14px; font-size: .87rem; font-weight: 600; line-height: 1.4; display: none; }
  .feedback-box.show { display: block; }
  .feedback-box.ok-fb { background: var(--grammaire-soft); color: var(--ok); }
  .feedback-box.ko-fb { background: var(--conjugaison-soft); color: var(--ko); }

  .quiz-footer { margin-top: auto; }

  /* ---------- Result screen ---------- */
  .result-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px 24px; text-align: center; }
  .result-medal { width: 116px; height: 116px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 3.2rem; margin-bottom: 16px; box-shadow: 0 8px 0 rgba(0,0,0,.15); }
  .result-wrap h2 { font-size: 1.4rem; margin-bottom: 6px; }
  .result-wrap p.sub { color: var(--ink-soft); margin-bottom: 18px; }
  .result-stats { display: flex; gap: 12px; margin-bottom: 22px; }
  .rstat { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 14px; padding: 11px 16px; box-shadow: 0 4px 10px var(--shadow); }
  .rstat .num { font-family: 'Baloo 2', sans-serif; font-size: 1.3rem; font-weight: 700; }
  .rstat .lab { font-size: .68rem; color: var(--ink-soft); font-weight: 700; }
  .new-badge-strip { background: var(--paper); border: 2px dashed var(--gold); border-radius: 16px; padding: 14px 18px;
    margin-bottom: 20px; display: flex; align-items: center; gap: 12px; max-width: 320px; }
  .new-badge-strip .emo { font-size: 2rem; }
  .new-badge-strip .txt { text-align: left; }
  .new-badge-strip .txt strong { display: block; font-size: .9rem; }
  .new-badge-strip .txt span { font-size: .78rem; color: var(--ink-soft); }
  .result-actions { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- Badges screen ---------- */
  .badges-wrap { flex: 1; padding: 20px 20px 50px; }
  .badges-wrap h2 { font-size: 1.15rem; margin-bottom: 4px; }
  .badges-wrap p.sub { color: var(--ink-soft); font-size: .85rem; margin-bottom: 16px; }
  .badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .badge-cell { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 14px; padding: 10px 6px;
    text-align: center; box-shadow: 0 3px 8px var(--shadow); }
  .badge-cell .ic { font-size: 1.5rem; margin-bottom: 4px; }
  .badge-cell.locked .ic { filter: grayscale(1); opacity: .35; }
  .badge-cell.locked .nm { opacity: .45; }
  .badge-cell .nm { font-size: .6rem; font-weight: 800; line-height: 1.15; }
  .section-title { font-size: .76rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; margin: 20px 0 10px; }

  .confetti-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
  .confetti-piece { position: absolute; top: -20px; width: 8px; height: 14px; opacity: .9; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(400deg); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    .confetti-piece { animation: none; display: none; }
  }

  .login-wrap { flex:1; padding: 28px 22px 50px; display:flex; flex-direction:column; }
  .login-hero { text-align:center; margin-bottom: 22px; }
  .login-hero .big { font-size: 3rem; }
  .login-hero h1 { font-size: 1.6rem; margin-top: 4px; }
  .login-hero p { color: var(--ink-soft); font-size: .92rem; margin: 6px 0 0; }
  .card { background: var(--paper); border:1px solid var(--paper-line); border-radius: 18px; padding: 18px; box-shadow: 0 4px 12px var(--shadow); margin-bottom: 14px; }
  .card h3 { font-size: 1.02rem; margin-bottom: 10px; }
  .card p.hint { color: var(--ink-soft); font-size: .82rem; margin: 0 0 10px; }
  .txt-input { width:100%; font-family: inherit; font-size: 1rem; font-weight: 700; padding: 13px 14px; border-radius: 12px;
    border: 2px solid var(--paper-line); background: var(--bg); color: var(--ink); margin-bottom: 10px; outline: none; }
  .txt-input:focus { border-color: var(--gold); }
  .profile-list { display:flex; flex-direction:column; gap: 8px; }
  .profile-btn { display:flex; align-items:center; gap: 12px; text-align:left; width:100%; background: var(--bg); border: 2px solid var(--paper-line);
    border-radius: 14px; padding: 11px 13px; color: var(--ink); font-weight: 700; font-size: .95rem; }
  .profile-btn .av { width: 38px; height: 38px; border-radius: 50%; background: var(--gold); color:#10213a; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; }
  .profile-btn .meta { font-size: .74rem; color: var(--ink-soft); font-weight: 600; }
  .row-btns { display:flex; gap: 10px; }
  .row-btns > * { flex:1; }
  .btn-outline { width:100%; border: 2px solid var(--paper-line); background: var(--paper); color: var(--ink); font-weight: 800; font-size: .92rem;
    padding: 13px; border-radius: 14px; }
  .btn-outline:active { transform: translateY(2px); }
  .btn-danger { border-color: var(--ko); color: var(--ko); }
  .btn-prof { width:100%; border:none; background: var(--bg-deep); color:#fff; font-weight:800; font-size:.9rem; padding: 13px; border-radius: 14px; margin-top: 6px; }
  .err { color: var(--ko); font-size: .82rem; font-weight: 700; min-height: 1.1em; margin: -4px 0 8px; }

  .modal-overlay { position: fixed; inset:0; background: rgba(10,18,32,.55); z-index: 70; display:flex; align-items:center; justify-content:center; padding: 20px; }
  .modal { background: var(--paper); border-radius: 20px; padding: 22px; width:100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .modal h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .modal p { color: var(--ink-soft); font-size: .9rem; margin: 0 0 14px; line-height: 1.4; }
  .modal .row-btns { margin-top: 6px; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); background: var(--bg-deep);
    color: #fff; padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: .88rem; z-index: 80; box-shadow: 0 6px 18px rgba(0,0,0,.3); max-width: 90%; text-align:center; }

  .account-wrap, .prof-wrap { flex:1; padding: 20px 18px 50px; }
  .stat-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-box { background: var(--paper); border:1px solid var(--paper-line); border-radius: 14px; padding: 12px; text-align:center; box-shadow: 0 3px 8px var(--shadow); }
  .stat-box .n { font-family: 'Baloo 2', sans-serif; font-size: 1.4rem; font-weight: 700; }
  .stat-box .l { font-size: .7rem; color: var(--ink-soft); font-weight: 800; text-transform: uppercase; }
  .stack { display:flex; flex-direction:column; gap: 10px; }

  .prof-banner { background: var(--defi); color:#fff; font-weight:800; font-size:.8rem; text-align:center; padding: 7px; }
  .student-row { display:flex; align-items:center; gap: 12px; background: var(--paper); border:1px solid var(--paper-line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px; box-shadow: 0 3px 8px var(--shadow); width:100%; text-align:left; color: var(--ink); }
  .student-row .av { width: 40px; height: 40px; border-radius: 50%; background: var(--gold); color:#10213a; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; }
  .student-row .body { flex:1; min-width:0; }
  .student-row .nm { font-weight: 800; font-size: .95rem; }
  .student-row .sub { font-size: .74rem; color: var(--ink-soft); font-weight: 600; }
  .mini-track { height: 7px; background: var(--paper-line); border-radius: 999px; overflow:hidden; margin-top: 5px; }
  .mini-fill { height:100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); }
  .tag-imp { font-size: .62rem; font-weight: 800; background: var(--defi-soft); color: var(--defi); border-radius: 999px; padding: 2px 7px; margin-left: 6px; vertical-align: middle; }
  .world-line { display:flex; justify-content:space-between; align-items:center; font-size: .84rem; padding: 8px 0; border-bottom: 1px solid var(--paper-line); gap: 10px; }
  .world-line:last-child { border-bottom: none; }
  .world-line .wn { font-weight: 700; }
  .world-line .wv { font-weight: 800; color: var(--ink-soft); white-space: nowrap; }
  .lvl-detail { font-size: .76rem; color: var(--ink-soft); padding: 2px 0 6px 10px; line-height: 1.5; }
  .hidden-input { display:none; }
  :root { --link: #5a3fb0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --link: #c3b3ff; } }
  :root[data-theme="dark"] { --link: #c3b3ff; }
  .lesson-link { display:block; background:none; border:none; color: var(--link); font-weight:800; font-size:.86rem; padding: 12px 0 0; text-align:left; text-decoration: underline; text-underline-offset: 3px; }
  .lesson-link.in-fb { padding-top: 8px; }
  .lesson-overlay { z-index: 75; }
  .lesson-sheet { text-align:left; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .lesson-sheet h2 { font-size: 1.3rem; margin: 2px 0 10px; }
  .lesson-sheet h4 { font-family: 'Baloo 2', sans-serif; font-size: 1rem; margin: 14px 0 6px; color: var(--ink); }
  .lesson-kicker { font-size: .74rem; font-weight: 800; color: var(--link); text-transform: uppercase; letter-spacing: .05em; }
  .lesson-p { font-size: .92rem; line-height: 1.5; color: var(--ink); margin: 0; }
  .lesson-steps { margin: 0; padding-left: 22px; font-size: .9rem; line-height: 1.5; }
  .lesson-steps li { margin-bottom: 6px; }
  .lesson-ex { background: var(--grammaire-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: .9rem; margin-bottom: 8px; line-height: 1.45; }
  .lesson-ex b { color: var(--ok); }
  .lesson-tip { background: #fdf3dc; color: #6a4a10; border-radius: 12px; padding: 10px 12px; font-size: .86rem; line-height: 1.45; margin: 14px 0 18px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lesson-tip { background: #3a2f16; color: #f3dca5; } :root:not([data-theme="light"]) .lesson-ex { background: #1f3b2c; } }
  :root[data-theme="dark"] .lesson-tip { background: #3a2f16; color: #f3dca5; }
  :root[data-theme="dark"] .lesson-ex { background: #1f3b2c; }
  .account-btn { flex: 1.5; border: 2px solid var(--gold); background: transparent; color: #fff; font-weight: 800; font-size: .8rem;
    padding: 7px 6px; border-radius: 10px; white-space: nowrap; }
  .account-btn.active { background: var(--gold); color: #10213a; }
</style>
</head>
<body>

. », quel est le sujet ?", "c": ["souffle", "sur la côte", "Le vent", "violemment"], "a": 2, "e": "Le sujet est « Le vent » : il indique qui fait l'action (on le trouve avec « qui est-ce qui ? »).", "n": "sujet"}, {"q": "Dans la phrase « Au printemps, les arbres deviennent verts. », quelle est la fonction de « Au printemps » ?", "c": ["le complément circonstanciel de lieu", "le complément circonstanciel de temps", "le COD", "le complément circonstanciel de cause"], "a": 1, "e": "« Au printemps » est le complément circonstanciel de temps : il indique quand se passe l'action.", "n": "fonctions"}, {"q": "Dans la phrase « Mon frère travaille sans bruit. », quelle est la nature du mot « bruit » ?", "c": ["un nom", "un adjectif qualificatif", "un pronom", "une préposition"], "a": 0, "e": "Ici, « bruit » est un nom : il désigne une personne, un animal, une chose ou une idée.", "n": "classes"}, {"q": "Quelle phrase est injonctive ?", "c": ["Mon père prépare le dîner.", "Est-ce que le soleil brille ce matin ?", "Sois prudent sur la route !", "Comme les oiseaux chantent dans le jardin !"], "a": 2, "e": "« Sois prudent sur la route ! » est une phrase injonctive.", "n": "types_phrase"}, {"q": "Quelle phrase est injonctive ?", "c": ["Les enfants jouent dans la cour.", "Est-ce que la neige tombe sur la montagne ?", "Ne cours pas dans le couloir !", "Comme mon voisin répare sa voiture !"], "a": 2, "e": "« Ne cours pas dans le couloir ! » est une phrase injonctive.", "n": "types_phrase"}, {"q": "Dans la phrase « Nous partons demain avec nos cousins. », quelle est la nature du mot « cousins » ?", "c": ["un adverbe", "un verbe conjugué", "un pronom", "un nom"], "a": 3, "e": "Ici, « cousins » est un nom : il désigne une personne, un animal, une chose ou une idée.", "n": "classes"}, {"q": "Quelle phrase est exclamative ?", "c": ["Est-ce que les enfants jouent dans la cour ?", "Le boulanger vend du pain frais.", "Écoutez bien la consigne.", "Comme mon voisin répare sa voiture !"], "a": : "ponctuation"}, {"q": "Quel signe de ponctuation faut-il à la place de « _ » ? « Comme ce paysage est beau _ »", "c": [",", ":", "!", "?"], "a": 2, "e": "Il faut le point d'exclamation (!).", "n": "ponctuation"}, {"q": "Comment accorder l'adjectif \"sportif\" dans : « des lampes (sportif) » ?", "c": ["sportifs", "sportives", "sportif", "sportive"], "a": 1, "e": "Avec « des lampes », l'adjectif \"sportif\" s'accorde : sportives.", "n": "accord_adj"}, {"q": "Quelle phrase est correctement écrite ?", "c": ["Elles on fini leurs devoirs.", "Elles ont fini leurs devoirs."], "a": 1, "e": "On écrit « ont » (verbe avoir, remplaçable par « avaient »).", "n": "h_on"}, {"q": "Quel signe de ponctuation faut-il à la place de « _ » ? « Mes amis arrivent demain _ »", "c": [".", ":", "?", "!"], "a": 0, "e": "Il faut le point (.).", "n": "ponctuation"}, {"q": "Quelle phrase est correctement écrite ?", "c": ["Mon frère à un nouveau vélo.", "Mon frère a un nouveau vélo."], "a": 1, "e": "On écrit « a » (remplaçable par « avait »).", "n": "h_a"}, {"q": "Quelle phrase est correctement écrite ?", "c": ["C'est l'endroit ou nous nous sommes rencontrés.", "C'est l'endroit où nous nous sommes rencontrés."], "a": 1, "e": "On écrit « où » (lieu).", "n": "h_ou"}, {"q": "Quel signe de ponctuation faut-il à la place de « _ » ? « Voici la liste _ du pain, du lait et des œufs. »", "c": [":", "?", ",", "!"], "a": 0, "e": "Il faut les deux-points (:).", "n": "ponctuation"}, {"q": "Quel signe de ponctuation faut-il à la place de « _ » ? « Elle a crié _ « Au secours ! » »", "c": [":", ".", "?", ","], "a": 0, "e": "Il faut les deux-points (:).", "n": "ponctuation"}, {"q": "Quelle phrase est correctement écrite ?", "c": ["Elle a oublié ses lunettes.", "Elle a oublié ces lunettes."], "a": 0, "e": "On écrit « ses » (déterminant possessif).", "n": "h_ces"}, {"q": "Comment accorder l'adjectif \"heureux\" dans : « des sacs (heureux) » ?", "c": ["heureuses", "heureux", "heureuse"], "a": 1, "e": "Avec « des sacs », l'adjectif \"heureux\" s'accorde : heureux.", "n": "accord_adj"}, {"q": "Comment accorder l'adjectif \"heureux\" dans : « une voiture (heureux) » ?", "c": ["heureuses", "heureux", "heureuse"], "a": 2, "e": "Avec « une voiture », l'adjectif \"heureux\" s'accorde : heureuse.", "n": "accord_adj"}, {"q": "Comment accorder l'adjectif \"nouveau\" dans : « des tableaus (nouveau) » ?", "c": ["nouveau", "nouveaux", "nouvelles", "nouvelle"], "a": 1, "e": "Avec « des tableaus », l'adjectif \"nouveau\" s'accorde : nouveaux.", "n": "accord_adj"}], "n": "ponctuation"}, {"id": 100, "title": "Défi final : la Quête des Mots", "icon": "🏆", "desc": "Le grand mélange de tout !", "cat": "defi", "q": [{"q": "Quelle est la bonne forme du verbe \"aller\" au passé composé, avec le sujet \"elle\" ?", "c": ["elle est allées", "elle est allée", "elle a allé", "elle est allés"], "a": 1, "e": "Avec \"elle\", aller se conjugue : elle est allée. (auxiliaire être, accord du participe avec le sujet)", "n": "passe_compose"}, {"q": "Par quel pronom peut-on remplacer « ce roman » dans « Léa lit ce roman. » ?", "c": ["y", "en", "le", "leur"], "a": 2, "e": "On remplace « ce roman » par « le ».", "n": "pronoms_compl"}, {"q": "Dans la phrase « Elles dansent gracieusement pendant le spectacle. », quel mot est un nom ?", "c": ["dansent", "gracieusement", "pendant", "spectacle"], "a": 3, "e": "Dans cette phrase, « spectacle » est un nom : il désigne une personne, un animal, une chose ou une idée.", "n": "nom"}, {"q": "Quelle phrase est interrogative ?", "c": ["Est-ce que mon voisin répare sa voiture ?", "Comme les enfants jouent dans la cour !", "Viens ici tout de suite !", "Le facteur distribue le courrier."], "a": 0, "e": "« Est-ce que mon voisin répare sa voiture ? » est une phrase interrogative.", "n": "types_phrase"}, {"q": "Complète : « Demain, nos voisins ___ … » (verbe chanter, futur simple)", "c": ["chanteras", "chanterez", "chanteront", "chanterons"], "a": 2, "e": "On écrit : « Demain, nos voisins chanteront … »", "n": "futur"}, {"q": "Dans la phrase « Sous le pont coule une rivière. », quel est le complément circonstanciel de lieu ?", "c": ["vivent", "une rivière", "Sous le pont", "coule"], "a": 2, "e": "Le complément circonstanciel de lieu est « Sous le pont » : il indique où se passe l'action.", "n": "CCL"}, {"q": "Complète : « Autrefois, je ___ … » (verbe voir, imparfait)", "c": ["voyais", "voyait", "voyiez", "voyions"], "a": 0, "e": "On écrit : « Autrefois, je voyais … »", "n": "imparfait"}, {"q": "Complète : « En ce moment, la directrice ___ … » (verbe chanter, présent)", "c": ["chante", "chantes", "chantent", "chantez"], "a": 0, "e": "On écrit : « En ce moment, la directrice chante … »", "n": "present"}, {"q": "Quelle phrase est correctement écrite ?", "c": ["Ce problème et difficile à résoudre.", "Ce problème est difficile à résoudre."], "a": 1, "e": "On écrit « est » (verbe être).", "n": "h_et"}, {"q": "Dans la phrase « Ce soir, mon oncle cuisine un couscous. », quel est le complément circonstanciel de temps ?", "c": ["Ce soir", "mon oncle", "un couscous", "cuisine"], "a": 0, "e": "Le complément circonstanciel de temps est « Ce soir » : il indique quand se passe l'action.", "n": "CCT"}, {"q": "Complète avec le bon déterminant démonstratif : « ___ hôtel »", "c": ["ces", "cet", "cette", "ce"], "a": 1, "e": "On écrit « cet hôtel » (cet devant un nom masculin commençant par une voyelle ou un h muet).", "n": "det_dem"}, {"q": "Quelle phrase est correctement écrite ?", "c": ["ses enfants sont très sages.", "ces enfants sont très sages."], "a": 1, "e": "On écrit « ces » (déterminant démonstratif, = « those »).", "n": "h_ces"}, {"q": "Quelle est la bonne forme du verbe \"aller\" au passé composé, avec le sujet \"il\" ?", "c": ["il est allée", "il est allés", "il est allé", "il a allé"], "a": 2, "e": "Avec \"il\", aller se conjugue : il est allé. (auxiliaire être, accord du participe avec le sujet)", "n": "passe_compose"}, {"q": "Dans la phrase « Cette maison paraît abandonnée. », quel est l'attribut du sujet ?", "c": ["abandonnée", "Cette maison", "paraît", "Il"], "a": 0, "e": "L'attribut du sujet est « abandonnée » : il suit un verbe d'état (être, sembler, devenir...) et donne une qualité au sujet.", "n": "attribut"}, {"q": "Quelle phrase est exclamative ?", "c": ["Prenez vos cahiers.", "Comme la neige tombe sur la montagne !", "Le boulanger vend du pain frais.", "Est-ce que mon voisin répare sa voiture ?"], "a": 1, "e": "« Comme la neige tombe sur la montagne ! » est une phrase exclamative.", "n": "types_phrase"}, {"q": "Quel est le nom noyau du groupe nominal « les élèves de la classe » ?", "c": ["la", "élèves", "les", "classe"], "a": 1, "e": "Le noyau est « élèves » : c'est le nom principal, les autres mots le complètent.", "n": "noyau"}, {"q": "Dans la phrase « Je range mes livres sous mon lit. », quel mot est un pronom ?", "c": ["Je", "sous", "mes", "lit"], "a": 0, "e": "Dans cette phrase, « Je » est un pronom : il remplace un nom ou désigne une personne.", "n": "pronom"}, {"q": "Dans la phrase « Cette maison ancienne appartient à mon oncle. », quel mot est une préposition ?", "c": ["ancienne", "Cette", "appartient", "à"], "a": 3, "e": "Dans cette phrase, « à » est une préposition : il est invariable et introduit un complément.", "n": "préposition"}, {"q": "Quelle phrase est correctement écrite ?", "c": ["Mon chat et mon chien dorment ensemble.", "Mon chat est mon chien dorment ensemble."], "a": 0, "e": "On écrit « et » (addition).", "n": "h_et"}, {"q": "Complète : « Autrefois, mon frère ___ … » (verbe faire, imparfait)", "c": ["faisions", "faisais", "faisiez", "faisait"], "a": 3, "e": "On écrit : « Autrefois, mon frère faisait … »", "n": "imparfait"}], "n": "passe_compose"}];
var WORLDS = [{"id": 1, "name": "Les classes de mots", "icon": "🔤", "from": 1, "to": 10}, {"id": 2, "name": "Le groupe nominal", "icon": "🧩", "from": 11, "to": 20}, {"id": 3, "name": "Fonctions dans la phrase", "icon": "🎯", "from": 21, "to": 30}, {"id": 4, "name": "Types et formes de phrases", "icon": "❓", "from": 31, "to": 40}, {"id": 5, "name": "Le présent de l'indicatif", "icon": "✏️", "from": 41, "to": 50}, {"id": 6, "name": "Imparfait et futur simple", "icon": "🕰️", "from": 51, "to": 60}, {"id": 7, "name": "Passé composé et accord", "icon": "📸", "from": 61, "to": 70}, {"id": 8, "name": "Conditionnel et impératif", "icon": "💭", "from": 71, "to": 80}, {"id": 9, "name": "Passé simple et les temps", "icon": "📜", "from": 81, "to": 90}, {"id": 10, "name": "Homophones et grande révision", "icon": "🔀", "from": 91, "to": 100}];
var LESSONS = {"nom": {"t": "Le nom", "link": "C'est quoi, un nom ? La méthode", "d": "Le nom désigne une personne, un animal, une chose, un lieu ou une idée. Le nom commun (chien, joie) s'écrit en minuscule, le nom propre (Paul, Paris) avec une majuscule.", "m": ["Essaie de mettre un déterminant devant le mot : « le, la, un, une, mon… ».", "Si ça marche (un chien, la joie, mon école), c'est un nom.", "Un mot qui commence par une majuscule au milieu de la phrase est un nom propre."], "x": ["Le **chat** de **Léa** dort sur le **canapé**.", "La **peur** l'empêche de dormir. (une idée est aussi un nom)"], "tip": "Un même mot peut changer de classe : « la **marche** » est un nom, mais « il marche » est un verbe. Regarde toujours le mot dans sa phrase."}, "verbe": {"t": "Le verbe conjugué", "link": "C'est quoi, un verbe ? La méthode", "d": "Le verbe exprime une action (courir, manger) ou un état (être, sembler). C'est le seul mot qui se conjugue : il change selon la personne et le temps.", "m": ["Change le temps de la phrase en ajoutant « hier » ou « demain » : le mot qui change est le verbe.", "Essaie de l'encadrer par « ne … pas » : il ne court pas.", "Cherche qui fait l'action juste avant : je, tu, il, les enfants…"], "x": ["Le chien **court**. → Demain, le chien courra : « court » est bien le verbe.", "Ma sœur **est** malade. (verbe d'état)"], "tip": "Les verbes d'état (être, paraître, sembler, devenir, rester) ne montrent pas d'action, mais ce sont bien des verbes."}, "adjectif": {"t": "L'adjectif qualificatif", "link": "C'est quoi, un adjectif ? La méthode", "d": "L'adjectif qualificatif donne une caractéristique au nom (sa couleur, sa taille, son caractère…). Il s'accorde en genre et en nombre avec ce nom.", "m": ["Repère un nom, puis demande-toi : « comment est ce nom ? ».", "Essaie d'ajouter « très » devant le mot : très joli ✔ → c'est souvent un adjectif.", "Mets le nom au féminin ou au pluriel : l'adjectif change aussi (un chat noir → des chattes noires)."], "x": ["Un **petit** chat **noir**.", "Cette histoire est **drôle**."], "tip": "« Très » n'est pas un adjectif, c'est un adverbe : il est invariable."}, "adverbe": {"t": "L'adverbe", "link": "C'est quoi, un adverbe ? La méthode", "d": "L'adverbe est un mot invariable : il ne change jamais. Il précise le sens d'un verbe, d'un adjectif ou d'un autre adverbe.", "m": ["Vérifie que le mot ne peut pas se mettre au féminin ou au pluriel.", "Beaucoup d'adverbes se terminent par -ment : rapidement, doucement.", "Il répond souvent à : comment ? quand ? où ? combien ?", "On peut souvent le supprimer sans casser la phrase."], "x": ["Elle parle **doucement**.", "Nous partons **demain**.", "Il est **très** fatigué."], "tip": "Adverbes à connaître par cœur : très, trop, bien, mal, souvent, toujours, jamais, ici, là, hier, demain, déjà, encore, bientôt, vite."}, "déterminant": {"t": "Le déterminant", "link": "C'est quoi, un déterminant ? La méthode", "d": "Le déterminant est le petit mot placé devant le nom. Il indique si le nom est masculin ou féminin, singulier ou pluriel.", "m": ["Repère un nom, puis regarde le petit mot juste avant (parfois avant l'adjectif qui précède le nom).", "Essaie de le supprimer : la phrase devient fausse (« chat dort » ✘).", "Vérifie la famille : article (le, un, des), possessif (mon, ton, son…), démonstratif (ce, cet, cette, ces)."], "x": ["**Le** chat dort sur **mon** lit.", "**Ces** fleurs sont belles."], "tip": "Devant un verbe, « le, la, les » ne sont pas des déterminants mais des pronoms : « je **le** vois »."}, "pronom": {"t": "Le pronom", "link": "C'est quoi, un pronom ? La méthode", "d": "Le pronom remplace un nom ou un groupe nominal déjà cité, ou désigne une personne (je, tu, nous…).", "m": ["Cherche un mot qui prend la place d'un groupe nominal : « Léa chante » → « **Elle** chante ».", "Un pronom n'est jamais suivi d'un nom (sinon c'est un déterminant).", "Pronoms personnels : je, tu, il, elle, nous, vous, ils, elles, me, te, se, le, la, lui, leur, y, en."], "x": ["**Nous** partons demain.", "Ce livre ? **Je** **le** lis."], "tip": "Autres pronoms fréquents : celui, celle, ceux, qui, que, dont, chacun, rien, quelqu'un."}, "préposition": {"t": "La préposition", "link": "C'est quoi, une préposition ? La méthode", "d": "La préposition est un mot invariable qui introduit un complément (un groupe nominal, un pronom ou un infinitif).", "m": ["Cherche un petit mot invariable placé juste avant un groupe nominal : « **dans** la cour ».", "Récite la phrase mémo : « Adam part pour Anvers avec deux cents sous » = à, dans, par, pour, en, vers, avec, de, sans, sous.", "Le groupe qu'elle introduit répond souvent à : où ? avec qui ? pour quoi ?"], "x": ["Il joue **dans** le jardin **avec** son chien.", "Je travaille **pour** réussir."], "tip": "Autres prépositions : sur, chez, entre, contre, pendant, depuis, malgré, parmi, selon, vers."}, "conjonction": {"t": "La conjonction", "link": "C'est quoi, une conjonction ? La méthode", "d": "La conjonction relie des mots, des groupes ou des propositions. Les conjonctions de coordination sont : mais, ou, et, donc, or, ni, car.", "m": ["Cherche le mot qui sert de « pont » entre deux éléments.", "Retiens la phrase mémo : « Mais où est donc Ornicar ? » = mais, ou, et, donc, or, ni, car.", "Quand, lorsque, puisque, parce que, si sont des conjonctions de subordination."], "x": ["Il pleut **mais** il fait chaud.", "Je reste **car** je suis malade."], "tip": "Ne confonds pas « ou » (conjonction, = ou bien) et « où » (lieu)."}, "det_types": {"t": "Les familles de déterminants", "link": "Articles, possessifs, démonstratifs : la méthode", "d": "Il existe plusieurs familles de déterminants : articles définis (le, la, les, l'), articles indéfinis (un, une, des), possessifs (mon, ton, son, notre, votre, leur…) et démonstratifs (ce, cet, cette, ces).", "m": ["Article défini : on parle d'une chose précise, connue (le livre de Paul).", "Article indéfini : on parle de n'importe laquelle (un livre).", "Possessif : on peut ajouter « à moi, à toi, à lui » (mon livre = le livre à moi).", "Démonstratif : on peut ajouter « -ci » ou « -là », ou montrer du doigt (ce livre-là)."], "x": ["**Le** chien de **mon** voisin.", "**Cette** maison est **une** merveille."], "tip": "« Leur » devant un nom est un possessif (leur maison), mais devant un verbe c'est un pronom (je leur parle)."}, "det_dem": {"t": "Ce, cet, cette ou ces ?", "link": "Ce, cet, cette, ces : la méthode", "d": "Le déterminant démonstratif montre la chose dont on parle. Il s'accorde avec le nom.", "m": ["Le nom est-il masculin ou féminin ? (dis « un » ou « une » devant).", "Est-il singulier ou pluriel ?", "Pluriel → ces. Féminin singulier → cette.", "Masculin singulier : devant une consonne → ce ; devant une voyelle ou un h muet → cet."], "x": ["**ce** livre, **cet** arbre, **cet** hôtel", "**cette** maison, **ces** fleurs"], "tip": "« Cet » sert seulement à faciliter la prononciation : on ne dit pas « ce arbre »."}, "det_poss": {"t": "Mon, ma ou mes ?", "link": "Mon, ma, mes : la méthode", "d": "Le déterminant possessif indique à qui appartient la chose. Il s'accorde avec le nom qui le suit.", "m": ["Pluriel → mes (mes livres).", "Masculin singulier → mon (mon vélo).", "Féminin singulier → ma (ma sœur)…", "… sauf si le nom commence par une voyelle ou un h muet : on dit alors « mon » (mon école, mon amie, mon histoire)."], "x": ["**ma** trousse, **mon** cahier, **mes** affaires", "**mon** idée (idée est féminin, mais commence par une voyelle)"], "tip": "Même règle pour ton/ta/tes et son/sa/ses : « son amie », « ton école »."}, "accord_adj": {"t": "L'accord de l'adjectif", "link": "Accorder l'adjectif : la méthode", "d": "L'adjectif qualificatif prend le genre (masculin/féminin) et le nombre (singulier/pluriel) du nom qu'il qualifie.", "m": ["Trouve le nom que l'adjectif qualifie.", "Le nom est féminin ? Ajoute un -e (s'il n'y en a pas déjà un).", "Le nom est pluriel ? Ajoute un -s (sauf si l'adjectif finit déjà par -s ou -x).", "Vérifie les cas particuliers ci-dessous."], "x": ["un pull **vert** → une robe **verte** → des robes **vertes**", "un garçon **heureux** → une fille **heureuse**"], "tip": "Cas particuliers : -eux → -euse, -f → -ve (sportive), blanc → blanche, gentil → gentille, beau → belle/beaux, vieux → vieille, nouveau → nouvelle/nouveaux."}, "place_adj": {"t": "La place de l'adjectif", "link": "Avant ou après le nom ? La méthode", "d": "En français, l'adjectif se place le plus souvent après le nom. Quelques adjectifs courts et très fréquents se placent avant.", "m": ["Couleurs, formes, nationalités, adjectifs longs → après le nom (une voiture rouge, un ballon rond).", "Adjectifs de beauté, d'âge, de qualité, de taille → avant le nom : beau, joli, bon, mauvais, jeune, vieux, nouveau, grand, petit, gros, long.", "En cas de doute, dis les deux versions à voix haute : l'une sonne faux."], "x": ["une **belle** maison / une maison **blanche**", "un **petit** chat **noir**"], "tip": "Astuce mémo : avant le nom = Beauté, Âge, Bonté, Taille."}, "noyau": {"t": "Le nom noyau du groupe nominal", "link": "Trouver le nom noyau : la méthode", "d": "Le groupe nominal est construit autour d'un nom principal : le noyau. Les autres mots (déterminant, adjectif, complément) le complètent.", "m": ["Supprime un à un les mots qui peuvent l'être : le mot qui reste indispensable est le noyau.", "C'est toujours un nom, souvent juste après le déterminant.", "S'il y a « de » + un autre nom, le noyau est le premier nom : « le vélo de mon frère » → vélo.", "C'est le noyau qui commande les accords."], "x": ["la grande **maison** blanche", "la porte du garage → noyau : **porte**"], "tip": "Dans « une tasse de chocolat », on parle d'une tasse : le noyau est « tasse », pas « chocolat »."}, "expansions": {"t": "Les expansions du nom", "link": "Épithète, complément du nom, relative : la méthode", "d": "Une expansion enrichit le nom noyau. Il en existe trois sortes : l'adjectif épithète, le complément du nom et la proposition subordonnée relative.", "m": ["Repère d'abord le nom noyau.", "Un adjectif collé au nom → adjectif épithète (la maison blanche).", "Une préposition (de, à, en…) + un nom → complément du nom (la maison de mes parents).", "Qui, que, dont, où + un verbe conjugué → proposition relative (la maison qui brûle)."], "x": ["un livre **intéressant** (épithète)", "le vélo **de Paul** (complément du nom)", "le chien **qui aboie** (relative)"], "tip": "Toutes les expansions peuvent être supprimées : le groupe nominal reste correct (la maison)."}, "sujet": {"t": "Le sujet", "link": "C'est quoi, le sujet ? La méthode", "d": "Le sujet indique qui fait l'action ou de qui (de quoi) on parle. Le verbe s'accorde toujours avec lui.", "m": ["Trouve d'abord le verbe conjugué.", "Pose la question « Qui est-ce qui + verbe ? » ou « Qu'est-ce qui + verbe ? ».", "Vérifie en encadrant avec « c'est … qui » : C'est mon frère qui prépare.", "Attention, il peut être placé après le verbe (sujet inversé)."], "x": ["**Mon frère** prépare le repas.", "Dans la forêt vivent **de nombreux animaux**. (sujet inversé)"], "tip": "Le sujet n'est pas toujours le premier mot : « Chaque matin, **mon frère** prépare… »."}, "COD": {"t": "Le complément d'objet direct (COD)", "link": "C'est quoi, un COD ? La méthode", "d": "Le COD complète le verbe directement, sans préposition. Il est en général impossible à supprimer ou à déplacer.", "m": ["Trouve le verbe et le sujet.", "Pose la question : sujet + verbe + « qui ? » ou « quoi ? ».", "La réponse, si elle n'a pas de préposition devant, est le COD.", "Vérifie : on peut le remplacer par « le, la, les ou l' »."], "x": ["Léa lit **un roman**. → Léa lit quoi ? un roman → Léa **le** lit.", "Les élèves écoutent **le professeur**."], "tip": "Ne confonds pas avec l'attribut : après « être, sembler, devenir… », ce n'est pas un COD."}, "COI": {"t": "Le complément d'objet indirect (COI)", "link": "C'est quoi, un COI ? La méthode", "d": "Le COI complète le verbe à l'aide d'une préposition (à, de, au, aux, du…).", "m": ["Trouve le verbe.", "Pose la question : verbe + « à qui ? à quoi ? de qui ? de quoi ? ».", "Si la réponse commence par une préposition, c'est un COI.", "Vérifie : on peut le remplacer par « lui, leur, y ou en »."], "x": ["Les enfants obéissent **à leurs parents**. → ils **leur** obéissent.", "Nous parlons **de nos vacances**."], "tip": "Ne confonds pas avec le CC de lieu : « Il va à Paris » répond à « où ? » → c'est un CC de lieu."}, "attribut": {"t": "L'attribut du sujet", "link": "C'est quoi, un attribut du sujet ? La méthode", "d": "L'attribut du sujet donne une caractéristique au sujet. Il se trouve après un verbe d'état.", "m": ["Regarde le verbe : est-ce un verbe d'état ? (être, paraître, sembler, devenir, rester, demeurer, avoir l'air).", "Si oui, le mot ou groupe qui suit et qui décrit le sujet est l'attribut.", "Test : remplace le verbe par « est » → Julie semble fatiguée = Julie est fatiguée.", "L'attribut s'accorde avec le sujet."], "x": ["Julie semble **fatiguée**.", "Paul deviendra **un grand médecin**."], "tip": "« Julie est dans le jardin » : « dans le jardin » indique un lieu, ce n'est pas un attribut."}, "CCL": {"t": "Le complément circonstanciel de lieu", "link": "C'est quoi, un CC de lieu ? La méthode", "d": "Le complément circonstanciel de lieu indique où se passe l'action.", "m": ["Pose la question « où ? » après le verbe.", "Vérifie qu'on peut souvent le déplacer ou le supprimer.", "Il commence souvent par une préposition : dans, sur, sous, à, chez, devant…"], "x": ["Le chat dort **sur le canapé**.", "**Sur la plage**, les enfants jouent."], "tip": "« Il pense à la mer » : « à la mer » répond à « à quoi ? » → c'est un COI, pas un lieu."}, "CCT": {"t": "Le complément circonstanciel de temps", "link": "C'est quoi, un CC de temps ? La méthode", "d": "Le complément circonstanciel de temps indique quand se passe l'action, ou pendant combien de temps.", "m": ["Pose la question « quand ? », « depuis quand ? » ou « pendant combien de temps ? ».", "Vérifie qu'on peut le déplacer ou le supprimer.", "Mots fréquents : chaque matin, demain, depuis une heure, pendant les vacances, le soir."], "x": ["**Chaque matin**, mon frère prépare le repas.", "Le chat dort **depuis une heure**."], "tip": "Le CC de temps peut être un simple adverbe : hier, demain, bientôt."}, "CCM": {"t": "Le complément circonstanciel de manière", "link": "C'est quoi, un CC de manière ? La méthode", "d": "Le complément circonstanciel de manière indique comment se fait l'action.", "m": ["Pose la question « comment ? » ou « de quelle manière ? ».", "Vérifie qu'on peut le supprimer.", "Ce sont souvent des adverbes en -ment ou « avec + nom » : avec soin, avec attention."], "x": ["Le musicien joue **doucement**.", "Les élèves écoutent **avec attention**."], "tip": "« avec son ami » répond à « avec qui ? » : ce n'est pas un CC de manière."}, "CCC": {"t": "Le complément circonstanciel de cause", "link": "C'est quoi, un CC de cause ? La méthode", "d": "Le complément circonstanciel de cause indique pourquoi l'action se produit.", "m": ["Pose la question « pourquoi ? » ou « pour quelle raison ? ».", "Il commence souvent par : à cause de, grâce à, par, de, parce que.", "Vérifie qu'on peut le déplacer ou le supprimer."], "x": ["Elle tremble **de froid**.", "**À cause de la pluie**, les joueurs restent au vestiaire."], "tip": "« Grâce à » s'emploie pour une cause positive, « à cause de » pour une cause négative."}, "pronoms_compl": {"t": "Les pronoms compléments", "link": "Le, la, lui, leur, y, en : la méthode", "d": "Les pronoms compléments remplacent un complément du verbe pour éviter une répétition.", "m": ["Le complément n'a pas de préposition (COD) → le, la, les, l'.", "Il commence par « à » et désigne une personne → lui (singulier), leur (pluriel).", "Il commence par « à » et désigne une chose ou un lieu → y.", "Il commence par « de » → en."], "x": ["Paul regarde **la mer** → Paul **la** regarde.", "Je téléphone **à mes amis** → je **leur** téléphone.", "Nous allons **à la piscine** → nous **y** allons."], "tip": "Le pronom « leur » placé devant un verbe ne prend jamais de -s : je leur parle."}, "types_phrase": {"t": "Les types de phrases", "link": "Les 4 types de phrases : la méthode", "d": "Il existe quatre types de phrases : déclarative (elle informe), interrogative (elle pose une question), exclamative (elle exprime une émotion) et injonctive (elle donne un ordre ou un conseil).", "m": ["Regarde la ponctuation finale : . ? ou !", "Demande-toi ce que fait la phrase : informer ? questionner ? s'exclamer ? ordonner ?", "Une phrase injonctive a souvent un verbe à l'impératif, sans sujet : Range ta chambre."], "x": ["Le train arrive. (déclarative)", "Est-ce que tu viens ? (interrogative)", "Comme c'est beau ! (exclamative)", "Prenez vos cahiers. (injonctive)"], "tip": "Une phrase injonctive peut finir par un simple point, et un ordre avec « ! » reste injonctif."}, "forme_neg": {"t": "La forme négative", "link": "Affirmative ou négative ? La méthode", "d": "Une phrase est à la forme négative quand elle contient une négation. La négation encadre le verbe conjugué.", "m": ["Cherche « ne » (ou « n' ») juste avant le verbe.", "Cherche le deuxième mot après le verbe : pas, plus, jamais, rien, personne.", "Pour transformer une phrase, place « ne » avant le verbe et « pas » après."], "x": ["Le chat **ne** dort **pas**.", "Il **n'**arrive **jamais** à l'heure."], "tip": "À l'écrit, on n'oublie jamais le « ne », même si on le supprime souvent à l'oral."}, "ponctuation": {"t": "La ponctuation", "link": "Les signes de ponctuation : la méthode", "d": "Les signes de ponctuation organisent la phrase et aident à la lire.", "m": ["Fin de phrase : point (.), point d'interrogation (?), point d'exclamation (!), points de suspension (…).", "Virgule (,) : sépare les éléments d'une liste ou isole un groupe déplacé en début de phrase.", "Deux-points (:) : annoncent une explication, une liste ou des paroles.", "Guillemets (« ») et tirets (–) : encadrent les paroles d'un dialogue."], "x": ["J'ai acheté des pommes, des poires et des bananes.", "Il m'a dit : « Je reviens demain. »"], "tip": "Avant « et » dans une énumération, on ne met pas de virgule."}, "present": {"t": "Le présent de l'indicatif", "link": "Conjuguer au présent : la méthode", "d": "Le présent exprime une action qui se passe maintenant, une habitude ou une vérité générale.", "m": ["Trouve l'infinitif et le groupe du verbe.", "1er groupe (-er) : -e, -es, -e, -ons, -ez, -ent (je chante).", "2e groupe (-ir, nous -issons) : -is, -is, -it, -issons, -issez, -issent (je finis).", "3e groupe : souvent -s, -s, -t (ou -d), -ons, -ez, -ent (je prends, il prend)."], "x": ["nous mangeons (on garde le e pour le son « ge »)", "nous commençons (ç devant o)"], "tip": "À connaître par cœur : être (suis, es, est, sommes, êtes, sont), avoir (ai, as, a, avons, avez, ont), aller (vais, vas, va, allons, allez, vont), faire (fais, fais, fait, faisons, faites, font)."}, "imparfait": {"t": "L'imparfait", "link": "Conjuguer à l'imparfait : la méthode", "d": "L'imparfait sert à décrire le passé (le décor, les personnages) et à raconter des habitudes passées.", "m": ["Conjugue le verbe au présent avec « nous » : nous finissons.", "Enlève -ons : on obtient le radical (finiss-).", "Ajoute les terminaisons : -ais, -ais, -ait, -ions, -iez, -aient."], "x": ["je finiss**ais**, nous finiss**ions**", "Autrefois, nous jou**ions** dans ce parc."], "tip": "Seule exception : être → j'étais. Et on garde le e ou le ç : je mangeais, je commençais."}, "futur": {"t": "Le futur simple", "link": "Conjuguer au futur simple : la méthode", "d": "Le futur simple exprime une action qui va se passer.", "m": ["Prends l'infinitif du verbe (chanter, finir). S'il finit par -re, enlève le e (prendre → prendr-).", "Ajoute les terminaisons : -ai, -as, -a, -ons, -ez, -ont.", "On entend toujours le son « r » avant la terminaison."], "x": ["je chanter**ai**, tu finir**as**, ils prendr**ont**"], "tip": "Radicaux irréguliers : être → ser-, avoir → aur-, aller → ir-, faire → fer-, venir → viendr-, voir → verr-, pouvoir → pourr-, vouloir → voudr-, devoir → devr-, savoir → saur-."}, "conditionnel": {"t": "Le conditionnel présent", "link": "Conjuguer au conditionnel : la méthode", "d": "Le conditionnel exprime un souhait, une demande polie ou une action qui dépend d'une condition (si…).", "m": ["Prends le même radical qu'au futur (chanter-, ser-, pourr-…).", "Ajoute les terminaisons de l'imparfait : -ais, -ais, -ait, -ions, -iez, -aient."], "x": ["je voudr**ais** un café", "Si j'avais le temps, je viendr**ais**."], "tip": "Futur ou conditionnel ? Remplace « je » par « nous » : nous chanterons (futur) / nous chanterions (conditionnel)."}, "passe_simple": {"t": "Le passé simple", "link": "Conjuguer au passé simple : la méthode", "d": "Le passé simple est le temps du récit écrit : il exprime des actions courtes et terminées dans le passé.", "m": ["Verbes en -er : -ai, -as, -a, -âmes, -âtes, -èrent (il chanta).", "Verbes en -ir et beaucoup de verbes du 3e groupe : -is, -is, -it, -îmes, -îtes, -irent (il finit, il prit).", "Certains verbes en -u : -us, -us, -ut, -ûmes, -ûtes, -urent (il fut, il eut, il put)."], "x": ["Soudain, le loup **sortit** du bois.", "Ils **arrivèrent** au château."], "tip": "Irréguliers : venir → il vint, ils vinrent ; voir → il vit. Ne confonds pas « il chanta » (passé simple) et « il chantait » (imparfait)."}, "passe_compose": {"t": "Le passé composé", "link": "Former le passé composé : la méthode", "d": "Le passé composé exprime une action terminée dans le passé. C'est un temps composé : auxiliaire + participe passé.", "m": ["Choisis l'auxiliaire : être ou avoir.", "Conjugue l'auxiliaire au présent.", "Ajoute le participe passé du verbe.", "Avec « être », accorde le participe avec le sujet."], "x": ["j'**ai mangé**, nous **avons fini**", "elle **est partie**, ils **sont venus**"], "tip": "Avec « avoir », le participe ne s'accorde pas avec le sujet : elles ont mangé."}, "pqp": {"t": "Le plus-que-parfait", "link": "Former le plus-que-parfait : la méthode", "d": "Le plus-que-parfait exprime une action passée qui s'est produite avant une autre action passée.", "m": ["Choisis l'auxiliaire (être ou avoir), comme au passé composé.", "Conjugue l'auxiliaire à l'imparfait (j'avais, j'étais).", "Ajoute le participe passé, avec les mêmes règles d'accord."], "x": ["Quand je suis arrivé, il **était** déjà **parti**.", "Elle **avait fini** ses devoirs avant le dîner."], "tip": "Passé composé = auxiliaire au présent ; plus-que-parfait = auxiliaire à l'imparfait."}, "auxiliaire": {"t": "Être ou avoir ?", "link": "Choisir l'auxiliaire : la méthode", "d": "La plupart des verbes se conjuguent avec « avoir ». Une petite liste se conjugue avec « être ».", "m": ["Le verbe exprime-t-il un déplacement ou un changement d'état ?", "Liste avec être : aller, venir, arriver, partir, entrer, sortir, monter, descendre, tomber, rester, naître, mourir, devenir, retourner.", "Tous les autres verbes → avoir (même « être » et « avoir » : j'ai été, j'ai eu)."], "x": ["je **suis** allé, elle **est** tombée", "j'**ai** mangé, nous **avons** vu"], "tip": "Les verbes pronominaux (se laver, se lever) se conjuguent aussi avec être : il s'est levé."}, "participe": {"t": "Le participe passé", "link": "Trouver le participe passé : la méthode", "d": "Le participe passé sert à former les temps composés (j'ai chanté). Sa terminaison dépend du verbe.", "m": ["Verbes en -er → -é (chanté).", "Verbes en -ir du 2e groupe → -i (fini).", "Beaucoup de verbes du 3e groupe → -u (vu, venu, lu, su), -is (pris, mis) ou -it (dit, écrit, fait).", "Pour trouver la dernière lettre muette, mets-le au féminin : prise → pris, faite → fait."], "x": ["j'ai **pris**, elle a **dit**, nous avons **vu**"], "tip": "« é » ou « er » ? Remplace par « vendu » ou « vendre » : j'ai mangé → j'ai vendu ✔ donc « é »."}, "imperatif": {"t": "L'impératif présent", "link": "Conjuguer à l'impératif : la méthode", "d": "L'impératif sert à donner un ordre ou un conseil. Il n'a que 3 personnes (tu, nous, vous) et pas de sujet écrit.", "m": ["Prends la forme du présent avec tu, nous ou vous.", "Enlève le pronom sujet : tu finis → Finis !", "Pour les verbes en -er (et « aller »), enlève le -s à la personne « tu » : tu chantes → Chante !"], "x": ["**Range** ta chambre !", "**Finissons** ce travail.", "**Écoutez** bien."], "tip": "Irréguliers : être → sois, soyons, soyez ; avoir → aie, ayons, ayez ; savoir → sache, sachons, sachez."}, "temps_reco": {"t": "Reconnaître un temps", "link": "Reconnaître le temps d'un verbe : la méthode", "d": "Pour reconnaître un temps, on observe la terminaison du verbe et le sens de la phrase.", "m": ["-ais, -ait, -aient après le radical court (chant-ait) → imparfait.", "Infinitif + -ai, -as, -a, -ons, -ez, -ont (chanter-a) → futur simple.", "Infinitif + -ais, -ait, -ions (chanter-ait) → conditionnel présent.", "-a, -èrent, -it, -irent, -ut, -urent dans un récit → passé simple.", "Sinon, c'est souvent le présent."], "x": ["il chant**ait** (imparfait) / il chanter**a** (futur) / il chanter**ait** (conditionnel) / il chant**a** (passé simple)"], "tip": "Ajoute un mot de temps pour vérifier : « hier », « demain », « en ce moment », « si… »."}, "h_a": {"t": "a ou à ?", "link": "a ou à : la méthode", "d": "« a » est le verbe (ou l'auxiliaire) avoir. « à » est une préposition.", "m": ["Remplace le mot par « avait ».", "Si la phrase a encore du sens → a (sans accent).", "Sinon → à (avec accent)."], "x": ["Il **a** faim. → il avait faim ✔", "Elle va **à** l'école. → elle va avait l'école ✘ → à"], "tip": "« à » ne se conjugue jamais : c'est un petit mot invariable."}, "h_et": {"t": "et ou est ?", "link": "et ou est : la méthode", "d": "« est » est le verbe être. « et » est une conjonction qui ajoute quelque chose.", "m": ["Remplace le mot par « était ».", "Si ça marche → est.", "Si on peut dire « et puis » → et."], "x": ["Il **est** fatigué. → il était fatigué ✔", "Paul **et** Marie. → Paul et puis Marie ✔"], "tip": "« est » se prononce parfois « è », mais la méthode du remplacement est la plus sûre."}, "h_son": {"t": "son ou sont ?", "link": "son ou sont : la méthode", "d": "« sont » est le verbe être au pluriel. « son » est un déterminant possessif.", "m": ["Remplace le mot par « étaient ».", "Si ça marche → sont.", "Si on peut dire « mon » ou « ton » → son."], "x": ["Ils **sont** partis. → ils étaient partis ✔", "Il range **son** cartable. → mon cartable ✔"], "tip": "« son » est toujours suivi d'un nom (ou d'un adjectif + nom)."}, "h_on": {"t": "on ou ont ?", "link": "on ou ont : la méthode", "d": "« ont » est le verbe avoir au pluriel. « on » est un pronom sujet.", "m": ["Remplace le mot par « avaient ».", "Si ça marche → ont.", "Si on peut dire « il » → on."], "x": ["Elles **ont** fini. → elles avaient fini ✔", "**On** va au parc. → il va au parc ✔"], "tip": "« on » est toujours sujet du verbe : il est placé juste avant lui."}, "h_ce": {"t": "ce ou se ?", "link": "ce ou se : la méthode", "d": "« se » est un pronom réfléchi placé devant un verbe. « ce » est un déterminant (devant un nom) ou un pronom (c'est, ce que).", "m": ["Le mot est-il suivi d'un verbe ? Conjugue avec « je » : il se lave → je me lave → se.", "Le mot est-il suivi d'un nom ? Remplace par « cette » ou « un » → ce."], "x": ["Il **se** lave. → je me lave ✔", "**Ce** livre est passionnant. → un livre ✔"], "tip": "« se » va avec les verbes pronominaux : se lever, se préparer, se demander."}, "h_ces": {"t": "ces ou ses ?", "link": "ces ou ses : la méthode", "d": "« ses » est un possessif (= les siens, les siennes). « ces » est un démonstratif (= ceux-là, celles-là).", "m": ["Remplace par « mes » : si le sens est « les siens » → ses.", "Ajoute « -là » après le nom : si ça marche → ces."], "x": ["Elle range **ses** affaires. → les siennes ✔", "**Ces** montagnes sont belles. → ces montagnes-là ✔"], "tip": "Au singulier : ses → son/sa ; ces → ce/cet/cette."}, "h_ou": {"t": "ou ou où ?", "link": "ou ou où : la méthode", "d": "« ou » (sans accent) exprime un choix. « où » (avec accent) indique un lieu ou un moment.", "m": ["Remplace par « ou bien ».", "Si ça marche → ou.", "Si le mot répond à « à quel endroit ? » → où."], "x": ["Thé **ou** café ? → thé ou bien café ✔", "La ville **où** je suis né. → à quel endroit ✔"], "tip": "Dans une question sur le lieu, c'est toujours « où » : Où habites-tu ?"}, "h_la": {"t": "la, l'a ou là ?", "link": "la, l'a ou là : la méthode", "d": "« la » est un article ou un pronom. « l'a » = le pronom l' + a (avoir). « là » (avec accent) indique un lieu.", "m": ["Remplace par « l'avait » : si ça marche → l'a.", "Remplace par « ici » ou « là-bas » : si ça marche → là.", "Sinon (devant un nom, ou « la » pronom) → la."], "x": ["Il **l'a** vue. → il l'avait vue ✔", "Pose-le **là**. → pose-le ici ✔", "**La** maison est grande."], "tip": "Le « à » avec accent de « là » est le même que celui de « voilà »."}, "classes": {"t": "Les classes de mots", "link": "Comment trouver la nature d'un mot ? La méthode", "d": "La nature (ou classe) d'un mot, c'est sa « famille » : nom, verbe, adjectif, adverbe, déterminant, pronom, préposition ou conjonction. Pour la trouver, on fait de petits tests.", "m": ["On peut mettre « le, un, mon » devant ? → nom.", "Il change si on dit « hier » ou « demain » ? → verbe.", "Il décrit un nom et on peut dire « très » devant ? → adjectif.", "Il ne change jamais, souvent en -ment ? → adverbe.", "Petit mot juste devant un nom ? → déterminant.", "Il remplace un nom (il, elle, nous…) ? → pronom.", "Petit mot invariable devant un groupe (dans, pour, avec…) ? → préposition.", "Il relie deux éléments (mais, ou, et, donc, or, ni, car) ? → conjonction."], "x": ["**Le** (déterminant) **petit** (adjectif) **chat** (nom) **dort** (verbe) **tranquillement** (adverbe)."], "tip": "Regarde toujours le mot dans sa phrase : « la marche » (nom) / « il marche » (verbe)."}, "fonctions": {"t": "Les fonctions dans la phrase", "link": "Comment trouver la fonction d'un groupe ? La méthode", "d": "La fonction d'un groupe de mots, c'est son rôle dans la phrase. On la trouve en posant des questions à partir du verbe.", "m": ["Trouve d'abord le verbe conjugué.", "« Qui est-ce qui + verbe ? » → sujet.", "Verbe d'état (être, sembler, devenir…) + qualité du sujet → attribut du sujet.", "« Verbe + qui ? / quoi ? » sans préposition → COD.", "« Verbe + à qui ? / de quoi ? » avec préposition → COI.", "Où ? → CC de lieu. Quand ? → CC de temps. Comment ? → CC de manière. Pourquoi ? → CC de cause.", "Vérifie : les CC peuvent être déplacés ou supprimés, pas le COD ni le COI."], "x": ["**Chaque matin** (CCT), **mon frère** (sujet) prépare **le repas** (COD) **dans la cuisine** (CCL)."], "tip": "Le sujet peut être placé après le verbe : « Dans la forêt vivent **de nombreux animaux** »."}};
</script>
<script>
(function(){
  "use strict";

  var STORE_KEY = "quete_des_mots_v3";
  var OLD_KEY = "quete_des_mots_progress_v2";
  var PROF_PASSWORD = "20001225";
  var TOTAL_BADGES = 0; // set below

  // ---------------------------------------------------------------- helpers
  function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }
  function txt(tag, cls, t){ var e = document.createElement(tag); if(cls) e.className = cls; e.textContent = t; return e; }
  function byId(id){ return LEVELS[id-1]; }
  function catColor(cat){ return cat==="grammaire" ? "grammaire" : cat==="conjugaison" ? "conjugaison" : "defi"; }
  function catLabel(cat){ return cat==="grammaire" ? "Grammaire" : cat==="conjugaison" ? "Conjugaison" : "Défi final"; }
  function pad(n){ return (n<10?"0":"")+n; }
  function fmtDate(ts){ if(!ts) return "—"; var d = new Date(ts); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+"h"+pad(d.getMinutes()); }
  function fileDate(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function slug(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase() || "eleve"; }
  function initials(n){ var p = n.trim().split(/\s+/); return ((p[0]||"?")[0] + (p[1] ? p[1][0] : "")).toUpperCase(); }
  function cleanName(n){ return (n||"").replace(/\s+/g," ").trim().slice(0,30); }

  // ---------------------------------------------------------------- badges
  var BONUS_BADGES = [
    {id:"premier_pas", nm:"Premier pas", ic:"👣", cond:function(p){ return nDone(p) >= 1; }},
    {id:"dix_niveaux", nm:"10 niveaux !", ic:"🔥", cond:function(p){ return nDone(p) >= 10; }},
    {id:"quart_de_route", nm:"Quart de route", ic:"🧭", cond:function(p){ return nDone(p) >= 25; }},
    {id:"mi_parcours", nm:"Mi-parcours", ic:"⚡", cond:function(p){ return nDone(p) >= 50; }},
    {id:"trois_quarts", nm:"Trois quarts !", ic:"🌠", cond:function(p){ return nDone(p) >= 75; }},
    {id:"champion", nm:"Champion du collège", ic:"👑", cond:function(p){ return nDone(p) >= 100; }},
    {id:"sans_faute", nm:"Sans faute", ic:"🌟", cond:function(p){ return p.hadPerfect === true; }},
    {id:"expert_grammaire", nm:"As de grammaire", ic:"📖", cond:function(p){ return catDone(p,"grammaire"); }},
    {id:"expert_conjugaison", nm:"As de conjugaison", ic:"🖋️", cond:function(p){ return catDone(p,"conjugaison"); }}
  ];
  TOTAL_BADGES = LEVELS.length + BONUS_BADGES.length;
  function nDone(p){ return Object.keys(p.completed).length; }
  function catDone(p, cat){ return LEVELS.filter(function(l){return l.cat===cat;}).every(function(l){ return p.completed[l.id]; }); }
  function nBadges(p){ return nDone(p) + BONUS_BADGES.filter(function(b){ return b.cond(p); }).length; }
  function nStars(p){ var s = 0; for(var k in p.completed) s += (p.completed[k].stars||0); return s; }

  // ---------------------------------------------------------------- storage
  function newProfile(name){
    return { name: name, completed: {}, attempts: {}, xp: 0, badges: [], hadPerfect: false, history: [], created: Date.now(), lastPlayed: null };
  }
  function normProfile(p){
    if(!p || typeof p !== "object" || typeof p.name !== "string") return null;
    p.name = cleanName(p.name); if(!p.name) return null;
    if(!p.completed || typeof p.completed !== "object") p.completed = {};
    if(!p.attempts || typeof p.attempts !== "object") p.attempts = {};
    if(typeof p.xp !== "number") p.xp = 0;
    if(!Array.isArray(p.badges)) p.badges = [];
    if(typeof p.hadPerfect !== "boolean") p.hadPerfect = false;
    if(!Array.isArray(p.history)) p.history = [];
    if(!p.created) p.created = Date.now();
    return p;
  }
  function load(){
    var db = { profiles: {}, current: null };
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){ var parsed = JSON.parse(raw); if(parsed && parsed.profiles) db = parsed; }
      else {
        var old = localStorage.getItem(OLD_KEY);
        if(old){
          var o = JSON.parse(old);
          if(o && o.completed && Object.keys(o.completed).length){
            var p = newProfile("Profil récupéré");
            p.completed = o.completed; p.xp = o.xp||0; p.badges = o.badges||[]; p.hadPerfect = !!o.hadPerfect;
            db.profiles[p.name] = p;
          }
        }
      }
    } catch(e){}
    for(var k in db.profiles){ var n = normProfile(db.profiles[k]); if(n) db.profiles[k] = n; else delete db.profiles[k]; }
    return db;
  }
  function persist(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch(e){} }

  var DB = load();
  function me(){ return DB.current && DB.profiles[DB.current] ? DB.profiles[DB.current] : null; }

  // ---------------------------------------------------------------- files (save / open)
  var downloadsP = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(function(){ return null; }) : Promise.resolve(null);
  function blobFallback(filename, text, mime){
    try {
      var blob = new Blob([text], {type: mime});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast("Fichier enregistré : " + filename);
    } catch(e){ toast("Impossible d'enregistrer le fichier ici."); }
  }
  function saveFile(filename, text, mime){
    downloadsP.then(function(dl){
      if(!dl){ blobFallback(filename, text, mime); return; }
      dl.save({filename: filename, data: text}).then(function(){ toast("Fichier enregistré : " + filename); })
        .catch(function(err){
          var c = err && err.code;
          if(c === "declined") toast("Enregistrement annulé.");
          else if(c === "rate_limited") toast("Patiente un instant puis réessaie.");
          else blobFallback(filename, text, mime);
        });
    });
  }
  function pickFiles(multiple, cb){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json"; inp.multiple = !!multiple; inp.className = "hidden-input";
    document.body.appendChild(inp);
    inp.onchange = function(){
      var files = Array.prototype.slice.call(inp.files || []);
      inp.remove();
      if(!files.length) return;
      var results = [], left = files.length;
      files.forEach(function(f){
        var r = new FileReader();
        r.onload = function(){ results.push({name: f.name, text: String(r.result)}); if(--left === 0) cb(results); };
        r.onerror = function(){ results.push({name: f.name, text: null}); if(--left === 0) cb(results); };
        r.readAsText(f);
      });
    };
    inp.click();
  }
  function parseSave(text){
    try {
      var o = JSON.parse(text);
      if(!o || o.app !== "quete-des-mots" || !o.profile) return null;
      return normProfile(o.profile);
    } catch(e){ return null; }
  }
  function exportProfile(p){
    var payload = { app: "quete-des-mots", version: 3, savedAt: Date.now(), profile: p };
    saveFile("quete-des-mots-" + slug(p.name) + "-" + fileDate() + ".json", JSON.stringify(payload), "application/json");
  }

  // ---------------------------------------------------------------- journal (texte simple)
  function journal(p){
    var L = [];
    var line = "==================================================";
    L.push(line); L.push("   LA QUÊTE DES MOTS — Journal de progression"); L.push("   Grammaire et conjugaison — 5ème"); L.push(line);
    L.push("");
    L.push("Élève : " + p.name);
    L.push("Journal créé le : " + fmtDate(Date.now()));
    L.push("Dernière partie : " + fmtDate(p.lastPlayed));
    L.push("");
    L.push("RÉSUMÉ");
    L.push("  Niveaux réussis : " + nDone(p) + " / 100");
    L.push("  Étoiles gagnées : " + nStars(p) + " / 300");
    L.push("  Points d'expérience : " + p.xp + " XP");
    L.push("  Badges : " + nBadges(p) + " / " + TOTAL_BADGES);
    var sp = BONUS_BADGES.filter(function(b){ return b.cond(p); }).map(function(b){ return b.nm; });
    if(sp.length) L.push("  Badges spéciaux : " + sp.join(", "));
    L.push("");
    L.push("DÉTAIL PAR MONDE");
    WORLDS.forEach(function(w){
      var done = 0; for(var i=w.from;i<=w.to;i++) if(p.completed[i]) done++;
      L.push("");
      L.push("  Monde " + w.id + " — " + w.name + " : " + done + "/10");
      for(var id=w.from; id<=w.to; id++){
        var lv = byId(id), c = p.completed[id], a = p.attempts[id];
        if(c){
          L.push("    [OK] Niveau " + id + " - " + lv.title + " : " + "*".repeat(c.stars||1) + " (meilleur score " + ((a && a.best) || "?") + "/20)");
        } else if(a){
          L.push("    [..] Niveau " + id + " - " + lv.title + " : pas encore réussi (meilleur score " + a.best + "/20, " + a.tries + " essai" + (a.tries>1?"s":"") + ")");
        }
      }
      if(done === 0 && !anyAttempt(p, w)) L.push("    (pas encore commencé)");
    });
    var toWork = [];
    for(var id2=1; id2<=100; id2++){
      var a2 = p.attempts[id2], c2 = p.completed[id2];
      if((a2 && !c2) || (c2 && (c2.stars||0) === 1)) toWork.push("Niveau " + id2 + " - " + byId(id2).title);
    }
    L.push(""); L.push("À RETRAVAILLER");
    if(toWork.length) toWork.slice(0, 15).forEach(function(t){ L.push("  - " + t); });
    else L.push("  Rien pour l'instant, bravo !");
    L.push(""); L.push("DERNIÈRES PARTIES");
    var h = p.history.slice(-10).reverse();
    if(h.length) h.forEach(function(x){ L.push("  " + fmtDate(x.t) + " - Niveau " + x.id + " : " + x.score + "/20" + (x.ok ? " (réussi)" : "")); });
    else L.push("  Aucune partie jouée.");
    L.push(""); L.push(line);
    L.push("Un niveau est réussi à partir de 14/20. 3 étoiles = 20/20.");
    return L.join("\r\n");
  }
  function anyAttempt(p, w){ for(var i=w.from;i<=w.to;i++) if(p.attempts[i]) return true; return false; }
  function downloadJournal(p){ saveFile("journal-" + slug(p.name) + "-" + fileDate() + ".txt", journal(p), "text/plain"); }

  // ---------------------------------------------------------------- UI state
  var app = document.getElementById("app");
  var screen = DB.current && me() ? "worlds" : "login"; // login | worlds | map | badges | account | prof | profStudent
  var prof = false;          // mode prof actif
  var profTab = "students";  // students | test
  var profStudent = null;    // name of student being viewed
  var activeWorld = null;
  var current = null, qIndex = -1, answers = [];
  var newBadges = [];

  function toast(msg){
    var old = document.querySelector(".toast"); if(old) old.remove();
    var t = txt("div", "toast", msg); document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }
  function modal(title, body, buttons, extra){
    var ov = el("div", "modal-overlay"), m = el("div", "modal");
    m.appendChild(txt("h3", null, title));
    if(body) m.appendChild(txt("p", null, body));
    if(extra) m.appendChild(extra);
    var row = el("div", "row-btns");
    buttons.forEach(function(b){
      var bt = txt("button", b.primary ? "btn-primary" : ("btn-outline" + (b.danger ? " btn-danger" : "")), b.label);
      bt.onclick = function(){ var keep = b.onClick && b.onClick() === false; if(!keep) ov.remove(); };
      row.appendChild(bt);
    });
    m.appendChild(row); ov.appendChild(m);
    ov.onclick = function(e){ if(e.target === ov) ov.remove(); };
    document.body.appendChild(ov);
    return ov;
  }

  function isUnlocked(id){ if(prof) return true; var p = me(); if(!p) return false; return id === 1 || !!p.completed[id-1]; }
  function worldOf(id){ for(var i=0;i<WORLDS.length;i++) if(id>=WORLDS[i].from && id<=WORLDS[i].to) return WORLDS[i]; return WORLDS[0]; }
  function wDone(p, w){ var n=0; for(var i=w.from;i<=w.to;i++) if(p && p.completed[i]) n++; return n; }

  // ---------------------------------------------------------------- render root
  function render(){
    app.innerHTML = "";
    if(screen === "login"){ app.appendChild(renderLogin()); return; }
    app.appendChild(renderTopbar());
    if(prof) app.appendChild(txt("div", "prof-banner", profTab === "test" && (screen==="map"||screen==="worlds") ? "MODE PROF — tous les niveaux sont ouverts, rien n'est enregistré" : "MODE PROF"));
    if(screen === "worlds") app.appendChild(renderWorlds());
    else if(screen === "map") app.appendChild(renderMap());
    else if(screen === "badges") app.appendChild(renderBadges());
    else if(screen === "account") app.appendChild(renderAccount());
    else if(screen === "prof") app.appendChild(renderProf());
    else if(screen === "profStudent") app.appendChild(renderProfStudent());
    if(current && qIndex === -1) app.appendChild(renderIntroSheet());
  }

  function renderTopbar(){
    var frag = document.createDocumentFragment();
    var bar = el("div", "topbar");
    var p = me();
    bar.appendChild(txt("div", "title", prof ? "👩‍🏫 Espace prof" : "🗺️ " + (p ? p.name : "La Quête des Mots")));
    var pills = el("div", "stat-pills");
    if(!prof && p){
      pills.appendChild(txt("div", "pill", "⭐ " + p.xp + " XP"));
      pills.appendChild(txt("div", "pill", "🎖️ " + nBadges(p) + "/" + TOTAL_BADGES));
    }
    bar.appendChild(pills);
    frag.appendChild(bar);
    var tabs = el("div", "nav-tabs");
    function tab(label, active, fn){ var t = txt("button", "nav-tab" + (active ? " active" : ""), label); t.onclick = fn; tabs.appendChild(t); }
    if(prof){
      tab("Élèves", screen==="prof" && profTab==="students" || screen==="profStudent", function(){ profTab="students"; screen="prof"; render(); });
      tab("Tester", profTab==="test" && screen!=="prof" && screen!=="profStudent", function(){ profTab="test"; screen="worlds"; activeWorld=null; render(); });
      tab("Quitter", false, function(){ prof=false; profStudent=null; screen = me() ? "worlds" : "login"; render(); });
    } else {
      tab("Mondes", screen==="worlds"||screen==="map", function(){ screen="worlds"; activeWorld=null; render(); });
      tab("Badges", screen==="badges", function(){ screen="badges"; render(); });
      var acc = txt("button", "account-btn" + (screen==="account" ? " active" : ""), "⚙️ Gérer mon compte");
      acc.onclick = function(){ screen="account"; render(); };
      tabs.appendChild(acc);
    }
    frag.appendChild(tabs);
    return frag;
  }

  // ---------------------------------------------------------------- login
  function renderLogin(){
    var wrap = el("div", "login-wrap");

    });

  function finishLevel(){
    var good = answers.filter(function(a){ return a.correct; }).length, total = current.q.length;
    var ratio = good/total, passed = ratio >= 0.7, perfect = good === total;
    var stars = perfect ? 3 : (ratio >= 0.85 ? 2 : (passed ? 1 : 0));
    newBadges = []; var xpGain = 0;
    if(!prof){
      var p = me();
      xpGain = good * 5;
      var at = p.attempts[current.id] || {best: 0, tries: 0};
      at.tries++; at.best = Math.max(at.best, good); p.attempts[current.id] = at;
      if(passed){
        var already = !!p.completed[current.id];
        if(!already){ xpGain += 30; newBadges.push({ic: current.icon, nm: current.title}); }
        p.completed[current.id] = { stars: Math.max(stars, already ? p.completed[current.id].stars : 0) };
      }
      if(perfect) p.hadPerfect = true;
      p.xp += xpGain;
      BONUS_BADGES.forEach(function(b){ if(b.cond(p) && p.badges.indexOf(b.id) === -1){ p.badges.push(b.id); newBadges.push({ic:b.ic, nm:b.nm}); } });
      p.history.push({id: current.id, score: good, ok: passed, t: Date.now()});
      if(p.history.length > 300) p.history = p.history.slice(-300);
      p.lastPlayed = Date.now();
      persist();
    }
    renderResult(passed, good, total, xpGain, stars);
  }

    window.scrollTo(0, 0);

      if(det.length) c.appendChild(txt("div", "lvl-detail", det.join(" · ")));
    });
    wrap.appendChild(c);
    var s = el("div", "stack");
    var jb = txt("button", "btn-outline", "📝 Télécharger son journal"); jb.onclick = function(){ downloadJournal(p); };
    var del = txt("button", "btn-outline btn-danger", "🗑️ Supprimer cet élève de l'appareil");
    del.onclick = function(){
      modal("Supprimer " + p.name + " ?", "Sa progression sera effacée de cet appareil. Pense à enregistrer sa partie avant si besoin.",
        [{label:"Annuler"}, {label:"Supprimer", danger:true, onClick: function(){ delete DB.profiles[p.name]; if(DB.current === p.name) DB.current = null; persist(); screen = "prof"; render(); }}]);
    };
    var sv = txt("button", "btn-outline", "💾 Enregistrer sa sauvegarde"); sv.onclick = function(){ exportProfile(p); };
    s.appendChild(jb); s.appendChild(sv); s.appendChild(del);
    wrap.appendChild(s);
    return wrap;
  }

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function rich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
  function lessonLink(key, label){
    var Ls = LESSONS[key]; if(!Ls) return null;
    var b = txt("button", "lesson-link", "📘 " + (label || Ls.link));
    b.onclick = function(e){ e.stopPropagation(); openLesson(key); };
    return b;
  }
  function openLesson(key){
    var Ls = LESSONS[key]; if(!Ls) return;
    var ov = el("div", "sheet-overlay lesson-overlay");
    var sh = el("div", "sheet lesson-sheet");
    sh.appendChild(txt("div", "lesson-kicker", "📘 Fiche méthode"));
    sh.appendChild(txt("h2", null, Ls.t));
    sh.appendChild(txt("h4", null, "C'est quoi ?"));
    sh.appendChild(el("p", "lesson-p", rich(Ls.d)));
    sh.appendChild(txt("h4", null, "La méthode pour le trouver"));
    var ol = el("ol", "lesson-steps");
    Ls.m.forEach(function(s){ ol.appendChild(el("li", null, rich(s))); });
    sh.appendChild(ol);
    sh.appendChild(txt("h4", null, Ls.x.length > 1 ? "Exemples" : "Exemple"));
    Ls.x.forEach(function(x){ sh.appendChild(el("div", "lesson-ex", rich(x))); });
    sh.appendChild(el("div", "lesson-tip", "<b>⚠️ Attention :</b> " + rich(Ls.tip)));
    var close = txt("button", "btn-primary", "J'ai compris");
    close.onclick = function(){ ov.remove(); };
    sh.appendChild(close);
    ov.appendChild(sh);
    ov.onclick = function(e){ if(e.target === ov) ov.remove(); };
    document.body.appendChild(ov);
  }

  function confetti(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var layer = el("div", "confetti-layer"), colors = ["#e7a92c","#2f8f5b","#e85d4e","#6a4fc0","#3a86d6"];
    for(var i=0;i<26;i++){ var pc = el("div", "confetti-piece"); pc.style.left = (Math.random()*100) + "%"; pc.style.background = colors[i%5];
      pc.style.animationDuration = (2 + Math.random()*1.5) + "s"; pc.style.animationDelay = (Math.random()*0.4) + "s"; layer.appendChild(pc); }
    document.body.appendChild(layer); setTimeout(function(){ layer.remove(); }, 3800);
  }

  window.__QDM = { journal: function(n){ return journal(DB.profiles[n]); }, db: function(){ return DB; } };
  render();
})();

</script>
</body>
</html>
