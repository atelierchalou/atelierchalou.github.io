<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquête policière (ou pas)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#152720; --chalk:#f4f0e2; --chalk-dim:#b9c2b6; --accent:#e8c468;
    --paper:#f4ecd8; --ink:#2a2420; --ink-soft:#5c5148; --red:#a32a22;
    --type:'Special Elite', 'Courier New', monospace; --serif:'Crimson Pro', Georgia, serif;
    --wood:#7a4e2c; --wood-d:#4e2f19; --wood-l:#a06a3d;
    --c-bin:#2b3a55; --c-prog:#7a1e18; --c-ia:#6b2fa3; --c-net:#0f6470;
    --bh:clamp(150px, calc((100dvh - 250px) / 2 - 52px), 235px); --bw:calc(var(--bh) * .8);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:14px 16px 18px;
    color:var(--chalk); font-family:'Nunito Sans',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% 0%, #24402f 0%, var(--bg) 55%, #0e1a15 100%);
  }
  .site-logo{position:fixed; top:16px; left:16px; z-index:10;}
  .site-logo img{display:block; height:36px; width:auto;}
  .back{color:var(--chalk-dim); text-decoration:none; font-size:.9rem; padding:4px 0 8px;}
  .back:hover{color:var(--accent);}

  .head{text-align:center; margin:0 0 12px;}
  .head h1{font-family:var(--type); font-weight:400; font-size:clamp(1.6rem, 3.2vw, 2.3rem); margin:0; color:#f1dfa9; line-height:1.1;}
  .head h1 i{font-family:var(--serif); color:#d7b96a; font-size:.8em;}
  .head p{margin:4px 0 0; color:var(--chalk-dim); font-size:.95rem;}

  /* ===== La bibliothèque ===== */
  .case{width:100%; max-width:1140px; padding:14px 14px 0; border-radius:6px;
        background:linear-gradient(90deg, rgba(0,0,0,.25), transparent 6% 94%, rgba(0,0,0,.25)), #2c1a0f;
        box-shadow:inset 0 0 0 10px var(--wood-d), inset 0 0 0 12px #6b4225, 0 24px 50px rgba(0,0,0,.5);
        padding:16px 16px 4px;}
  .lower{display:grid; grid-template-columns:1fr 1.7fr 1fr; gap:0 14px;}
  .shelf{position:relative; padding:14px 12px 0; margin-bottom:12px;
         background:linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.12) 40%, rgba(0,0,0,.3)), #3b2414;}
  .row{display:flex; align-items:flex-end; justify-content:center; gap:14px; min-height:calc(var(--bh) + 14px); padding:0 6px;}
  .plank{position:relative; height:26px; margin:0 -12px; border-radius:2px;
         background:linear-gradient(180deg, var(--wood-l), var(--wood) 30%, var(--wood-d)); box-shadow:0 6px 10px rgba(0,0,0,.5);}
  .plate{position:absolute; left:50%; top:3px; transform:translateX(-50%); white-space:nowrap;
         font-family:var(--type); font-size:.82rem; letter-spacing:.06em; color:#2a1d0c; padding:1px 12px;
         background:linear-gradient(180deg, #f3d98d, #c9a24f); border:1px solid #6b4a1a; border-radius:3px; box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 2px 3px rgba(0,0,0,.4);}

  /* cartons d'archives */
  .box{position:relative; width:var(--bw); height:calc(var(--bh) - var(--h)); flex:0 0 auto; padding:0; cursor:pointer; font:inherit; color:var(--ink);
       border:2px solid #5d3b1b; border-radius:3px 3px 1px 1px; transform:rotate(var(--r)); transform-origin:bottom center;
       background:linear-gradient(180deg, #b8874c 0 15%, #8a5f31 15% 16.5%, transparent 16.5%),
                  repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 3px, transparent 3px 7px),
                  linear-gradient(160deg, #d5a668, #bf8c4f 60%, #a9773e);
       box-shadow:inset -6px 0 10px -6px rgba(0,0,0,.45), 0 4px 6px rgba(0,0,0,.4);
       transition:transform .2s cubic-bezier(.3,.7,.3,1.3), box-shadow .2s;}
  .box:hover, .box:focus-visible{transform:translateY(-10px) rotate(0deg); box-shadow:inset -6px 0 10px -6px rgba(0,0,0,.45), 0 14px 16px rgba(0,0,0,.5); outline:none;}
  .box:focus-visible{outline:3px solid var(--accent); outline-offset:3px;}
  .hole{position:absolute; left:50%; top:20%; width:34px; height:11px; transform:translateX(-50%); border-radius:8px; background:#2b1a0c; box-shadow:inset 0 2px 3px #000;}
  .lbl{position:absolute; left:10px; right:10px; top:31%; bottom:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-align:center;
       background:#f8f2e2; border:1px solid #c8b78f; padding:12px 6px 6px; transform:rotate(calc(var(--r) * -1.5));}
  .lbl{font-size:clamp(11.5px, calc(var(--bh) * .074), 16.5px);}
  .lbl::before{content:""; position:absolute; left:0; right:0; top:0; height:6px; background:var(--sc);}
  .no{font-family:var(--type); font-size:.78em; letter-spacing:.12em; color:var(--sc);}
  .tt{font-family:var(--type); font-size:1em; line-height:1.15; color:#1e1915;}
  .lv{font-size:.74em; font-weight:800; color:var(--ink-soft);}
  .tag2{font-size:.6rem; font-weight:800; color:#fff; background:var(--c-bin); border-radius:3px; padding:0 5px; text-transform:uppercase; letter-spacing:.04em;}
  .tape{position:absolute; left:-6px; top:calc(31% - 6px); width:38px; height:13px; transform:rotate(-38deg); background:rgba(240,230,190,.7); box-shadow:0 1px 1px rgba(0,0,0,.15);}
  .bin{--sc:var(--c-bin);} .prog{--sc:var(--c-prog);} .ia{--sc:var(--c-ia);} .net{--sc:var(--c-net);}

  /* le livre de formation */
  .book{position:relative; width:calc(var(--bw) * .82); height:calc(var(--bh) + 4px); flex:0 0 auto; padding:14px 10px; cursor:pointer; border:0; margin-right:6px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center;
        color:#f1dfa9; border-radius:3px 8px 8px 3px; transform:rotate(-4deg); transform-origin:bottom left;
        background:radial-gradient(ellipse at 50% 30%, rgba(255,220,150,.12), transparent 60%), linear-gradient(160deg, #5a1d1a, #3a0f0d 75%);
        box-shadow:inset 0 0 0 5px #3a0f0d, inset 0 0 0 6px #b8903f, inset 10px 0 12px -8px rgba(0,0,0,.7), 6px 0 0 -1px #efe4c8, 0 6px 8px rgba(0,0,0,.45);
        transition:transform .2s cubic-bezier(.3,.7,.3,1.3);}
  .book:hover, .book:focus-visible{transform:translateY(-10px) rotate(-1deg); outline:none;}
  .book:focus-visible{outline:3px solid var(--accent); outline-offset:3px;}
  .bk-t{font-family:var(--type); font-size:clamp(12px, calc(var(--bh) * .07), 16.5px); line-height:1.2;}
  .book svg{width:calc(var(--bw) * .3);}
  .bk-s{font-family:var(--type); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:#d7b96a; border-top:1px solid #b8903f; padding-top:4px;}

  .legend{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 16px; margin:10px 0 0; font-size:.86rem; color:var(--chalk-dim);}

  /* ===== Le dossier ouvert ===== */
  dialog.doc{border:0; padding:0; width:min(1080px, calc(100vw - 32px)); max-height:calc(100dvh - 40px); background:transparent; color:var(--ink); overflow:visible;}
  dialog.doc::backdrop{background:rgba(8,14,11,.72); backdrop-filter:blur(2px);}
  .folder{position:relative; margin-top:26px; background:#d9b878; border-radius:4px 8px 8px 8px; padding:12px; box-shadow:0 24px 50px rgba(0,0,0,.6);
          display:flex; flex-direction:column; max-height:calc(100dvh - 66px);}
  .folder .ftab{position:absolute; top:-26px; left:0; height:28px; padding:5px 16px 0; border-radius:8px 8px 0 0; background:#d9b878;
                font-family:var(--type); font-size:.86rem; letter-spacing:.06em; color:#3c2a12;}
  .folder .close{position:absolute; top:-30px; right:0; font:inherit; font-family:var(--type); font-size:.9rem; color:var(--chalk); background:none; border:0; cursor:pointer; padding:4px 6px;}
  .folder .close:hover{color:var(--accent);}
  .sheets{display:grid; grid-template-columns:1fr 1fr; gap:10px; min-height:0; overflow:auto; scrollbar-width:thin;}
  .doc .pg{display:flex; flex-direction:column; padding:22px 28px 22px; background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:1.05rem; line-height:1.55;
           border-radius:2px; box-shadow:0 2px 4px rgba(60,40,20,.3);}
  .doc .pg.l{background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(0,0,0,0) 30%), var(--paper);}
  .doc .pg.r{transform:rotate(.4deg);}
  .fnav{display:flex; justify-content:space-between; gap:10px; padding:10px 4px 0; font-family:var(--type); font-size:.88rem;}
  .fnav button{font:inherit; color:#3c2a12; background:none; border:0; cursor:pointer; padding:2px;}
  .fnav button:hover{color:var(--red);}
  .fnav button[hidden]{visibility:hidden; display:inline;}

  .kicker{font-family:var(--type); font-size:.82rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 4px;}
  .doc h2{font-family:var(--type); font-weight:400; font-size:1.8rem; line-height:1.15; margin:0 0 10px; color:#1e1915;}
  .doc p{margin:0 0 10px;}
  .doc strong{color:#1e1915;}
  .stamp{
    align-self:flex-start; font-family:var(--type); font-size:.82rem; letter-spacing:.12em; color:var(--red);
    border:3px double var(--red); border-radius:4px; padding:3px 10px; transform:rotate(-3deg); margin:0 0 14px; opacity:.85; mix-blend-mode:multiply;
  }
  .facts{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-family:var(--type); font-size:.88rem; color:var(--ink-soft);
         border-top:1px dashed #b9a982; border-bottom:1px dashed #b9a982; padding:9px 0; margin:4px 0 14px;}
  .facts dt{color:var(--ink);} .facts dd{margin:0;}
  .hook{font-style:italic; font-weight:600; font-size:1.14rem;}
  .open{
    align-self:flex-start; display:inline-flex; align-items:center; gap:10px; margin:6px 10px 4px 0;
    font-family:var(--type); font-size:1rem; text-decoration:none; color:var(--paper); background:#2a2420;
    padding:10px 18px; border-radius:4px; box-shadow:3px 3px 0 var(--red); transition:transform .12s, box-shadow .12s;
  }
  .open:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--red);}
  .btns{display:flex; flex-wrap:wrap;}
  /* pièce à conviction */
  .evidence{margin:4px 0 14px; align-self:center; width:min(100%, 300px);}
  .bag{background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(220,230,235,.35)); border:1px solid rgba(80,90,100,.35); border-radius:6px; box-shadow:0 6px 14px rgba(60,40,20,.18); overflow:hidden; transform:rotate(1.5deg);}
  .bag .seal{background:var(--red); color:#fff; font-family:var(--type); font-size:.72rem; letter-spacing:.1em; padding:4px 10px;}
  .bag svg{display:block; width:100%; height:auto;}
  .evidence figcaption{font-family:var(--type); font-size:.78rem; color:var(--ink-soft); text-align:center; margin-top:6px;}

  
  .facts .spec{display:inline-block; font-family:var(--type); font-size:.8rem; letter-spacing:.04em; color:#fff; background:#2b3a55; border-radius:3px; padding:1px 8px; margin:0 4px 2px 0;}
  .facts .spec.ia{background:#6b2fa3;} .facts .spec.prog{background:#7a1e18;} .facts .spec.net{background:#0f6470;}
  .grades{width:100%; border-collapse:collapse; font-size:1rem; margin:4px 0 14px;}
  .grades th{font-family:var(--type); font-weight:400; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); text-align:left; border-bottom:2px solid #b9a982; padding:4px 6px;}
  .grades td{border-bottom:1px dashed #cdbf9c; padding:6px; vertical-align:top;}
  .grades button{font:inherit; color:var(--red); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-align:left;}
  .doc h2{font-family:var(--type); font-weight:400; font-size:1.7rem; line-height:1.15; margin:0 0 10px; color:#1e1915;}
  .facts .spec.net{background:var(--c-net);}

  /* écrans moins hauts : on resserre */
  @media (max-height:760px) and (min-width:900px){ .head p{display:none;} }
  @media (max-width:899px){
    :root{--bh:170px;}
    .lower{grid-template-columns:1fr;}
    .row{justify-content:safe center; overflow-x:auto; scrollbar-width:thin; padding-top:14px; margin-top:-14px; padding-bottom:2px;}
    .shelf.wide .row::after{content:""; flex:0 0 2px;}
  }
  @media (max-width:699px){ .row{justify-content:flex-start;} }
  @media (max-width:820px){
    .sheets{grid-template-columns:1fr;}
    .doc .pg.r{transform:none;}
  }
  @media (max-width:599px){
    body{padding-top:62px;}
    .back{position:absolute; top:24px; right:16px; padding:0;}
    :root{--bh:158px;}
    .lbl{font-size:.7rem; left:8px; right:8px; padding-top:10px;}
    .bk-t{font-size:.76rem;}
    .row{gap:10px;}
    .case{padding:12px 10px 2px;}
    .doc .pg{padding:18px 18px;}
    .doc h2{font-size:1.45rem;}
    .folder .ct{display:none;} .folder .close{font-size:1.2rem;}
    .folder .ftab{font-size:.76rem; padding:6px 12px 0;}
    .fnav{font-size:.8rem;}
  }
  @media (prefers-reduced-motion: reduce){ .box, .book{transition:none;} }
</style>
</head>
<body>
  <a class="site-logo" href="index.html"><img src="logo-blanc.png" alt="Atelier Chalou"></a>
  <a class="back" href="index.html">← Retour à l'accueil</a>

  <header class="head">
    <h1>Enquête policière <i>(ou pas)</i></h1>
    <p>La salle des archives : les dossiers sont rangés par spécialité. Commence par le livre de formation, puis choisis un carton.</p>
  </header>

  <main class="case">
      <section class="shelf bin wide" aria-label="Étagère Binaire">
        <div class="row"><button class="book" data-open="formation" aria-label="Livre : formation de l'enquêteur, test d'aptitude">
            <span class="bk-t">Formation<br>de l'enquêteur</span>
            <svg viewBox="0 0 100 120" aria-hidden="true" fill="none" stroke="#d7b96a" stroke-width="3" stroke-linecap="round"><path d="M50 10c-22 0-38 18-38 42"/><path d="M50 18c-17 0-30 14-30 34v14"/><path d="M50 26c-13 0-22 11-22 26v26"/><path d="M50 34c-8 0-14 7-14 18v34"/><path d="M50 42c-4 0-6 4-6 10v40"/><path d="M50 10c22 0 38 18 38 42v20"/><path d="M50 18c17 0 30 14 30 34v30"/><path d="M50 26c13 0 22 11 22 26v40"/><path d="M50 34c8 0 14 7 14 18v46"/><path d="M50 42c4 0 6 4 6 10v52"/><path d="M50 52v58"/></svg>
            <span class="bk-s">Test d'aptitude</span>
          </button><button class="box bin" data-open="chat" style="--r:-1.2deg; --h:0px" aria-label="Dossier I : Le Chat de Minuit">
            <span class="hole" aria-hidden="true"></span>
            <span class="lbl"><span class="no">N° I</span><span class="tt">Le Chat de Minuit</span><span class="lv">🔰 Recrue</span></span>
            <span class="tape" aria-hidden="true"></span>
          </button><button class="box bin" data-open="zero" style="--r:0.8deg; --h:6px" aria-label="Dossier II : Le casier du Professeur Zéro">
            <span class="hole" aria-hidden="true"></span>
            <span class="lbl"><span class="no">N° II</span><span class="tt">Le casier du Professeur Zéro</span><span class="lv">Agent · Inspecteur</span></span>
            <span class="tape" aria-hidden="true"></span>
          </button><button class="box bin" data-open="chien" style="--r:-0.5deg; --h:-4px" aria-label="Dossier III : Le chien volé du gardien">
            <span class="hole" aria-hidden="true"></span>
            <span class="lbl"><span class="no">N° III</span><span class="tt">Le chien volé du gardien</span><span class="lv">Intermédiaire</span></span>
            <span class="tape" aria-hidden="true"></span>
          </button><button class="box bin" data-open="drone" style="--r:1.4deg; --h:3px" aria-label="Dossier IV : La boîte noire du drone">
            <span class="hole" aria-hidden="true"></span>
            <span class="lbl"><span class="no">N° IV</span><span class="tt">La boîte noire du drone</span><span class="lv">Confirmé</span></span>
            <span class="tape" aria-hidden="true"></span>
          </button></div>
        <div class="plank"><span class="plate">🔢 Binaire</span></div>
      </section>
      <div class="lower"><section class="shelf prog " aria-label="Étagère Programmation">
        <div class="row"><button class="box prog" data-open="neopulse" style="--r:-0.8deg; --h:2px" aria-label="Dossier V : L'affaire NéoPulse">
            <span class="hole" aria-hidden="true"></span>
            <span class="lbl"><span class="no">N° V</span><span class="tt">L'affaire NéoPulse</span><span class="lv">🥇 Lieutenant</span><span class="tag2">+ Binaire</span></span>
            <span class="tape" aria-hidden="true"></span>
          </button></div>
        <div class="plank"><span class="plate">⚙️ Programmation</span></div>
      </section><section class="shelf ia " aria-label="Étagère Intelligence artificielle">
        <div class="row"><button class="box ia" data-open="ia" style="--r:0.6deg; --h:-3px" aria-label="Dossier VI : Qui a saboté l'IA ?">
            <span class="hole" aria-hidden="true"></span>
            <span class="lbl"><span class="no">N° VI</span><span class="tt">Qui a saboté l'IA ?</span><span class="lv">Intermédiaire · binôme</span></span>
            <span class="tape" aria-hidden="true"></span>
          </button><button class="box ia" data-open="pommes" style="--r:-1.1deg; --h:5px" aria-label="Dossier VII : Les pommes vertes">
            <span class="hole" aria-hidden="true"></span>
            <span class="lbl"><span class="no">N° VII</span><span class="tt">Les pommes vertes</span><span class="lv">🔰 Recrue</span></span>
            <span class="tape" aria-hidden="true"></span>
          </button></div>
        <div class="plank"><span class="plate">🤖 Intelligence artificielle</span></div>
      </section><section class="shelf net " aria-label="Étagère Réseaux informatiques">
        <div class="row"><button class="box net" data-open="reseau" style="--r:0.9deg; --h:0px" aria-label="Dossier VIII : La fuite de documents">
            <span class="hole" aria-hidden="true"></span>
            <span class="lbl"><span class="no">N° VIII</span><span class="tt">La fuite de documents</span><span class="lv">🥇 Lieutenant</span></span>
            <span class="tape" aria-hidden="true"></span>
          </button></div>
        <div class="plank"><span class="plate">🌐 Réseaux informatiques</span></div>
      </section></div>
  </main>
  <p class="legend"><span>🔰 Recrue</span><span>🥉 Agent</span><span>🥈 Inspecteur</span><span>🥇 Lieutenant</span></p>

  <dialog class="doc" id="doc" aria-labelledby="docTab">
    <div class="folder">
      <div class="ftab" id="docTab"></div>
      <button class="close" id="docClose" aria-label="Ranger le dossier">✕<span class="ct"> Ranger le dossier</span></button>
      <div class="sheets" id="docBody"></div>
      <div class="fnav"><button id="docPrev">← dossier précédent</button><button id="docNext">dossier suivant →</button></div>
    </div>
  </dialog>

    <template id="doc-formation"><div class="pg l"><p class="kicker">Avant de commencer</p>
          <h2>École de police scientifique</h2>
          <span class="stamp">TEST D'APTITUDE · OBLIGATOIRE</span>
          <p>On ne confie pas une enquête au premier venu. Avant de te remettre un dossier, l'École de police scientifique doit connaître ton niveau en <strong>binaire</strong>, le langage des machines… et des cartes perforées.</p>
          <dl class="facts">
            <dt>Spécialité</dt><dd><span class="spec">🔢 Binaire</span></dd>
            <dt>Épreuve</dt><dd>6 fiches de cours, chacune suivie d'un petit test (25 questions)</dd>
            <dt>Règle</dt><dd>un seul essai par question ; « Je ne sais pas » vaut mieux qu'une réponse au hasard</dd>
            <dt>À la fin</dt><dd>ton grade, l'enquête faite pour toi, et un rapport à remettre à ton professeur</dd>
          </dl></div><div class="pg r"><p class="kicker">Ton grade, ton enquête</p>
          <table class="grades">
            <tr><th>Grade</th><th>Enquête conseillée</th></tr>
            <tr><td>🔰 Recrue</td><td><button data-go="chat">I · Le Chat de Minuit</button> ou <button data-go="pommes">VII · Les pommes vertes</button></td></tr>
            <tr><td>🥉 Agent</td><td><button data-go="zero">II · Professeur Zéro, niveau Apprenti</button></td></tr>
            <tr><td>🥈 Inspecteur</td><td><button data-go="zero">II · Professeur Zéro, niveau Expert</button></td></tr>
            <tr><td>🥇 Lieutenant</td><td><button data-go="neopulse">V · L'affaire NéoPulse</button> ou <button data-go="reseau">VIII · La fuite de documents</button></td></tr>
          </table>
          <p class="hook">Alors, simple recrue ou futur lieutenant ? Il n'y a qu'une façon de le savoir.</p>
          <a class="open" href="formation-police-scientifique.html" target="_blank" rel="noopener">🪪 Passer le test d'aptitude</a></div></template>
    <template id="doc-chat"><div class="pg l"><p class="kicker">Dossier N° I</p>
          <h2>L'affaire du Chat de Minuit 🐈‍⬛</h2>
          <span class="stamp">AVIS DE RECHERCHE · URGENT</span>
          <p>Au musée, ce matin, un cadre est vide. Le tableau s'est volatilisé pendant la nuit, et les alarmes n'ont rien vu.</p>
