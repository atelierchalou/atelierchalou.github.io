<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#152720; --chalk:#f4f0e2; --chalk-dim:#b9c2b6; --accent:#e8c468; --paper:#fbfbf7; --ink:#1b1b1b; --grey:#6d6d68; --rule:#d9d9d2;}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:14px 16px 18px;
    color:var(--chalk); font-family:'Nunito Sans',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% 40%, #213d33 0%, var(--bg) 60%, #0e1a15 100%);
  }
  @media (min-width:900px) and (min-height:600px){ body{height:100dvh; overflow:hidden;} }
  .site-logo{position:fixed; top:16px; left:16px; z-index:10;}
  .site-logo img{display:block; height:36px; width:auto;}
  .back{color:var(--chalk-dim); text-decoration:none; font-size:.9rem; padding:4px 0 6px;}
  .back:hover{color:var(--accent);}

  /* ===== En-tête ===== */
  .head{width:100%; max-width:1180px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px 24px; flex-wrap:wrap; margin:0 0 12px;}
  .head .kick{margin:0; font-size:.74rem; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:var(--accent);}
  .head h1{margin:2px 0 0; font-size:clamp(1.6rem, 3vw, 2.3rem); font-weight:900; line-height:1.05;}
  .head .lead{margin:2px 0 0; color:var(--chalk-dim); font-size:.95rem;}
  .hint{display:flex; align-items:center; gap:10px; max-width:430px; font-size:.86rem; line-height:1.4; color:var(--chalk); background:rgba(244,240,226,.07); border:1px solid rgba(244,240,226,.18); border-radius:6px; padding:8px 12px;}
  .hint .tri{flex:0 0 auto; width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-bottom:21px solid var(--accent); position:relative;}
  .hint .tri::after{content:"!"; position:absolute; left:-2px; top:5px; color:var(--ink); font-size:.8rem; font-weight:900;}

  /* ===== Le présentoir de fiches ===== */
  .fiches{width:100%; max-width:1180px; flex:1; min-height:0; display:grid; grid-template-columns:repeat(3, 1fr); grid-auto-rows:1fr; gap:14px;}
  .fiche{
    position:relative; display:flex; flex-direction:column; min-height:0; text-align:left; font:inherit; color:var(--ink); cursor:pointer;
    padding:10px 14px 12px; border:2px solid var(--ink); border-radius:4px;
    background:radial-gradient(circle at 12% 88%, var(--p0), transparent 60%), linear-gradient(180deg, var(--p0), var(--paper) 50%);
    box-shadow:0 8px 18px rgba(0,0,0,.4); transition:transform .15s, box-shadow .15s;
  }
  .fiche:nth-child(3n+1){transform:rotate(-.5deg);} .fiche:nth-child(3n+2){transform:rotate(.4deg);} .fiche:nth-child(3n){transform:rotate(-.2deg);}
  .fiche:hover, .fiche:focus-visible{transform:translateY(-4px) rotate(0); box-shadow:0 0 0 3px var(--accent), 0 14px 26px rgba(0,0,0,.5); outline:none;}
  .fiche::before{content:""; position:absolute; top:-9px; left:50%; width:54px; height:16px; margin-left:-27px; background:rgba(240,230,190,.75); transform:rotate(-2deg); box-shadow:0 1px 1px rgba(0,0,0,.2);}
  .fiche .runner{margin-bottom:8px; padding-bottom:4px; font-size:.62rem;}
  .fbody{flex:1; min-height:0; display:grid; grid-template-columns:44% 1fr; gap:10px; align-items:center;}
  .fart{min-height:0; height:100%; display:flex; align-items:center; justify-content:center;}
  .thumb{width:100%; height:100%; max-height:150px;}
  .ftxt{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .fnum{display:grid; place-items:center; width:38px; height:38px; border-radius:50%; background:var(--p3); border:3px solid var(--ink); font-size:1.3rem; font-weight:900; margin-bottom:2px;}
  .ftxt .kicker{font-size:.62rem; letter-spacing:.12em;}
  .fh{font-size:1.08rem; font-weight:900; line-height:1.15;}
  .more{margin-top:4px; font-size:.82rem; font-weight:900; color:var(--grey);}
  .fiche:hover .more{color:var(--ink);}

  /* ===== Une fiche ouverte (même mise en page que l'ancienne double page) ===== */
  .runner{display:flex; justify-content:space-between; font-size:.68rem; font-weight:900; letter-spacing:.18em; color:var(--grey); border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:14px; box-shadow:0 3px 0 var(--p2);}
  .kicker{margin:0; font-size:.78rem; font-weight:900; letter-spacing:.16em; text-transform:uppercase; color:var(--grey);}
  dialog.open{border:0; padding:0; background:transparent; width:min(1120px, calc(100vw - 32px)); max-height:calc(100dvh - 40px); overflow:visible;}
  dialog.open::backdrop{background:rgba(8,14,11,.72); backdrop-filter:blur(2px);}
  .closebar{display:flex; justify-content:flex-end; margin-bottom:6px;}
  .closebar button{font:inherit; font-weight:800; font-size:.9rem; color:var(--chalk); background:none; border:0; cursor:pointer; padding:4px 6px;}
  .closebar button:hover{color:var(--accent);}
  .sheet{display:grid; grid-template-columns:1fr 1fr; max-height:calc(100dvh - 80px); border:2px solid var(--ink); border-radius:4px; background:var(--paper); box-shadow:0 20px 50px rgba(0,0,0,.55); animation:pull .35s cubic-bezier(.2,.8,.3,1);}
  @keyframes pull{from{opacity:0; transform:translateY(24px) rotate(-1deg);} to{opacity:1; transform:none;}}
  .pg{position:relative; min-height:0; overflow-y:auto; padding:22px 30px 26px; color:var(--ink); display:flex; flex-direction:column; scrollbar-width:thin;}
  .pg.left{background:linear-gradient(90deg, transparent 88%, rgba(0,0,0,.07)), radial-gradient(circle at 15% 85%, var(--p0), transparent 60%), var(--paper);}
  .pg.right{border-left:1px solid var(--rule); background:linear-gradient(90deg, rgba(0,0,0,.09), transparent 12%), linear-gradient(180deg, var(--p0), var(--paper) 45%);}
  h2{margin:2px 0 10px; font-size:1.45rem; font-weight:900; line-height:1.15;}
  h3{margin:6px 0 8px; font-size:.82rem; font-weight:900; letter-spacing:.14em; text-transform:uppercase;}
  .art{flex:1; min-height:140px; display:flex; align-items:center; justify-content:center;}
  .art .ill{width:100%; height:100%; max-height:340px;}
  .legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin:6px 0 0; font-size:.86rem; font-weight:700; color:#333;}
  .legend b{display:inline-grid; place-items:center; width:22px; height:22px; border:2px solid var(--ink); border-radius:50%; font-size:.75rem; margin-right:4px; background:var(--p1);}
  .stephead{display:flex; align-items:center; gap:16px; margin-bottom:6px;}
  .num{flex:0 0 auto; display:grid; place-items:center; width:72px; height:72px; border-radius:50%; background:var(--p3); color:var(--ink); border:3px solid var(--ink); font-size:2.6rem; font-weight:900;}
  .needs{list-style:none; margin:0 0 10px; padding:0; display:flex; flex-wrap:wrap; gap:8px;}
  .needs li{border:2px solid var(--ink); border-radius:6px; padding:5px 10px; font-weight:800; font-size:.88rem; background:var(--p1);}
  .sub{margin:0 0 14px; padding:0; list-style:none; counter-reset:s;}
  .sub li{counter-increment:s; position:relative; padding:5px 0 7px 40px; line-height:1.45; border-bottom:1px dashed var(--rule);}
  .sub li::before{content:counter(s, lower-alpha); position:absolute; left:0; top:4px; width:26px; height:26px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; font-weight:900; font-size:.85rem; background:var(--p1);}
  .go{align-self:flex-start; display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); background:var(--p3); font-weight:900; font-size:1.02rem; padding:11px 20px; border:2px solid var(--ink); border-radius:6px; box-shadow:4px 4px 0 var(--ink); transition:transform .12s, box-shadow .12s;}
  .go:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink);}
  .nav{display:flex; justify-content:space-between; margin-top:auto; padding-top:14px;}
  .nav button{font:inherit; font-weight:800; font-size:.88rem; color:var(--grey); background:none; border:0; cursor:pointer; padding:4px 0;}
  .nav button:hover{color:var(--ink);}

  /* ===== Couleurs pastel : une couleur par fiche ===== */
  #f-electronique, #d-electronique{--p1:#d3f1e1; --p2:#b6e4cc; --p3:#95d3b2; --p0:#f1fbf5;}
  #f-volumes, #d-volumes{--p1:#e6ddf8; --p2:#d2c5f0; --p3:#bba9e5; --p0:#f7f3fd;}
  #f-boitier, #d-boitier{--p1:#ffe3cc; --p2:#fdd0ab; --p3:#f6b98b; --p0:#fff6ee;}
  #f-pistolet, #d-pistolet{--p1:#fcd9e1; --p2:#f7c2cf; --p3:#eea6b7; --p0:#fff2f5;}
  #f-soufflerie, #d-soufflerie{--p1:#d6ecfb; --p2:#bde0f7; --p3:#a0cef0; --p0:#f1f8fe;}
  #f-robot, #d-robot{--p1:#e6f4c9; --p2:#d3eba8; --p3:#bcdd83; --p0:#f6fbeb;}
  #f-drone, #d-drone{--p1:#fdf0c2; --p2:#fae39a; --p3:#f2cf6b; --p0:#fffaea;}
  #f-lecteur, #d-lecteur{--p1:#d4f0ee; --p2:#b4e3df; --p3:#8fd1cb; --p0:#effaf9;}
  #f-laser, #d-laser{--p1:#ffe0d6; --p2:#ffc9b8; --p3:#f8a98f; --p0:#fff4f0;}

  /* écrans moins hauts : vignettes plus petites */
  @media (min-width:900px) and (max-height:820px){ .head .lead{display:none;} .fh{font-size:1rem;} .fnum{width:32px; height:32px; font-size:1.1rem;} .more{display:none;} }
  @media (max-width:1050px){ .fiches{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width:899px){ .fiches{grid-auto-rows:auto;} .thumb{max-height:130px;} .fbody{min-height:130px;} }
  @media (max-width:820px){
    .sheet{grid-template-columns:1fr; overflow-y:auto;}
    .pg{overflow:visible;}
    .pg.right{border-left:0; border-top:2px dashed var(--rule);}
    .art .ill{max-height:260px;}
  }
  @media (max-width:599px){
    body{padding-top:62px;}
    .back{position:absolute; top:24px; right:16px; padding:0;}
    .fiches{grid-template-columns:1fr;}
    .pg{padding:18px 18px 22px;}
    .num{width:56px; height:56px; font-size:2rem;}
  }
  @media (prefers-reduced-motion: reduce){ .sheet{animation:none;} .fiche{transition:none;} }
</style>
</head>

<script>
/* Les fiches : clic sur une fiche = elle s'ouvre ; ← → pour passer à la suivante ; #ancre pour ouvrir directement une fiche */
(function(){
  var ORDER = ["electronique", "volumes", "boitier", "pistolet", "soufflerie", "robot", "drone", "lecteur", "laser"], cur = -1, opener = null;
  var dlg = document.getElementById('sheet'), body = document.getElementById('sheetBody');
  function show(k){
    var i = ORDER.indexOf(k), t = document.getElementById('t-' + k); if (i < 0 || !t) return;
    cur = i; body.innerHTML = ''; body.appendChild(t.content.cloneNode(true));
    if (!dlg.open) dlg.showModal();
    history.replaceState(null, '', '#' + k);
  }
  function close(){ if (dlg.open) dlg.close(); }
  dlg.addEventListener('close', function(){ history.replaceState(null, '', location.pathname + location.search); if (opener) opener.focus(); opener = null; });
  dlg.addEventListener('click', function(e){ if (e.target === dlg) close(); var b = e.target.closest('[data-open]'); if (b) show(b.dataset.open); });
  document.getElementById('closeBtn').addEventListener('click', close);
  document.querySelectorAll('.fiche').forEach(function(f){ f.addEventListener('click', function(){ opener = f; show(f.dataset.open); }); });
  document.addEventListener('keydown', function(e){
    if (!dlg.open) return;
    if (e.key === 'ArrowRight' && cur < ORDER.length - 1) show(ORDER[cur + 1]);
    if (e.key === 'ArrowLeft' && cur > 0) show(ORDER[cur - 1]);
  });
  var h = location.hash.slice(1); if (ORDER.indexOf(h) >= 0) show(h);
})();
</script>
