<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Établi et boîte à outils</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#152720; --chalk:#f4f0e2; --chalk-dim:#b9c2b6; --accent:#e8c468;
    --peg:#c9965c; --peg2:#b9844b; --hole:#4a2f17;
    --wood:#9a6a3a; --wood2:#7b5129; --wood3:#5c3a1b; --label:#f6efdc; --ink:#2a1a0c; --mut:#6d5640;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100dvh; display:flex; flex-direction:column; padding:10px 16px 14px; color:var(--chalk); font-family:'Nunito Sans',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% 30%, #213d33 0%, var(--bg) 60%, #0e1a15 100%);
  }
  @media (min-width:700px) and (min-height:540px){ body{height:100dvh; overflow:hidden;} }
  .site-logo{position:fixed; top:14px; left:16px; z-index:10;}
  .site-logo img{display:block; height:36px; width:auto;}
  .back{align-self:center; color:var(--chalk-dim); text-decoration:none; font-size:.9rem; padding:2px 0 8px;}
  .back:hover{color:var(--accent);}

  .shop{flex:1; min-height:0; width:min(1280px,100%); margin:0 auto; display:flex; flex-direction:column;}

  /* ===== Panneau perforé ===== */
  .board{
    position:relative; flex:1; min-height:0; display:flex; flex-direction:column; border-radius:10px 10px 0 0;
    background-color:var(--peg);
    background-image:radial-gradient(circle at 50% 50%, var(--hole) 2.6px, rgba(0,0,0,.18) 3.4px, transparent 4px),
                     linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.06));
    background-size:26px 26px, 100% 100%; background-position:13px 13px, 0 0;
    box-shadow:inset 0 0 0 7px var(--peg2), inset 0 0 0 9px rgba(0,0,0,.15), 0 14px 30px rgba(0,0,0,.45);
  }
  .top{display:flex; align-items:center; gap:14px; padding:18px 26px 8px; flex-wrap:wrap; flex:0 0 auto;}
  .sign{
    font-family:'Kalam',cursive; font-size:1.85rem; line-height:1; color:var(--ink); margin:0;
    background:linear-gradient(180deg,#f8edd3,#ecdcb6); padding:8px 18px 6px; border-radius:4px; transform:rotate(-1.5deg);
    box-shadow:0 3px 0 rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.25); position:relative;
  }
  .sign::before,.sign::after{content:""; position:absolute; top:7px; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#eee,#777);}
  .sign::before{left:6px;} .sign::after{right:6px;}
  .count{font-weight:900; font-size:.85rem; color:var(--ink); background:rgba(255,255,255,.45); padding:3px 10px; border-radius:999px;}
  .search{margin-left:auto; position:relative; flex:0 1 330px; min-width:200px;}
  .search input{
    width:100%; font:inherit; font-size:.95rem; padding:9px 34px 9px 38px; border-radius:6px; color:var(--ink);
    border:2px solid #8a6a45; background:#fbf6ea; box-shadow:inset 0 2px 3px rgba(0,0,0,.12);
  }
  .search input:focus{outline:3px solid var(--accent); outline-offset:1px;}
  .search .ico{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.6; pointer-events:none;}
  .search .clear{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:#eadfc8; border-radius:50%; width:24px; height:24px; cursor:pointer; color:var(--mut); display:none;}
  .search.has .clear{display:block;}
  .search kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font:inherit; font-size:.72rem; color:var(--mut); border:1px solid #cdb995; border-radius:5px; padding:0 5px;}
  .search.has kbd{display:none;}

  .content{flex:1; min-height:0; overflow-y:auto; padding:6px 26px 22px; scrollbar-color:var(--wood2) transparent;}
  .group{margin:4px 0 6px;}
  .group h2{
    display:inline-flex; align-items:center; gap:8px; margin:10px 0 2px; font-family:'Kalam',cursive; font-size:1.1rem; line-height:1; color:#fff;
    background:var(--c,#5c3a1b); padding:6px 14px 4px; border-radius:3px; box-shadow:0 2px 0 rgba(0,0,0,.25); transform:rotate(-.8deg);
  }
  .group h2 button{font:inherit; font-family:'Nunito Sans',sans-serif; font-size:.72rem; font-weight:800; color:#fff; background:rgba(255,255,255,.2); border:0; border-radius:999px; padding:3px 9px; cursor:pointer; margin-left:4px;}
  .group h2 button:hover{background:rgba(255,255,255,.35);}
  .rack{display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:34px 22px; padding-top:30px;}

  /* ===== Une appli = un outil accroché ===== */
  .tool{
    --r:0deg; position:relative; display:grid; grid-template-columns:auto 1fr; gap:2px 11px; align-items:center; text-decoration:none; color:#fff;
    background:linear-gradient(160deg, var(--c), var(--c2)); border-radius:12px; padding:14px 14px 13px 12px; min-height:86px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -3px 0 rgba(0,0,0,.18), 0 7px 0 rgba(0,0,0,.18), 0 12px 18px rgba(0,0,0,.22);
    transform-origin:50% -26px; transform:rotate(var(--r)); transition:transform .35s cubic-bezier(.3,1.6,.5,1);
    animation:hang .9s cubic-bezier(.3,1.4,.45,1) both; animation-delay:calc(var(--i,0) * 45ms);
  }
  .tool::before{ /* le crochet */
    content:""; position:absolute; left:50%; top:-25px; width:14px; height:25px; margin-left:-7px;
    border:3px solid #6d7378; border-bottom:0; border-radius:10px 10px 0 0; background:none;
  }
  .tool::after{ /* le trou de la plaque */
    content:""; position:absolute; left:50%; top:6px; width:12px; height:5px; margin-left:-6px; border-radius:3px; background:rgba(0,0,0,.35); box-shadow:inset 0 1px 1px rgba(0,0,0,.5);
  }
  .tool:hover,.tool:focus-visible{--r:-3deg; outline:none;}
  .tool:focus-visible{box-shadow:0 0 0 4px var(--accent), 0 7px 0 rgba(0,0,0,.18), 0 12px 18px rgba(0,0,0,.22);}
  .tool:nth-child(even):hover{--r:3deg;}
  .tool .ic{grid-row:1 / 3; width:50px; height:50px; border-radius:50%; display:grid; place-items:center; font-size:1.55rem;
    background:rgba(255,255,255,.92); box-shadow:inset 0 -3px 0 rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.2);}
  .tool .nm{font-weight:900; font-size:.98rem; line-height:1.2; align-self:end; text-shadow:0 1px 0 rgba(0,0,0,.25);}
  .tool .ds{font-size:.8rem; line-height:1.3; opacity:.92; align-self:start; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tool .ct{grid-column:2; font-size:.68rem; font-weight:900; letter-spacing:.04em; opacity:.85;}
  .tool .screw{position:absolute; width:7px; height:7px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#f3f3f3,#8a8f93); box-shadow:0 1px 1px rgba(0,0,0,.35);}
  .tool .s1{left:6px; bottom:6px;} .tool .s2{right:6px; bottom:6px;}
  .tool .ia{display:inline-block; vertical-align:2px; margin-left:4px; padding:1px 7px; border-radius:999px; font-size:.66rem; font-weight:900; letter-spacing:.06em; color:#fff; text-shadow:none;
    background:linear-gradient(90deg,#7b5cff,#20c3d0,#ff5fa2,#7b5cff); background-size:300% 100%; animation:iaflow 4s linear infinite; box-shadow:0 0 0 1.5px rgba(255,255,255,.8);}
  .tool .ia::before{content:'✦ '; display:inline-block; animation:iatwinkle 1.6s ease-in-out infinite;}
  @keyframes iaflow{to{background-position:300% 0;}}
  @keyframes iatwinkle{0%,100%{transform:scale(1) rotate(0); opacity:1;}50%{transform:scale(1.35) rotate(45deg); opacity:.7;}}
  @keyframes hang{
    0%{opacity:0; transform:translateY(-36px) rotate(-16deg);}
    45%{opacity:1; transform:translateY(0) rotate(9deg);}
    70%{transform:rotate(-4deg);} 88%{transform:rotate(1.5deg);} 100%{transform:rotate(var(--r));}
  }
  mark{background:#ffe58a; color:#2a1a0c; border-radius:3px; padding:0 1px;}
  .empty{text-align:center; color:var(--ink); font-weight:800; padding:40px 10px; font-size:1rem;}
  .empty span{background:rgba(255,255,255,.55); padding:8px 16px; border-radius:8px;}

  /* ===== L'établi et ses tiroirs ===== */
  .bench{flex:0 0 auto; height:20px; border-radius:4px; margin:0 -10px; position:relative; z-index:2;
    background:linear-gradient(180deg,#c48b4f 0,#a8723c 45%,#7d5128 100%); box-shadow:0 6px 10px rgba(0,0,0,.4);}
  .bench::before{content:""; position:absolute; inset:3px 0 auto; height:2px; background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 60px,transparent 60px 140px);}
  .cabinet{
    flex:0 0 auto; display:grid; grid-template-columns:repeat(var(--nd,8), minmax(0,1fr)); gap:8px; padding:12px 12px 14px; border-radius:0 0 10px 10px;
    background:linear-gradient(180deg,var(--wood3),#4a2e14); box-shadow:inset 0 6px 10px rgba(0,0,0,.45), 0 14px 24px rgba(0,0,0,.4);
  }
  .drawer{
    all:unset; box-sizing:border-box; cursor:pointer; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    min-height:84px; padding:8px 6px 9px; border-radius:5px; color:var(--ink); text-align:center;
    background:linear-gradient(180deg,#b9824a,var(--wood)); box-shadow:inset 0 0 0 3px rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.25), 0 3px 0 rgba(0,0,0,.35);
    transition:transform .3s cubic-bezier(.3,1.5,.5,1), box-shadow .3s, filter .2s;
  }
  .drawer:hover{filter:brightness(1.08);}
  .drawer:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .drawer .lb{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:2px 6px; width:100%; max-width:150px; min-height:44px; background:var(--label); border:2px solid #9b9b9b; border-radius:3px; padding:3px 7px; font-weight:900; font-size:.8rem; line-height:1.1;
    box-shadow:inset 0 0 0 1px #fff;}
  .drawer .lb b{flex:0 0 100%; font-size:.76rem; line-height:1.15; overflow-wrap:anywhere;}
  .drawer .n{font-size:.68rem; font-weight:900; color:#fff; background:var(--c); border-radius:999px; padding:0 6px; flex:0 0 auto;}
  .drawer .hd{width:44%; max-width:58px; height:9px; border-radius:5px; background:linear-gradient(180deg,#d8dcdf,#80868b); box-shadow:0 2px 2px rgba(0,0,0,.4);}
  .drawer[aria-selected="true"]{
    transform:translateY(7px) scale(1.04); z-index:1;
    background:linear-gradient(180deg,#d39a5e,#a8723c);
    box-shadow:0 -10px 0 -3px #2a180a, inset 0 0 0 3px var(--c), 0 10px 14px rgba(0,0,0,.5);
  }
  .drawer[aria-selected="true"] .lb{border-color:var(--c);}

  /* tablette en portrait : tiroirs sur 3 rangées */
  @media (min-width:700px) and (max-width:1100px){ .cabinet{grid-template-columns:repeat(4, minmax(0,1fr));} }
  @media (min-width:700px) and (orientation:portrait){ .cabinet{grid-template-columns:repeat(4, minmax(0,1fr));} .rack{grid-template-columns:repeat(auto-fill, minmax(210px,1fr));} }
  /* téléphone : la page défile, les tiroirs passent en haut et défilent de côté */
  @media (max-width:699px){
    body{padding:58px 10px 14px;}
    .back{position:absolute; top:22px; right:14px; padding:0;}
    .shop{display:flex; flex-direction:column;}
    .board{order:3; border-radius:0 0 10px 10px;}
    .bench{order:2; margin:0;}
    .cabinet{order:1; display:flex; overflow-x:auto; gap:8px; border-radius:10px 10px 0 0; padding:10px; scrollbar-width:none; position:sticky; top:0; z-index:5;}
    .cabinet::-webkit-scrollbar{display:none;}
    .drawer{flex:0 0 118px; min-height:80px;}
    .drawer[aria-selected="true"]{transform:translateY(3px) scale(1.03);}
    .top{padding:16px 14px 4px;} .search{flex-basis:100%; margin-left:0;}
    .content{overflow:visible; padding:4px 14px 22px;}
    .rack{grid-template-columns:1fr; gap:32px;}
  }

  /* ===== Le petit robot de l'accueil qui se promène sur l'établi ===== */
  .track{position:absolute; left:14px; right:14px; bottom:100%; height:124px; pointer-events:none; z-index:3; overflow:hidden;}
  @media (max-width:699px){ .track{display:none;} }
  .walker{position:absolute; bottom:-2px; left:0; width:122px; height:90px; animation:walk 26s linear infinite;}
  .bot{position:absolute; left:0; top:0; width:760px; height:560px; transform-origin:0 0; transform:scale(.16);}
  .bot .b{position:absolute; border:6px solid #6b3d16; border-radius:14px;
    background:repeating-linear-gradient(92deg, rgba(110,62,24,.16) 0 4px, transparent 4px 22px), linear-gradient(170deg,#e2b077,#c68a4c 45%,#a8703a);
    box-shadow:inset 0 -10px 16px rgba(80,40,10,.3), 0 12px 20px rgba(0,0,0,.35);}
  .bot .head{left:255px; top:44px; width:250px; height:140px; border-radius:26px; display:flex; justify-content:center; align-items:center; gap:52px;}
  .bot .eye{width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#fff8d0,#ffd34d 45%,#e8a400); box-shadow:0 0 0 6px #8a5a2b, 0 0 26px 8px rgba(255,211,77,.8); animation:blink 4.5s infinite 1s;}
  .bot .torso{left:228px; top:204px; width:304px; height:212px; border-radius:20px; display:flex; justify-content:center; align-items:flex-end; gap:22px; padding-bottom:40px;}
  .bot .led{width:30px; height:30px; border-radius:50%; animation:pulse 1.6s infinite;}
  .bot .led:nth-child(1){background:#7fe08a; box-shadow:0 0 16px #7fe08a;}
  .bot .led:nth-child(2){background:#ffd34d; box-shadow:0 0 16px #ffd34d; animation-delay:.4s;}
  .bot .led:nth-child(3){background:#ff7a5c; box-shadow:0 0 16px #ff7a5c; animation-delay:.8s;}
  .bot .larm{left:18px; top:214px; width:196px; height:116px; border-radius:18px; transform-origin:100% 50%; animation:swingL 1.2s ease-in-out infinite;}
  .bot .rarm{left:546px; top:214px; width:196px; height:116px; border-radius:18px; transform-origin:0 50%; animation:swingR 1.2s ease-in-out infinite;}
  .bot .lhand{left:2px; top:326px; width:56px; height:44px; border-radius:0 0 28px 28px; clip-path:polygon(0 0,30% 0,50% 45%,70% 0,100% 0,100% 100%,0 100%);}
  .bot .rhand{left:702px; top:326px; width:56px; height:44px; border-radius:0 0 28px 28px; clip-path:polygon(0 0,30% 0,50% 45%,70% 0,100% 0,100% 100%,0 100%);}
  .bot .larm .lhand,.bot .rarm .rhand{top:106px;}
  .bot .larm .lhand{left:-22px;} .bot .rarm .rhand{left:150px;}
  .bot .legs{left:252px; top:428px; width:256px; height:98px; border-radius:16px;}
  .bot .antenna{left:374px; top:6px; width:12px; height:40px; border-radius:6px; border-width:4px;}
  .bot .ball{left:362px; top:-6px; width:36px; height:36px; border-radius:50%; border-width:4px; background:radial-gradient(circle at 40% 35%,#ffd9cf,#ff6b4a 55%,#c0381c); box-shadow:0 0 22px 6px rgba(255,107,74,.75); animation:pulse 1.2s infinite;}
  .bot .neck{left:350px; top:182px; width:60px; height:26px; border-radius:6px;}
  .bot .lsh{left:202px; top:238px; width:40px; height:40px; border-radius:50%;}
  .bot .rsh{left:518px; top:238px; width:40px; height:40px; border-radius:50%;}
  .bot .hips{left:300px; top:412px; width:160px; height:22px; border-radius:6px;}
  .bot .lfoot{left:250px; top:522px; width:110px; height:32px; border-radius:16px 16px 6px 6px; animation:step .6s ease-in-out infinite;}
  .bot .rfoot{left:400px; top:522px; width:110px; height:32px; border-radius:16px 16px 6px 6px; animation:step .6s ease-in-out infinite .3s;}
  .bot .up{position:absolute; inset:0; animation:bob .3s ease-in-out infinite alternate;}
  .say{position:absolute; right:112px; top:-8px; white-space:nowrap; padding:4px 10px; border-radius:12px; background:#fff8e8; color:#3b2412; font-weight:900; font-size:.78rem;
    box-shadow:0 4px 10px rgba(0,0,0,.35); opacity:0; transform:scale(.6); transform-origin:right bottom; animation:say 26s infinite;}
  .say::after{content:""; position:absolute; right:-6px; bottom:5px; border:6px solid transparent; border-left-color:#fff8e8; border-right:0;}
  @keyframes walk{
    0%{left:0; transform:scaleX(1);} 44%{left:calc(100% - 122px); transform:scaleX(1);}
    50%{left:calc(100% - 122px); transform:scaleX(1);} 50.01%{transform:scaleX(-1);}
    94%{left:0; transform:scaleX(-1);} 99.99%{left:0; transform:scaleX(-1);} 100%{left:0; transform:scaleX(1);}
  }
  @keyframes say{0%,44%{opacity:0; transform:scale(.6);} 45.5%,49%{opacity:1; transform:none;} 50%,100%{opacity:0; transform:scale(.6);}}
  @keyframes step{0%,100%{transform:translateY(0);} 50%{transform:translateY(-26px);}}
  @keyframes bob{to{transform:translateY(-10px);}}
  @keyframes swingL{0%,100%{transform:rotate(10deg);} 50%{transform:rotate(-10deg);}}
  @keyframes swingR{0%,100%{transform:rotate(-10deg);} 50%{transform:rotate(10deg);}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);} 95%{transform:scaleY(.1);}}
  @keyframes pulse{50%{opacity:.35;}}
  
  @media (prefers-reduced-motion: reduce){
    .walker{animation:none; left:auto; right:0;} .bot *, .bot .up{animation:none !important;} .say{animation:none; opacity:1; transform:none;}
  }
  @media (prefers-reduced-motion: reduce){ .tool{animation:none; transition:none;} .drawer{transition:none;} .tool .ia,.tool .ia::before{animation:none;} }
</style>
</head>
<body>
  <a class="site-logo" href="index.html"><img src="logo-blanc.png" alt="Atelier Chalou"></a>
  <a class="back" href="index.html">← Retour à l'accueil</a>

  <main class="shop">
    <section class="board">
      <div class="top">
        <h1 class="sign">🔧 Établi et boîte à outils</h1>
        <span class="count" id="total"></span>
        <label class="search" id="searchBox">
          <span class="ico" aria-hidden="true">🔍</span>
          <input id="q" type="text" placeholder="Chercher un outil…" autocomplete="off" aria-label="Rechercher une appli">
          <kbd aria-hidden="true">/</kbd>
          <button class="clear" id="clear" type="button" aria-label="Effacer la recherche">✕</button>
        </label>
      </div>
      <div class="content" id="content" role="tabpanel" aria-live="polite"></div>
    </section>
    <div class="bench" aria-hidden="true">
      <div class="track"><div class="walker"><div class="bot"><div class="up">
        <div class="b antenna"></div><div class="b ball"></div><div class="b neck"></div><div class="b lsh"></div><div class="b rsh"></div>
        <div class="b larm"><div class="b lhand"></div></div><div class="b rarm"><div class="b rhand"></div></div>
        <div class="b hips"></div><div class="b lfoot"></div><div class="b rfoot"></div><div class="b legs"></div>
        <div class="b torso"><span class="led"></span><span class="led"></span><span class="led"></span></div>
        <div class="b head"><span class="eye"></span><span class="eye"></span></div>
      </div></div><span class="say">Bonne appli !</span></div></div>
    </div>
    <nav class="cabinet" role="tablist" aria-label="Tiroirs : catégories d’applis" id="tabs"></nav>
  </main>

<script>
var CATS = [
 {
  "name": "Les outils du prof",
  "apps": [
   {

    "ico": "🖍️",
    "name": "Ardoise du Prof",

   },
   {
    "href": "tableau-classe-standalone.html",
    "ico": "📋",
    "name": "Tableau de classe",
    "desc": "Diffusion en direct vers les téléphones des élèves."
   }
  ],
  "ico": "🧑‍🏫",
  "c1": "#2f7d6b",
  "c2": "#1d4f45"
 },
 {
  "name": "Vidéo et image",
  "apps": [
   {

   },
   {
    "href": "stop-motion-studio.html",

   },
   {
    "href": "atelier-teintes.html",

    "name": "Atelier Teintes",
    "desc": "Explorer et composer des palettes de couleurs."
   },
   {
    "href": "modeleur-volumique.html",
    "ico": "🧊",
    "name": "Modeleur Volumique",
    "desc": "Créer et manipuler des formes en volume."
   },
   {
    "href": "realise-ton-scenario.html",
    "ico": "🎥",
    "name": "Réalise ton scénario",
    "desc": "Écrire et mettre en scène un scénario, étape par étape."
   },
   {
    "href": "photo-co.html",

    "name": "Photo CO",
    "desc": "Course d'orientation photo : rejoindre des objectifs, les prendre en photo, puis revoir son parcours sur la carte."
   }

(function(){
  var tabs = document.getElementById('tabs'), content = document.getElementById('content'), q = document.getElementById('q');
  var cur = -1;                                                     // -1 = tout le panneau
  var total = CATS.reduce(function(n, c){ return n + c.apps.length; }, 0);
  document.getElementById('total').textContent = total + ' outils';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function hl(text, term){
    if (!term) return esc(text);
    var n = norm(text), i = n.indexOf(term);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  }
  var k = 0;
  function tool(a, c, term, showCat){
    return '<a class="tool" href="' + a.href + '" target="_blank" rel="noopener" style="--c:' + c.c1 + ';--c2:' + c.c2 + ';--i:' + (k++) + '">' +
      '<span class="ic" aria-hidden="true">' + a.ico + '</span><span class="nm">' + hl(a.name, term) + (a.ia ? ' <span class="ia" title="Intelligence artificielle">IA</span>' : '') + '</span>' +
      '<span class="ds">' + hl(a.desc, term) + '</span>' + (showCat ? '<span class="ct">' + c.ico + ' ' + esc(c.name) + '</span>' : '') +
      '<span class="screw s1" aria-hidden="true"></span><span class="screw s2" aria-hidden="true"></span></a>';
  }

  /* tiroirs : « Tout » + un par catégorie */
  var defs = [{name:'Tout l’établi', ico:'🧰', n:total, c:'#5c3a1b'}].concat(CATS.map(function(c){ return {name:c.name, ico:c.ico, n:c.apps.length, c:c.c1}; }));
  tabs.style.setProperty('--nd', defs.length);
  defs.forEach(function(d, i){
    var b = document.createElement('button');
    b.className = 'drawer'; b.setAttribute('role', 'tab'); b.id = 'tab' + (i - 1); b.style.setProperty('--c', d.c); b.title = d.name;
    b.innerHTML = '<span class="lb"><span aria-hidden="true">' + d.ico + '</span><span class="n">' + d.n + '</span><b>' + esc(d.name) + '</b></span><span class="hd" aria-hidden="true"></span>';
    b.addEventListener('click', function(){ q.value = ''; syncSearch(); show(i - 1); });
    tabs.appendChild(b);
  });

  function render(){
    var term = norm(q.value.trim()), html = ''; k = 0;
    if (term) {
      var hits = [];
      CATS.forEach(function(c){ c.apps.forEach(function(a){ if (norm(a.name + ' ' + a.desc).indexOf(term) >= 0) hits.push(tool(a, c, term, true)); }); });
      html = hits.length ? '<div class="rack">' + hits.join('') + '</div>'
                         : '<p class="empty"><span>Aucun outil ne correspond à « ' + esc(q.value.trim()) + ' ».</span></p>';
    } else if (cur < 0) {
      html = CATS.map(function(c, i){
        return '<section class="group" style="--c:' + c.c1 + '"><h2><span aria-hidden="true">' + c.ico + '</span>' + esc(c.name) +
          '<button data-cat="' + i + '">Ouvrir ce tiroir</button></h2><div class="rack">' +
          c.apps.map(function(a){ return tool(a, c, '', false); }).join('') + '</div></section>';
      }).join('');
    } else {
      var c = CATS[cur];
      html = '<div class="rack">' + c.apps.map(function(a){ return tool(a, c, '', false); }).join('') + '</div>';
    }
    content.innerHTML = html;
    content.querySelectorAll('[data-cat]').forEach(function(b){ b.addEventListener('click', function(){ show(+b.dataset.cat); }); });
    content.scrollTop = 0;
  }
  function show(i){
    cur = i;
    tabs.querySelectorAll('.drawer').forEach(function(t, j){ var on = !q.value.trim() && (j - 1) === i; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = (j - 1) === i ? 0 : -1; });
    var t = document.getElementById('tab' + i); if (t && window.innerWidth < 700) t.scrollIntoView({block:'nearest', inline:'center'});
    render();
  }
  function syncSearch(){ document.getElementById('searchBox').classList.toggle('has', !!q.value); }
  q.addEventListener('input', function(){ syncSearch(); show(cur); });
  document.getElementById('clear').addEventListener('click', function(e){ e.preventDefault(); q.value = ''; syncSearch(); show(cur); q.focus(); });
  document.addEventListener('keydown', function(e){
    var inInput = e.target === q;
    if (e.key === '/' && !inInput) { e.preventDefault(); q.focus(); return; }
    if (e.key === 'Escape' && inInput) { q.value = ''; syncSearch(); show(cur); q.blur(); return; }
    if (inInput) return;
    var n = null;
    if (e.key === 'ArrowRight') n = cur + 1 < CATS.length ? cur + 1 : -1;
    if (e.key === 'ArrowLeft') n = cur - 1 >= -1 ? cur - 1 : CATS.length - 1;
    if (n !== null) { show(n); if (e.target.classList && e.target.classList.contains('drawer')) document.getElementById('tab' + n).focus(); }
  });
  show(-1);
})();
</script>
