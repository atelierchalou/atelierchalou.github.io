<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes applis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#152720; --chalk:#f4f0e2; --chalk-dim:#b9c2b6; --accent:#e8c468;
        --scr:#f2f4f1; --card:#ffffff; --ink:#18231f; --mut:#5e6b66; --line:#dfe4e0; --hi:#1f6f5c;}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:12px 16px 16px;
    color:var(--chalk); font-family:'Nunito Sans',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% 40%, #213d33 0%, var(--bg) 60%, #0e1a15 100%);
  }
  @media (min-width:700px) and (min-height:520px){ body{height:100dvh; overflow:hidden;} }
  .site-logo{position:fixed; top:16px; left:16px; z-index:10;}
  .site-logo img{display:block; height:36px; width:auto;}
  .back{color:var(--chalk-dim); text-decoration:none; font-size:.9rem; padding:2px 0 10px;}
  .back:hover{color:var(--accent);}

  /* ===== La tablette ===== */
  .stage{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center;}
  .tablet{
    position:relative; width:min(1240px, calc(100vw - 32px), calc((100dvh - 64px) * 1.5)); aspect-ratio:3/2;
    background:#0b0f0e; border-radius:34px; padding:18px;
    box-shadow:0 0 0 2px #2b3431, 0 0 0 4px #0b0f0e, 0 30px 70px rgba(0,0,0,.6);
  }
  .tablet::before{content:""; position:absolute; top:7px; left:50%; width:6px; height:6px; margin-left:-3px; border-radius:50%; background:#1e2826; box-shadow:0 0 0 1px #2b3431;}   /* caméra */
  .screen{
    height:100%; border-radius:18px; overflow:hidden; display:flex; flex-direction:column; color:var(--ink);
    background:radial-gradient(circle at 0% 0%, #e2efe9 0, transparent 45%), radial-gradient(circle at 100% 100%, #f5ecd9 0, transparent 50%), var(--scr);
  }
  .status{display:flex; justify-content:space-between; align-items:center; padding:7px 20px 0; font-size:.78rem; font-weight:800; color:#2b3733; flex:0 0 auto;}
  .status svg{height:11px; width:auto; margin-left:6px; vertical-align:middle;}

  /* en-tête : titre + recherche */
  .head{display:flex; align-items:center; gap:16px; padding:10px 24px 8px; flex:0 0 auto; flex-wrap:wrap;}
  .head h1{font-family:'Kalam',cursive; font-size:1.9rem; line-height:1; margin:0;}
  .head .count{font-size:.85rem; color:var(--mut); font-weight:700;}
  .search{margin-left:auto; position:relative; flex:0 1 340px; min-width:200px;}
  .search input{width:100%; font:inherit; font-size:.95rem; padding:9px 34px 9px 38px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .search input:focus{outline:2px solid var(--hi); outline-offset:0; border-color:transparent;}
  .search .ico{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none;}
  .search .clear{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:#e8ece9; border-radius:50%; width:24px; height:24px; cursor:pointer; color:var(--mut); display:none;}
  .search.has .clear{display:block;}
  .search kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font:inherit; font-size:.72rem; color:var(--mut); border:1px solid var(--line); border-radius:5px; padding:0 5px;}
  .search.has kbd{display:none;}

  /* onglets : Toutes + une par catégorie */
  .tabs{display:flex; flex-wrap:wrap; gap:8px; padding:4px 24px 10px; overflow-x:auto; flex:0 0 auto; scrollbar-width:none; border-bottom:1px solid var(--line);}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; display:flex; align-items:center; gap:7px; cursor:pointer; font:inherit; font-size:.9rem; font-weight:800;
    color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:999px; padding:6px 14px;
  }
  .tab:hover{border-color:var(--c, var(--hi));}
  .tab[aria-selected="true"]{background:var(--c, var(--hi)); border-color:var(--c, var(--hi)); color:#fff;}
  .tab .n{font-size:.72rem; font-weight:900; background:rgba(0,0,0,.08); border-radius:999px; padding:1px 7px;}
  .tab[aria-selected="true"] .n{background:rgba(255,255,255,.25);}
  .tab:focus-visible{outline:2px solid var(--hi); outline-offset:2px;}

  /* contenu */
  .content{flex:1; min-height:0; overflow-y:auto; padding:14px 24px 26px; scroll-behavior:smooth;}
  .content.swap{animation:swap .3s ease-out;}
  @keyframes swap{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .group{margin-bottom:18px;}
  .group h2{display:flex; align-items:center; gap:8px; font-size:.82rem; font-weight:900; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); margin:2px 0 10px;}
  .group h2 .more{margin-left:auto; font:inherit; font-size:.78rem; letter-spacing:0; text-transform:none; color:var(--hi); background:none; border:0; cursor:pointer;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px;}
  .app{
    display:grid; grid-template-columns:auto 1fr auto; gap:3px 12px; align-items:center; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px;
    box-shadow:0 1px 2px rgba(0,0,0,.04); transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .app:hover, .app:focus-visible{transform:translateY(-2px); box-shadow:0 8px 20px rgba(20,40,30,.12); border-color:var(--c); outline:none;}
  .icon{grid-row:1 / 3; width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:1.65rem;
        background:linear-gradient(145deg, var(--c), var(--c2)); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 3px 8px rgba(0,0,0,.15);}
  .app .name{font-weight:800; font-size:.98rem; line-height:1.2; align-self:end;}
  .app .desc{grid-column:2 / 4; font-size:.83rem; line-height:1.35; color:var(--mut); align-self:start;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .app .go{align-self:end; font-size:.9rem; color:var(--mut); opacity:0; transition:opacity .15s;}
  .app:hover .go{opacity:1; color:var(--c);}
  .app .cat{grid-column:2 / 4; font-size:.7rem; font-weight:800; color:var(--c); letter-spacing:.04em;}
  mark{background:#ffe58a; color:inherit; border-radius:3px; padding:0 1px;}
  .empty{text-align:center; color:var(--mut); padding:40px 10px; font-size:1rem;}
  .homebar{width:140px; height:5px; border-radius:3px; background:rgba(0,0,0,.25); margin:6px auto 7px; flex:0 0 auto;}

  /* ===== Petit écran : on est déjà sur une tablette ou un téléphone, pas de cadre ===== */
  @media (min-width:700px) and (orientation:portrait){
    .tablet{width:min(calc(100vw - 32px), calc((100dvh - 64px) * .75)); aspect-ratio:3/4;}
    .grid{grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));}
  }
  @media (max-width:699px){
    .tabs{flex-wrap:nowrap;}
    .group h2 .more{display:none;}
    body{padding-top:62px;}
    .back{position:absolute; top:24px; right:16px; padding:0;}
    .stage{display:block;}
    .tablet{width:100%; aspect-ratio:auto; padding:0; background:none; box-shadow:none; border-radius:0;}
    .tablet::before, .status, .homebar{display:none;}
    .screen{border-radius:18px; height:auto; overflow:visible;}
    .content{overflow:visible; padding:12px 14px 18px;}
    .head{padding:14px 14px 6px;} .tabs{padding:4px 14px 10px;}
    .search{flex-basis:100%; margin-left:0;}
    .grid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion: reduce){ .content.swap{animation:none;} .app{transition:none;} }
</style>
</head>
<body>
  <a class="site-logo" href="index.html"><img src="logo-blanc.png" alt="Atelier Chalou"></a>
  <a class="back" href="index.html">← Retour à l'accueil</a>

  <div class="stage">
    <div class="tablet">
      <div class="screen">
        <div class="status" aria-hidden="true">
          <span id="clock">9:41</span>
          <span>
            <svg viewBox="0 0 16 12"><path d="M8 11.5 L5.6 8.6 A3.6 3.6 0 0 1 10.4 8.6 Z M2.6 5.8 A7.7 7.7 0 0 1 13.4 5.8 L11.9 7.4 A5.6 5.6 0 0 0 4.1 7.4 Z M0 3 A11.6 11.6 0 0 1 16 3 L14.5 4.6 A9.5 9.5 0 0 0 1.5 4.6 Z" fill="#2b3733"/></svg>
            <svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#2b3733" opacity=".6"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#2b3733"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="#2b3733" opacity=".6"/></svg>
          </span>
        </div>
        <div class="head">
          <h1>🧩 Mes applis</h1>
          <span class="count" id="total"></span>
          <label class="search" id="searchBox">
            <span class="ico" aria-hidden="true">🔍</span>
            <input id="q" type="text" placeholder="Rechercher une appli…" autocomplete="off" aria-label="Rechercher une appli">
            <kbd aria-hidden="true">/</kbd>
            <button class="clear" id="clear" type="button" aria-label="Effacer la recherche">✕</button>
          </label>
        </div>
        <div class="tabs" role="tablist" aria-label="Catégories" id="tabs"></div>
        <div class="content" id="content" role="tabpanel" aria-live="polite"></div>
        <div class="homebar" aria-hidden="true"></div>
      </div>
    </div>
  </div>

<script>
/* ===== Les applis, rangées par catégorie (pour en ajouter une : une ligne dans la bonne catégorie) ===== */
var CATS = [
 {
  "name": "Les outils du prof",
  "apps": [
   {
    "href": "ardoise-du-prof.html",
    "ico": "🖍️",
    "name": "Ardoise du Prof",
    "desc": "Consignes au tableau, minuteur, tour de rôle, diffusion en direct."
   },
   {
    "href": "tableau-classe-standalone.html",
    "ico": "📋",
    "name": "Tableau de classe",
    "desc": "Diffusion en direct vers les téléphones des élèves."
   }
  ],
  "ico": "🧑‍🏫",
  "c1": "#2f7d6b",
  "c2": "#1d4f45"
 },
 {
  "name": "Vidéo et image",
  "apps": [
   {
    "href": "editeur-video.html",
    "ico": "🎬",
    "name": "Éditeur vidéo",
    "desc": "Montage et retouche vidéo directement dans le navigateur."
   },
   {
    "href": "stop-motion-studio.html",
    "ico": "🎞️",
    "name": "Stop-Motion Studio",
    "desc": "Créer un film d'animation image par image, caméra ou photos importées."
   },
   {
    "href": "atelier-teintes.html",
    "ico": "🎨",
    "name": "Atelier Teintes",
    "desc": "Explorer et composer des palettes de couleurs."
   },
   {
    "href": "modeleur-volumique.html",
    "ico": "🧊",
    "name": "Modeleur Volumique",
    "desc": "Créer et manipuler des formes en volume."
   },
   {
    "href": "realise-ton-scenario.html",
    "ico": "🎥",
    "name": "Réalise ton scénario",
    "desc": "Écrire et mettre en scène un scénario, étape par étape."
   },
   {
    "href": "photo-co.html",
    "ico": "🧭",
    "name": "Photo CO",
    "desc": "Course d'orientation photo : rejoindre des objectifs, les prendre en photo, puis revoir son parcours sur la carte."
   }
  ],
  "ico": "🎬",
  "c1": "#8a4fd1",
  "c2": "#4a2a7a"
 },
 {
  "name": "Animations interactives",
  "apps": [
   {
    "href": "banc-optique.html",
    "ico": "🔭",
    "name": "Banc optique",
    "desc": "Simulateur interactif de trajet de la lumière et des lentilles."
   },
   {
    "href": "comment-apprend-une-ia.html",
    "ico": "🐱",
    "name": "Comment apprend une IA",
    "desc": "Un réseau de neurones qui apprend, étape par étape, sous vos yeux."
   },
   {
    "href": "atelier-reseau.html",
    "ico": "🕸️",
    "name": "Atelier Réseau",
    "desc": "Explorer et construire un réseau de manière interactive."
   },
   {
    "href": "chaines-information-energie.html",
    "ico": "⚙️",
    "name": "Chaînes d'information et d'énergie",
    "desc": "Explorer les chaînes d'information et d'énergie de 4 objets techniques."
   },
   {
    "href": "soufflerie.html",
    "ico": "💨",
    "name": "Soufflerie 2D",
    "desc": "Simulateur aérodynamique : tester la forme d'un objet dans un flux d'air."
   }
  ],
  "ico": "✨",
  "c1": "#2f6fed",
  "c2": "#1f3f8a"
 },
 {
  "name": "Organigrammes",
  "apps": [
   {
    "href": "ecluse.html",
    "ico": "🚢",
    "name": "L'écluse",
    "desc": "Faire passer un bateau : vannes, portes et feux."
   },
   {
    "href": "organigramme-ascenseur.html",
    "ico": "🛗",
    "name": "L'ascenseur",
    "desc": "Appeler la cabine et la faire descendre au RDC."
   },
   {
    "href": "organigramme-eclairage.html",
    "ico": "💡",
    "name": "L'éclairage automatique",
    "desc": "Allumer un couloir quand il fait sombre."
   },
   {
    "href": "organigramme-trottinette.html",
    "ico": "🛴",
    "name": "La trottinette partagée",
    "desc": "Déverrouiller puis emprunter une trottinette."
   }
  ],
  "ico": "🔀",
  "c1": "#0f8a8a",
  "c2": "#0a4f55"
 },
 {
  "name": "Vie de classe",
  "apps": [
   {
    "href": "type-de-memoire.html",
    "ico": "🧠",
    "name": "Quel type de mémoire ?",
    "desc": "Découvrir comment on mémorise le mieux, avec questions et petits jeux."
   },
   {
    "href": "forces-de-caractere.html",
    "ico": "🌟",
    "name": "Les 24 forces de caractère",
    "desc": "Découvrir ses forces principales et comment les utiliser au quotidien."
   },
   {
    "href": "grammaire-5eme.html",
    "ico": "🗡️",
    "name": "La Quête des Mots",
    "desc": "Réviser la grammaire de 5ème sous forme de quête, niveau par niveau."
   }
  ],
  "ico": "🏫",
  "c1": "#d9822b",
  "c2": "#7a4417"
 },
 {
  "name": "Outils divers",
  "apps": [
   {
    "href": "generateur-qr.html",
    "ico": "🔳",
    "name": "Atelier QR",
    "desc": "Générer un QR code à partir d'une adresse, personnaliser son rendu et le télécharger."
   }
  ],
  "ico": "🧰",
  "c1": "#6b7a8f",
  "c2": "#39424f"
 }
];

(function(){
  var tabs = document.getElementById('tabs'), content = document.getElementById('content'), q = document.getElementById('q');
  var cur = -1;                                                     // -1 = toutes les catégories
  var total = CATS.reduce(function(n, c){ return n + c.apps.length; }, 0);
  document.getElementById('total').textContent = total + ' applis';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function hl(text, term){                                          // surligne le mot cherché
    if (!term) return esc(text);
    var n = norm(text), i = n.indexOf(term);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  }
  function card(a, c, term, showCat){
    return '<a class="app" href="' + a.href + '" target="_blank" rel="noopener" style="--c:' + c.c1 + ';--c2:' + c.c2 + '">' +
      '<span class="icon" aria-hidden="true">' + a.ico + '</span><span class="name">' + hl(a.name, term) + '</span><span class="go" aria-hidden="true">↗</span>' +
      '<span class="desc">' + hl(a.desc, term) + '</span>' + (showCat ? '<span class="cat">' + c.ico + ' ' + esc(c.name) + '</span>' : '') + '</a>';
  }

  /* onglets */
  var defs = [{name:'Toutes', ico:'⭐', n:total, c:'#1f6f5c'}].concat(CATS.map(function(c){ return {name:c.name, ico:c.ico, n:c.apps.length, c:c.c1}; }));
  defs.forEach(function(d, k){
    var b = document.createElement('button');
    b.className = 'tab'; b.setAttribute('role', 'tab'); b.id = 'tab' + (k - 1); b.style.setProperty('--c', d.c);
    b.innerHTML = '<span aria-hidden="true">' + d.ico + '</span>' + esc(d.name) + '<span class="n">' + d.n + '</span>';
    b.addEventListener('click', function(){ q.value = ''; syncSearch(); show(k - 1); });
    tabs.appendChild(b);
  });

  function render(){
    var term = norm(q.value.trim()), html = '';
    if (term) {                                                     // recherche dans toutes les catégories
      var hits = [];
      CATS.forEach(function(c){ c.apps.forEach(function(a){ if (norm(a.name + ' ' + a.desc).indexOf(term) >= 0) hits.push(card(a, c, term, true)); }); });
      html = hits.length ? '<div class="group"><h2>' + hits.length + ' résultat' + (hits.length > 1 ? 's' : '') + '</h2><div class="grid">' + hits.join('') + '</div></div>'
                         : '<p class="empty">Aucune appli ne correspond à « ' + esc(q.value.trim()) + ' ».</p>';
    } else if (cur < 0) {                                           // toutes, rangées par catégorie
      html = CATS.map(function(c, i){
        return '<section class="group"><h2><span aria-hidden="true">' + c.ico + '</span>' + esc(c.name) + ' · ' + c.apps.length +
          '<button class="more" data-cat="' + i + '">Voir seulement cette catégorie →</button></h2><div class="grid">' +
          c.apps.map(function(a){ return card(a, c, '', false); }).join('') + '</div></section>';
      }).join('');
    } else {
      var c = CATS[cur];
      html = '<div class="grid">' + c.apps.map(function(a){ return card(a, c, '', false); }).join('') + '</div>';
    }
    content.innerHTML = html;
    content.querySelectorAll('[data-cat]').forEach(function(b){ b.addEventListener('click', function(){ show(+b.dataset.cat); }); });
    content.classList.remove('swap'); void content.offsetWidth; content.classList.add('swap');
    content.scrollTop = 0;
  }
  function show(i){
    cur = i;
    tabs.querySelectorAll('.tab').forEach(function(t, k){ var on = !q.value.trim() && (k - 1) === i; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = (k - 1) === i ? 0 : -1; });
    var t = document.getElementById('tab' + i); if (t) t.scrollIntoView({block:'nearest', inline:'nearest'});
    render();
  }
  function syncSearch(){ document.getElementById('searchBox').classList.toggle('has', !!q.value); }
  q.addEventListener('input', function(){ syncSearch(); show(cur); });
  document.getElementById('clear').addEventListener('click', function(e){ e.preventDefault(); q.value = ''; syncSearch(); show(cur); q.focus(); });
  document.addEventListener('keydown', function(e){
    var inInput = e.target === q;
    if (e.key === '/' && !inInput) { e.preventDefault(); q.focus(); return; }
    if (e.key === 'Escape' && inInput) { q.value = ''; syncSearch(); show(cur); q.blur(); return; }
    if (inInput) return;
    if (e.key === 'ArrowRight') show(cur + 1 < CATS.length ? cur + 1 : -1);
    if (e.key === 'ArrowLeft') show(cur - 1 >= -1 ? cur - 1 : CATS.length - 1);
  });
  function tick(){ var d = new Date(); document.getElementById('clock').textContent = d.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'}) + ' · ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
  tick(); setInterval(tick, 20000);
  show(-1);
})();
</script>
</body>
</html>
