<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<title>Photo-O</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Mise en page : un seul écran mobile à la fois (départ, course, résultat), esthétique carte d'orientation : papier clair, tracé magenta, cercles de poste numérotés. */
:root{
  --paper:#f5f4ea;
  --card:#fffef8;
  --ink:#1c2a23;
  --muted:#5b6a61;
  --line:#d8dbc9;
  --course:#c1147a;
  --course-ink:#ffffff;
  --forest:#2c6e4b;
  --warn:#a5480b;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121815;--card:#1a221e;--ink:#e9eee7;--muted:#9aa89f;--line:#2b372f;
    --course:#ff5db4;--course-ink:#1a0a13;--forest:#7ccb9c;--warn:#f0a066;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121815;--card:#1a221e;--ink:#e9eee7;--muted:#9aa89f;--line:#2b372f;
  --course:#ff5db4;--course-ink:#1a0a13;--forest:#7ccb9c;--warn:#f0a066;
  color-scheme:dark;
}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:34rem;margin-inline:auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:2.2rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand svg{width:34px;height:34px;flex:none}
.lead{color:var(--muted);max-width:60ch}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;width:100%;min-width:0}
textarea{line-height:1.5;resize:vertical}
input[type=text]:focus-visible,input[type=number]:focus-visible,textarea:focus-visible,.btn:focus-visible,.card:focus-visible,summary:focus-visible,label.btn:focus-within{outline:3px solid var(--course);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:6px;border:2px solid var(--course);font:700 1.05rem var(--f-body);letter-spacing:.01em;cursor:pointer;position:relative;text-align:center}
.btn.main{background:var(--course);color:var(--course-ink)}
.btn.ghost{background:transparent;color:var(--course)}
.btn.quiet{border-color:var(--line);color:var(--ink);background:var(--card)}
.btn.small{min-height:44px;font-size:.95rem}
.sr{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
details{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
details .in{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.hint{font-size:.9rem;color:var(--muted)}
.tag{font:600 .75rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* Course en cours */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--paper);padding-block:10px;border-bottom:2px solid var(--course)}
.who{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.1;overflow-wrap:anywhere}
.prog{font-size:.9rem;color:var(--muted)}
.chrono{font:600 1.9rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--course)}
.gps{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
.gps::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.gps[data-state=on]::before{background:var(--forest)}
.gps[data-state=off]::before{background:var(--warn)}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.obj{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.no{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--course);color:var(--course);display:grid;place-items:center;font:700 .95rem var(--f-mono)}
.obj.done .no{background:var(--course);color:var(--course-ink)}
.obj .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.obj .txt{font-weight:600;font-size:1.08rem;overflow-wrap:anywhere}
.thumb{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--line)}
.finish{display:flex;flex-direction:column;gap:10px}
.confirm{background:var(--card);border:1.5px solid var(--warn);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* Résultat */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:2px solid var(--ink)}
.stats div{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.stats div+div{border-left:1px solid var(--line)}
.stats .v{font:600 1.35rem var(--f-mono);font-variant-numeric:tabular-nums}
.mapsvg{display:block;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:6px}
.mapsvg .grid line{stroke:var(--line);stroke-width:1}
.mapsvg .route{fill:none;stroke:var(--course);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.mapsvg .route.leg{stroke-dasharray:6 6;stroke-width:2}
.mapsvg .mk{cursor:pointer}
.mapsvg .mk:focus-visible .ring{stroke-width:4}
.mapsvg .ring{fill:var(--card);fill-opacity:.9;stroke:var(--course);stroke-width:2.5}
.mapsvg .mk text{font:700 12px var(--f-mono);fill:var(--course);text-anchor:middle;pointer-events:none}
.mapsvg .mk.on .ring{fill:var(--course)}
.mapsvg .mk.on text{fill:var(--course-ink)}
.mapsvg .hit{fill:transparent}
.mapsvg .start,.mapsvg .fin{fill:none;stroke:var(--course);stroke-width:2.5}
.mapsvg .sb line{stroke:var(--ink);stroke-width:2}
.mapsvg .sb text,.mapsvg .nt text{font:11px var(--f-mono);fill:var(--muted)}
.mapsvg .nt path{fill:var(--ink)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:18px;color:var(--muted)}
.legend{font-size:.85rem;color:var(--muted)}
.detail{display:flex;flex-direction:column;gap:8px}
.detail img{width:100%;max-width:100%;border-radius:6px;background:var(--line)}
.detail h3,.sec{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.02em}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;background:var(--card);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;font:inherit;color:inherit}
.card.on{border-color:var(--course)}
.card img,.card .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:grid;place-items:center;background:var(--line);color:var(--muted);font-size:.85rem}
.card .meta{display:flex;align-items:center;gap:8px;padding:8px;min-width:0}
.card .no{width:26px;height:26px;font-size:.75rem;border-width:2px}
.card .lbl{flex:1;min-width:0;font-size:.85rem;line-height:1.25;overflow-wrap:anywhere}
.card .t{font:600 .78rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.cam{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cam .top{margin:0;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));font-weight:600}
.cam .ctrl{display:flex;flex-direction:column;gap:10px;padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#000}
.cam .camMsg{margin:0;font-size:.95rem}
.cam .camMsg:empty{display:none}
input[type=number]{-moz-appearance:textfield}
.err{margin:0;color:var(--warn);font-weight:600}
.err:empty{display:none}
#lmap{position:relative;z-index:0;height:min(70vh,440px);min-height:300px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.lmk span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #c1147a;color:#c1147a;font:700 13px "IBM Plex Mono",ui-monospace,monospace;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lmk.on span{background:#c1147a;color:#fff}
.stulist{display:flex;flex-direction:column;gap:12px}
fieldset.stu{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:6px 14px 14px;margin:0;min-width:0;display:flex;flex-direction:column;gap:10px}
fieldset.stu legend{font:700 1.2rem var(--f-display);letter-spacing:.03em;padding-inline:6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stuFoot{display:flex;gap:10px;align-items:flex-end}
.stuFoot .field{flex:1;min-width:0}
label.field.sm{font-size:.9rem}
.stu input[type=text]{padding:10px 12px}
.roster{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:.95rem}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .08s}.btn:active{transform:translateY(1px)}}
</style>

<style>body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
(function(){
'use strict';

var KEY_RUN='photoo.course';

function load(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

var run=load(KEY_RUN,null);
var photoErr=null, saveErr=false;
var sel=null, busy=null, confirming=null, tick=null, lastView=null;
var gpsState='wait', lastFix=null, watchId=null, wake=null, pt=null;

var $=function(s){return document.querySelector(s)};
function h(tag,attrs){
  var e=document.createElement(tag); attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(k==='class') e.className=v;
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null) e.setAttribute(k,v===true?'':v);
  });
  for(var i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(function(c){ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(c)); });
  }
  return e;
}
function fmt(ms){
  var s=Math.max(0,Math.floor(ms/1000)),hh=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
  var p=function(n){return String(n).padStart(2,'0')};
  return hh?hh+':'+p(m)+':'+p(r):p(m)+':'+p(r);
}
function dist(a,b){
  var R=6371000,rad=Math.PI/180,dLa=(b.lat-a.lat)*rad,dLo=(b.lon-a.lon)*rad;
  var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function fmtDist(d){return d<1000?Math.round(d)+' m':(d/1000).toFixed(2).replace('.',',')+' km'}
function persist(now){
  clearTimeout(pt);
  if(now) saveErr=!save(KEY_RUN,run); else pt=setTimeout(function(){saveErr=!save(KEY_RUN,run)},3000);
}

/* ---------- GPS (si l'appareil l'autorise) ---------- */
function gpsLabel(){
  if(gpsState==='on') return 'GPS actif'+(lastFix?' · ± '+Math.round(lastFix.acc)+' m':'');
  if(gpsState==='off') return "GPS indisponible. La position sera lue dans les photos.";
  return 'Recherche du GPS…';
}
function paintGps(){var g=$('#gps'); if(g){g.textContent=gpsLabel(); g.setAttribute('data-state',gpsState)}}
function startGps(){
  if(watchId!==null) return;
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){wake=l}).catch(function(){}); }catch(e){}
  if(!('geolocation' in navigator)){gpsState='off';paintGps();return}
  try{
    watchId=navigator.geolocation.watchPosition(function(p){
      lastFix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};
      gpsState='on';
      var last=run.track[run.track.length-1];
      if(!last||dist(last,lastFix)>4){run.track.push({t:lastFix.t,lat:lastFix.lat,lon:lastFix.lon});persist()}
      paintGps();
    },function(){gpsState='off';paintGps()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }catch(e){gpsState='off'}
}
function stopGps(){
  try{if(watchId!==null) navigator.geolocation.clearWatch(watchId)}catch(e){}
  watchId=null;
  try{if(wake) wake.release()}catch(e){}
  wake=null;
}

/* ---------- Lecture de la position dans l'EXIF d'une photo JPEG ---------- */
function exifGps(buf){
  var v=new DataView(buf); if(v.byteLength<12||v.getUint16(0)!==0xFFD8) return null;
  var o=2;
  while(o+4<v.byteLength){
    var m=v.getUint16(o), len=v.getUint16(o+2);
    if(m===0xFFE1&&v.getUint32(o+4)===0x45786966) return readTiff(v,o+10);
    if((m&0xFF00)!==0xFF00||m===0xFFDA) break;
    o+=2+len;
  }
  return null;
}
function readTiff(v,t){
  var le=v.getUint16(t)===0x4949;
  var u16=function(p){return v.getUint16(p,le)}, u32=function(p){return v.getUint32(p,le)};
  var ifd=function(off){var n=u16(off),out={};for(var k=0;k<n;k++){var e=off+2+k*12;out[u16(e)]=e}return out};
  var i0=ifd(t+u32(t+4)); if(!i0[0x8825]) return null;
  var g=ifd(t+u32(i0[0x8825]+8)); if(!g[2]||!g[4]) return null;
  var rat=function(e){var p=t+u32(e+8),s=0;for(var k=0;k<3;k++){var d=u32(p+k*8+4);s+=(d?u32(p+k*8)/d:0)/Math.pow(60,k)}return s};
  var lat=rat(g[2]), lon=rat(g[4]);
  if(g[1]&&String.fromCharCode(v.getUint8(g[1]+8))==='S') lat=-lat;
  if(g[3]&&String.fromCharCode(v.getUint8(g[3]+8))==='W') lon=-lon;
  if(!lat&&!lon) return null;
  return {lat:lat,lon:lon};
}
function shrink(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      var s=Math.min(1,800/Math.max(im.naturalWidth,im.naturalHeight));
      var c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*s); c.height=Math.round(im.naturalHeight*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.7));
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('image'))};
    im.src=u;
  });
}
function onPhoto(i,file){
  busy=i; render();
  var exif=null;
  file.arrayBuffer().then(function(b){try{exif=exifGps(b)}catch(e){}}).catch(function(){})
  .then(function(){return shrink(file)})
  .then(function(img){
    var fix=exif||(lastFix&&Date.now()-lastFix.t<60000?{lat:lastFix.lat,lon:lastFix.lon}:null);
    run.shots[i]={t:Date.now(),lat:fix?fix.lat:null,lon:fix?fix.lon:null,src:exif?'photo':(fix?'gps':null),img:img};
    busy=null; photoErr=null; persist(true); render();
  }).catch(function(){busy=null;photoErr="La photo n'a pas pu être traitée (format ou mémoire de l'appareil). Réessaie avec « Refaire la photo ».";render()});
}


/* ---------- Caméra intégrée : la page reste ouverte pendant la prise de vue ---------- */
var camStream=null;
function closeCam(){
  if(camStream){camStream.getTracks().forEach(function(t){t.stop()});camStream=null}
  var c=$('#cam'); if(c) c.remove();
}
function openCam(i){
  closeCam();
  var msg=h('p',{class:'camMsg'},'');
  var video=h('video',{playsinline:true,autoplay:true});
  video.muted=true;
  var shoot=h('button',{class:'btn main',type:'button',disabled:true},'Prendre la photo');
  var cancel=h('button',{class:'btn quiet',type:'button',onclick:closeCam},'Annuler');
  var ctrl=h('div',{class:'ctrl'},msg,shoot,cancel);
  var overlay=h('div',{class:'cam',id:'cam'},h('p',{class:'top'},run.obj[i]),video,ctrl);
  shoot.addEventListener('click',function(){
    if(!video.videoWidth) return;
    var k=Math.min(1,800/Math.max(video.videoWidth,video.videoHeight));
    var c=document.createElement('canvas'); c.width=Math.round(video.videoWidth*k); c.height=Math.round(video.videoHeight*k);
    c.getContext('2d').drawImage(video,0,0,c.width,c.height);
    var img=c.toDataURL('image/jpeg',.7);
    var fix=lastFix&&Date.now()-lastFix.t<120000?lastFix:null;
    run.shots[i]={t:Date.now(),lat:fix?fix.lat:null,lon:fix?fix.lon:null,src:fix?'gps':null,img:img};
    closeCam(); photoErr=null; persist(true); render();
  });
  var fallback=function(){
    shoot.hidden=true; video.hidden=true;
    msg.textContent="La caméra intégrée n'est pas disponible. Utilise l'appareil photo du téléphone :";
    ctrl.insertBefore(h('label',{class:'btn main'},"Ouvrir l'appareil photo",
      h('input',{type:'file',accept:'image/*',capture:'environment',class:'sr',onchange:function(e){var f=e.target.files[0];if(f){closeCam();onPhoto(i,f)}}})),cancel);
  };
  document.body.append(overlay);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fallback();return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}).then(function(st){
    if(!$('#cam')){st.getTracks().forEach(function(t){t.stop()});return}
    camStream=st; video.srcObject=st;
    var p=video.play(); if(p&&p.catch) p.catch(function(){});
    shoot.disabled=false;
  }).catch(fallback);
}

/* ---------- Vues ---------- */
function brand(){
  return h('h1',{class:'brand'},
    (function(){var d=document.createElement('div');d.innerHTML='<svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="13" fill="none" stroke="var(--course)" stroke-width="3"/><circle cx="17" cy="17" r="2.5" fill="var(--course)"/></svg>';return d.firstChild})(),
    'Photo-O');
}
var setupData={team:'',count:'',students:[{},{},{}]};
function readSetup(){
  var g=function(id){var e=$('#'+id);return e?e.value:''};
  setupData.team=g('name'); setupData.count=g('count');
  setupData.students=setupData.students.map(function(_,i){return {nom:g('s-nom-'+i),prenom:g('s-pre-'+i),classe:g('s-cla-'+i)}});
}
function addStudent(){
  readSetup(); setupData.students.push({}); render();
  var e=$('#s-pre-'+(setupData.students.length-1)); if(e) e.focus();
}
function removeStudent(i){readSetup(); setupData.students.splice(i,1); render()}
function setupErr(msg,focusId){
  var e=$('#err'); if(e) e.textContent=msg;
  var f=focusId&&$('#'+focusId); if(f) f.focus();
}
function studentRow(st,i){
  var f=function(id,label,val){
    return h('label',{class:'field sm',for:id},label,h('input',{type:'text',id:id,autocomplete:'off',value:val||''}));
  };
  return h('fieldset',{class:'stu'},
    h('legend',{},'Élève '+(i+1)),
    h('div',{class:'g2'},f('s-pre-'+i,'Prénom',st.prenom),f('s-nom-'+i,'Nom',st.nom)),
    h('div',{class:'stuFoot'},f('s-cla-'+i,'Classe',st.classe),
      setupData.students.length>1?h('button',{class:'btn quiet small',type:'button',onclick:function(){removeStudent(i)}},'Retirer'):null));
}
function setupView(){
  return h('div',{class:'wrap',style:'padding:0'},
    brand(),
    h('p',{class:'lead'},"Rejoins chaque objectif, prends-le en photo, puis retrouve ton parcours sur la carte."),
    h('div',{class:'stulist'},
      setupData.students.map(studentRow),
      h('button',{class:'btn ghost',type:'button',onclick:addStudent},'+ Ajouter un élève')),
    h('label',{class:'field',for:'name'},"Nom de l'équipe (facultatif)",
      h('input',{type:'text',id:'name',autocomplete:'off',placeholder:'Ex. Les Renards',value:setupData.team||''})),
    h('label',{class:'field',for:'count'},"Nombre d'objectifs",
      h('input',{type:'number',id:'count',inputmode:'numeric',min:'1',max:'30',placeholder:'Ex. 6',value:setupData.count||''})),
    h('p',{class:'err',id:'err',role:'alert'}),
    h('button',{class:'btn main',type:'button',onclick:startRun},'Départ'),

    T(st[1],px,stTop+85,'600 44px '+MONO,INK);
  });
  /* carte + photos */
  var imgs=[]; for(var i=0;i<n;i++){imgs.push(run.shots[i]?loadImg(run.shots[i].img):Promise.resolve(null))}
  var mapP=drawMap(x,M,mapY,W-2*M,mapH,located(),run.track,noTiles);
  return Promise.all([mapP,Promise.all(imgs)]).then(function(r){
    var photos=r[1];
    x.strokeStyle=LINE; x.lineWidth=2; x.strokeRect(M,mapY,W-2*M,mapH);
    T('Toutes les photos',M,gridTitleY,'700 48px '+DISP,INK);
    run.obj.forEach(function(label,i){
      var sh=run.shots[i], im=photos[i], col=i%cols, row=Math.floor(i/cols);
      var px=M+col*(cw+gap), py=gridY+row*(ch+gap);
      x.fillStyle='#fffef8'; x.fillRect(px,py,cw,ch); x.strokeStyle=LINE; x.lineWidth=2; x.strokeRect(px,py,cw,ch);
      if(im){
        var ar=cw/ih, sw2=im.width, sh2=im.height, sx=0, sy=0;
        if(sw2/sh2>ar){sw2=sh2*ar;sx=(im.width-sw2)/2}else{sh2=sw2/ar;sy=(im.height-sh2)/2}
        x.drawImage(im,sx,sy,sw2,sh2,px,py,cw,ih);
      }else{
        x.fillStyle='#e4e6d8'; x.fillRect(px,py,cw,ih);
        T('Non photographié',px+cw/2,py+ih/2+8,'500 26px '+BODY,MUTED,'center');
      }
      T(label,px+14,py+ih+40,'700 30px '+BODY,INK);
      if(sh){
        T(fmt(sh.t-run.start)+' depuis le départ',px+14,py+ih+76,'500 21px '+MONO,MUTED);
        T(sh.lat!=null?sh.lat.toFixed(5)+', '+sh.lon.toFixed(5):'position inconnue',px+14,py+ih+106,'500 19px '+MONO,MUTED);
      }
    });
    T('Photo-O · résultat de course',W/2,H-28,'500 20px '+MONO,MUTED,'center');
    return new Promise(function(res,rej){
      try{
        c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',0.88);
      }catch(e){rej(e)}
    });
  }).then(function(b){
    var nm=(run.name||'equipe').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'equipe';
    var dt=new Date(run.end), p2=function(v){return String(v).padStart(2,'0')};
    saveBlob(b,'Photo-O_'+nm+'_'+dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate())+'-'+p2(dt.getHours())+p2(dt.getMinutes())+'.jpg');
    setExp("Image enregistrée dans les téléchargements. Si rien ne s'est téléchargé, appuie sur le bouton ci-dessus.");
  }).catch(function(){
    if(!noTiles){exportJpg(true)}
    else setExp("Impossible de créer l'image. Fais une capture d'écran du résultat.");
  });
}

/* ---------- Rendu ---------- */
function render(){
  clearInterval(tick);
  var app=$('#app'), v;
  app.replaceChildren();
  if(!run){v='setup';app.append(setupView())}
  else if(!run.end){v='run';app.append(runView());startGps();tick=setInterval(function(){var c=$('#chrono');if(c&&run)c.textContent=fmt(Date.now()-run.start)},1000)}
  else{v='result';app.append(resultView());paintResult()}
  if(v!==lastView){window.scrollTo(0,0);lastView=v}
}
render();
})();
</script>
</body>
</html>
