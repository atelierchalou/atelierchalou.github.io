<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prothèse Intelligente DNB Techno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

/* Concept : fiche d'épreuve. Panneaux « Document » encadrés comme dans le sujet, bandeau de score collant, une question visible à la fois. */
:root{
  --bg:#EBEFE8; --surface:#F7F9F4; --ink:#14221C; --muted:#52625A; --line:#C6D0C3;
  --accent:#37474F; --accent-ink:#FFFFFF;
  --ok:#1F6B40; --ok-bg:#DCEFE2;
  --warn:#8F4408; --warn-bg:#F8E5D0;
  --ko:#A12A22; --ko-bg:#F6DAD6;
  --pill-bg:#FFFFFF; --pill-ink:#14221C;
  --blk-ev:#8F4A0A; --blk-ctrl:#A5590E; --blk-var:#74451A; --blk-act:#5B4894;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1713; --surface:#16231D; --ink:#E4ECE6; --muted:#9DB0A5; --line:#2B3C33;
    --accent:#B0BEC5; --accent-ink:#0E1713;
    --ok:#7FD3A0; --ok-bg:#163A27; --warn:#F0A868; --warn-bg:#3F290F; --ko:#F29B94; --ko-bg:#47201C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1713; --surface:#16231D; --ink:#E4ECE6; --muted:#9DB0A5; --line:#2B3C33;
  --accent:#B0BEC5; --accent-ink:#0E1713;
  --ok:#7FD3A0; --ok-bg:#163A27; --warn:#F0A868; --warn-bg:#3F290F; --ko:#F29B94; --ko-bg:#47201C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);margin:0}
h1,h2,h3,h4,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:840px;margin-inline:auto;padding-inline:16px}

/* En-tête collant */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1.5px solid var(--ink)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font:700 1.5rem/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.brand small{display:block;color:var(--muted);font-size:.8rem;line-height:1.2}
.score{display:flex;align-items:baseline;gap:4px;font-family:var(--mono);white-space:nowrap}
.score b{font-size:1.7rem;font-weight:600}
.score span{color:var(--muted)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
.pill{flex:1 0 auto;min-width:64px;min-height:44px;display:grid;justify-items:center;align-content:center;gap:1px;padding:4px 12px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;cursor:pointer}
.pill .pl{font:700 1.05rem/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.pill .ps{font:500 .72rem/1 var(--mono);color:var(--muted)}
.pill[aria-current="page"]{background:var(--ink);color:var(--bg)}
.pill[aria-current="page"] .ps{color:inherit}
.pill.complete .ps{color:var(--ok);font-weight:600}
.pill.complete[aria-current="page"] .ps{color:inherit}

main{padding-block:22px 64px}
.qsec{display:grid;gap:18px}
.q-head{display:grid;gap:6px}
.eyebrow{font:500 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q-title{font:700 clamp(2rem,6vw,3rem)/.95 var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.intro{max-width:65ch}
.how{border:1.5px dashed var(--line);border-radius:6px;padding:12px 14px;font-size:.95rem;display:grid;gap:4px;max-width:70ch}
.how b{font-family:var(--mono);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}

/* Documents */
.docs{display:grid;gap:14px}
.doc{border:1.5px solid var(--ink);background:var(--surface);min-width:0}
.doc>header{background:var(--ink);color:var(--bg);padding:6px 12px;font-weight:600;font-size:.95rem}
.doc-body{padding:12px 14px;display:grid;gap:10px;min-width:0}
.doc-body p{max-width:70ch}
.note{font-size:.85rem;color:var(--muted)}
.scroll{overflow-x:auto}
.scroll>svg{display:block;min-width:560px;width:100%;height:auto}
.sk text{fill:var(--ink);font:500 12px var(--body)}
.sk .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.sk .thin{fill:none;stroke:var(--ink);stroke-width:1.2}
.sk .bld{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.sk .ink{fill:var(--ink)}
.sk .win{fill:var(--line);stroke:var(--ink);stroke-width:1.5}
.sk .strip{fill:var(--muted);stroke:var(--ink);stroke-width:1.2}
.sk .mesh{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 3}
.sk .lead{fill:none;stroke:var(--muted);stroke-width:1}
.sk .dim{fill:none;stroke:var(--muted);stroke-width:1}
.sk .dimt{font:500 12px var(--mono)}
.sols{display:flex;flex-wrap:wrap;gap:6px}
.sol{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--bg);padding:3px 8px;border-radius:4px;font-size:.9rem}
.sol b{font:600 .85rem var(--mono);background:var(--ink);color:var(--bg);min-width:1.4em;text-align:center;border-radius:3px}
.ch text{fill:var(--muted);font:11px var(--mono)}
.ch .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.ch .gr{stroke:var(--line);stroke-width:1}
.ch .pl{fill:none;stroke:var(--accent);stroke-width:2}
.ch .dot{fill:var(--accent)}
.ch .cy{fill:var(--ink);font:600 12px var(--mono)}
.ch .hl{display:none}
.ch.show-hl .hl{display:inline}
.ch .hl line{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3}
.ch .hl circle{fill:none;stroke:var(--warn);stroke-width:2.5}
.ch .hl text{fill:var(--warn);font-weight:600;font-size:12px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.node{border:1.5px solid var(--ink);background:var(--bg);padding:6px 10px;border-radius:4px;font-size:.92rem;text-align:center}
.node.sun{border-radius:999px}
.arrow{font-family:var(--mono);color:var(--muted)}
.loads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.loads .node b{display:block;font:600 1rem var(--mono);color:var(--accent)}
.formula{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:1.5px solid var(--ink);padding:10px 12px;background:var(--bg)}
.formula strong{font:600 1.6rem var(--mono)}
.formula ul{margin:0;padding:0;list-style:none;font-size:.9rem;display:grid;gap:2px}
.wrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wrow .scroll{flex:1 1 320px;min-width:0}
.pxw{display:grid;gap:4px;justify-items:center;font:500 .8rem var(--mono);color:var(--muted);width:92px}
.px{width:56px;height:56px;border:4px solid #14221C;display:block}
.wv text{fill:var(--ink);font:500 12px var(--mono)}
.wv .g{stroke:var(--line);stroke-width:1}
.wv .w{fill:none;stroke:var(--accent);stroke-width:3.5}
.wv .d{font-weight:600;font-size:14px}
table.t{border-collapse:collapse;min-width:520px;width:100%;font-family:var(--mono);font-size:.85rem}
table.t th,table.t td{border:1px solid var(--ink);padding:5px 8px;text-align:center}
table.t th{text-align:left;font-family:var(--body);font-weight:600;background:var(--bg)}

/* Parties */
.parts{display:grid;gap:16px}
.part{background:var(--surface);border:1.5px solid var(--ink);border-radius:6px;padding:16px;display:grid;gap:14px;min-width:0}
.part-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tag{font:600 .85rem var(--mono);background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:3px}
.part-head h3{flex:1 1 220px;min-width:0;font:400 1.02rem/1.45 var(--body)}
.part-head h3 b{font-weight:600}
.pts{font:500 .85rem var(--mono);color:var(--muted);white-space:nowrap}
.part-body{display:grid;gap:12px;min-width:0}
.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono)}
.field label{font-family:var(--body)}
.field .u{color:var(--muted)}
input[type=text],select{font:500 1.05rem var(--mono);padding:9px 10px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:4px;min-height:44px}
input[type=text]{width:8rem}
select{width:100%;font-family:var(--body);font-size:1rem}
input:disabled,select:disabled{opacity:1;-webkit-text-fill-color:currentColor;cursor:default}
.is-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.is-ko{border-color:var(--ko)!important;background:var(--ko-bg)!important}
.fix{font:600 .85rem var(--mono);color:var(--ok);background:var(--ok-bg);padding:2px 6px;border-radius:3px}

.choices{display:grid;gap:8px}
.choices.inline{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.choice{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);background:var(--bg);padding:10px 12px;border-radius:4px;cursor:pointer;min-height:44px}
.choice input{margin-top:.28em;accent-color:var(--accent);width:18px;height:18px;flex:none}
.choice:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice.is-right{border-color:var(--ok);background:var(--ok-bg);box-shadow:none}
.choice.is-ok{box-shadow:none}
.choice.is-ko{box-shadow:none}

.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.ex{border:1.5px solid var(--line);background:var(--bg);border-radius:4px;padding:10px 12px;display:grid;gap:8px;align-content:start;min-width:0}
.ex h4{font:600 .98rem/1.3 var(--body)}
.ex h4 span{font-family:var(--mono);background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:3px;margin-right:6px;font-size:.85rem}
.ex p{font-size:.88rem;color:var(--muted)}
.ex.given{border-style:dashed}
.ex.off{opacity:.8}
.ex .given-v{font:600 .95rem var(--mono)}

.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:480px}
.bit{display:grid;gap:2px;justify-items:center;padding:6px 0;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font:600 1.5rem/1.1 var(--mono);border-radius:4px;cursor:pointer;min-height:64px}
.bit .bn{font:500 .7rem var(--mono);color:var(--muted)}
.bit[data-v="1"]{background:var(--accent);color:var(--accent-ink)}
.bit[data-v="1"] .bn{color:inherit}
.bit:disabled{opacity:1;cursor:default}
.bit.is-ok{outline:3px solid var(--ok);outline-offset:1px}
.bit.is-ko{outline:3px solid var(--ko);outline-offset:1px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* Programme */
.prog{display:grid;gap:3px;font-size:.95rem;max-width:620px}
.blk{color:#fff;padding:8px 12px;border-radius:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.blk.ev{background:var(--blk-ev)}.blk.ctrl{background:var(--blk-ctrl)}.blk.var{background:var(--blk-var)}.blk.act{background:var(--blk-act)}
.cwrap{display:grid;gap:3px}
.cwrap>.blk{border-bottom-left-radius:0}
.inner{margin-left:20px;display:grid;gap:3px;border-left:6px solid var(--blk-ctrl);padding-left:6px}
.chip{background:var(--blk-var);border:1px solid rgba(255,255,255,.55);padding:1px 8px;border-radius:4px;font-weight:600}
.blk.var .chip{background:#5A3512}
.blk input{width:5.2rem;min-height:36px;padding:3px 10px;background:var(--pill-bg);color:var(--pill-ink);border:2px solid var(--pill-bg);border-radius:999px;text-align:center;font-size:1rem}
.blk input.is-ok{background:#DCEFE2!important;border-color:#1F6B40!important;color:#14221C}
.blk input.is-ko{background:#F6DAD6!important;border-color:#A12A22!important;color:#14221C}
.blk .fix{background:#fff;color:#1F6B40}

/* Aides + actions */
.aid-list{display:grid;gap:8px}
.aid{background:var(--warn-bg);color:var(--ink);padding:10px 12px;border-radius:4px;display:grid;gap:2px;font-size:.95rem}
.aid b{font:600 .78rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{min-height:44px;padding:8px 16px;border-radius:4px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.aid-btn{border-color:var(--warn);color:var(--warn)}
.btn:hover{filter:brightness(1.06)}
.max{font:500 .82rem var(--mono);color:var(--muted);margin-left:auto}
.warnmsg{color:var(--ko);font-weight:600}
.part.done .actions{display:none}

/* Résultat */
.result{border-radius:6px;padding:14px;display:grid;gap:10px}
.result.ok{background:var(--ok-bg)}.result.partial{background:var(--warn-bg)}.result.ko{background:var(--ko-bg)}
.verdict{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font:700 1.25rem/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.result.ok .badge{color:var(--ok)}.result.partial .badge{color:var(--warn)}.result.ko .badge{color:var(--ko)}
.sline{font:600 1.05rem var(--mono)}
.pen{font-size:.92rem}
.explain{display:grid;gap:6px;min-width:0}
.explain h4{font:600 .78rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.explain p{max-width:68ch}
.answer{font:500 .98rem/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);padding:8px 10px;border-radius:4px;overflow-wrap:anywhere}
.errnote{font-weight:600}
.xl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.xl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.m{font:700 .95rem var(--mono);width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:3px;background:var(--surface)}
.m.ok{color:var(--ok)}.m.ko{color:var(--ko)}.m.pa{color:var(--warn)}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Bilan */
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font:600 clamp(3rem,12vw,5rem)/1 var(--mono)}
.big span{font:500 1.2rem var(--mono);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{border:1.5px solid var(--ink);padding:10px 12px;background:var(--surface);display:grid;gap:2px}
.stat b{font:600 1.5rem var(--mono)}
.stat span{font-size:.85rem;color:var(--muted)}
.brow{display:grid;gap:4px}
.brow-h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.brow-h span:last-child{font-family:var(--mono)}
.bar{display:flex;height:14px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.bar .e{background:var(--ok)}
.bar .l{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rev{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.rev li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:4px;flex-wrap:wrap}
.rev button{min-height:36px;padding:4px 12px}
.keep{margin:0;padding-left:1.2em;display:grid;gap:8px;max-width:68ch}
.sec-h{font:700 1.5rem/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
.block{display:grid;gap:10px}
@media (max-width:480px){
  .formula{grid-template-columns:1fr}
  .part{padding:12px}
  .max{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.sensor{display:grid;place-items:center;text-align:center;border:1.5px solid var(--ink);padding:8px;font:600 .8rem/1.2 var(--mono);width:92px;min-height:56px;background:var(--bg);flex:none}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <svg id="brandIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
        <div><b id="brandName"></b><small id="brandSub"></small></div>
      </div>
      <div class="score" aria-live="polite"><b id="scoreVal">0</b><span id="maxVal">/ 25</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Questions"></nav>
  </div>
</header>
<main class="wrap" id="stage"></main>
<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');
const r2=n=>Math.round(n*100)/100;
const num=s=>{const t=String(s==null?'':s).replace(',','.').replace(/[^0-9.\-]/g,'');if(t===''||t==='.'||t==='-')return NaN;return parseFloat(t)};
const eq=(a,b)=>Math.abs(a-b)<1e-6;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
const mk=(el,ok)=>{el.classList.add(ok?'is-ok':'is-ko')};
const pl=n=>n>1?'pts':'pt';
const val=id=>{const e=$('#p-'+id+' input[type=text]');return e?num(e.value):NaN};

function choices(name,opts,inline,keep){
  const list=keep?opts:shuffle(opts);
  return '<div class="choices'+(inline?' inline':'')+'" role="radiogroup">'+list.map(o=>'<label class="choice"><input type="radio" name="'+name+'" value="'+o[0]+'"><span>'+o[1]+'</span></label>').join('')+'</div>';
}
function sel(root,name){const c=$('input[name="'+name+'"]:checked',root);return c?c.value:null}
function choiceMark(root,name,correct){
  const chosen=sel(root,name);
  $$('.choice',root).forEach(l=>{
    const i=$('input',l);if(i.name!==name)return;
    if(i.value===correct){l.classList.add(chosen===correct?'is-ok':'is-right')}
    else if(i.checked){l.classList.add('is-ko')}
  });
  return chosen;
}
function ex(answer,why,note){
  return (note?'<p class="errnote">'+note+'</p>':'')+'<h4>Réponse attendue</h4><div class="answer">'+answer+'</div><h4>Pourquoi</h4>'+why;
}
function doc(title,body){return '<section class="doc"><header>'+title+'</header><div class="doc-body">'+body+'</div></section>'}
function table(rows){return '<div class="scroll"><table class="t"><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>i===0?'<th>'+c+'</th>':'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function sols(obj){return '<div><p class="note" style="margin-bottom:6px">Solutions techniques à placer :</p><div class="sols">'+Object.keys(obj).map(k=>'<span class="sol"><b>'+k+'</b>'+obj[k]+'</span>').join('')+'</div></div>'}
function formula(title,items){return '<div class="formula"><strong>'+title+'</strong><ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>'}
function loads(items){return '<div class="loads">'+items.map(i=>'<span class="node">'+i[0]+'<b>'+i[1]+'</b></span>').join('')+'</div>'}
const MVT=ok=>[['rot','Une rotation'],['tr','Une translation rectiligne'],['trc','Une translation circulaire'],['no','Aucun mouvement : l’élément reste fixe']].map(o=>[o[0],o[1],o[0]===ok?1:0]);

function wave(bits,show){
  const W=56,x0=46,yH=24,yL=80;
  let s='<svg class="wv" viewBox="0 0 '+(x0+8*W+10)+' 116" role="img" aria-label="Signal logique sur huit bits">';

function chart(s){

  const X=t=>x0+t*(x1-x0)/s.xmax, Y=a=>yb-(a-ymin)*(yb-yt)/(s.ymax-ymin);
  let o='<svg class="ch" id="'+s.id+'" viewBox="0 0 640 276" role="img" aria-label="'+s.aria+'">';
  for(let a=ymin;a<=s.ymax+1e-9;a+=s.ystep){o+='<line class="gr" x1="'+X(0)+'" x2="'+X(s.xmax)+'" y1="'+Y(a)+'" y2="'+Y(a)+'"/><text x="'+(x0-6)+'" y="'+(Y(a)+4)+'" text-anchor="end">'+fmt(a)+'</text>'}
  for(let t=0;t<=s.xmax+1e-9;t+=s.xstep){o+='<text x="'+X(t)+'" y="236" text-anchor="middle">'+fmt(t)+'</text>'}
  o+='<path class="ax" d="M'+X(0)+' '+(yt-10)+' V'+Y(ymin)+' H'+(X(s.xmax)+14)+'"/>';
  (s.series||[]).forEach(se=>{
    o+='<path class="pl" d="'+se.pts.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ')+'"/>';

  (s.labels||[]).forEach(l=>{o+='<text class="cy" x="'+X(l.x)+'" y="'+Y(l.y)+'">'+l.t+'</text>'});
  Object.keys(s.hl||{}).forEach(k=>{
    const h=s.hl[k];o+='<g class="hl hl-'+k+'">';
    h.pts.forEach(p=>{o+='<line x1="'+X(p[0])+'" x2="'+X(p[0])+'" y1="'+Y(p[1])+'" y2="'+Y(ymin)+'"/><line x1="'+X(0)+'" x2="'+X(p[0])+'" y1="'+Y(p[1])+'" y2="'+Y(p[1])+'"/><circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="6"/>'});
    (h.texts||[]).forEach(t=>{o+='<text x="'+(X(t.x)+(t.dx||0))+'" y="'+(Y(t.y)+(t.dy||0))+'"'+(t.a?' text-anchor="'+t.a+'"':'')+'>'+t.t+'</text>'});
    o+='</g>';
  });
  o+='<text x="'+((x0+x1)/2)+'" y="266" text-anchor="middle">'+s.xlabel+'</text><text transform="translate(12 121) rotate(-90)" text-anchor="middle">'+s.ylabel+'</text></svg>';

    check:r=>sel(r,name)?null:'Choisis une proposition avant de valider.',
    grade:r=>{

function numPart(o){

function multiNumPart(o){
  return {id:o.id,tag:o.tag,title:o.title,points:o.points,aides:o.aides,after:o.after,
    body:()=>'<div class="pair">'+o.fields.map(f=>'<div class="field"><label for="in'+o.id+f.k+'">'+f.label+'</label><input id="in'+o.id+f.k+'" data-k="'+f.k+'" type="text" inputmode="decimal" autocomplete="off"><span class="u">'+(f.unit||'')+'</span></div>').join('')+'</div>',
    check:r=>$$('input',r).some(i=>i.value.trim())?null:'Écris au moins une valeur avant de valider.',
    grade:r=>{
      let raw=0;const notes=[];
      o.fields.forEach(f=>{
        const i=$('[data-k="'+f.k+'"]',r),v=num(i.value),ok=eq(v,f.answer);
        if(ok){raw+=f.pts;mk(i,true)}
        else{
          const fo=f.follow?f.follow(v):null;mk(i,false);
          if(fo&&fo.frac>0){raw+=f.pts*fo.frac;notes.push(fo.note)}
          else notes.push((f.notes&&f.notes[String(v)])||f.defaultNote||'');
        }
      });
      return {raw:raw,explain:ex(o.answerText,o.why,notes.filter(Boolean).join(' '))};
    },
    solve:r=>{o.fields.forEach(f=>{$('[data-k="'+f.k+'"]',r).value=String(f.answer)})}};
}
function assocPart(o){
  const opts='<option value="">— choisir —</option>'+Object.keys(o.solutions).map(k=>'<option value="'+k+'">'+k+' · '+o.solutions[k]+'</option>').join('');
  const sels=id=>'<select data-slot="'+id+'" aria-label="Solution technique">'+opts+'</select>';
  return {id:o.id,tag:o.tag,title:o.title,points:o.points,aides:o.aides,
    body:()=>'<div class="exgrid">'+o.cards.map((c,ci)=>{
      let inner='';
      if(c.given)inner+='<div class="given-v">'+c.given+'</div>';
      if(c.slots)inner+=c.slots.map((s,j)=>sels(ci+'-'+j)).join('');
      if(c.off)inner+='<div class="given-v">Pas de case à remplir</div>';
      return '<div class="ex'+(!c.slots&&c.given?' given':'')+(c.off?' off':'')+'"><h4><span>'+c.ex+'</span>'+c.title+'</h4><p>'+c.sub+'</p>'+inner+'</div>';
    }).join('')+'</div>',
    check:r=>$$('select',r).some(s=>s.value)?null:'Choisis au moins une solution avant de valider.',
    grade:r=>{
      let ok=0,total=0;const st={};
      o.cards.forEach((c,ci)=>{
        if(!c.slots)return;
        const chosen=[],flags=[];
        c.slots.forEach((s,j)=>{
          const el=$('select[data-slot="'+ci+'-'+j+'"]',r),v=parseInt(el.value,10)||0;
          const good=s.accept.indexOf(v)>-1&&chosen.indexOf(v)===-1;
          chosen.push(v);flags.push(good);mk(el,good);total++;if(good)ok++;
        });
        st[ci]={chosen:chosen,flags:flags};
      });
      const why='<ul class="xl">'+o.cards.map((c,ci)=>{
        if(!c.slots){return '<li><span class="m ok">'+(c.off?'i':'✓')+'</span><div><b>'+c.label+'</b> '+c.why+'</div></li>'}
        const s=st[ci],n=s.flags.filter(Boolean).length;
        const cls=n===s.flags.length?'ok':(n===0?'ko':'pa'),sym=cls==='ok'?'✓':(cls==='ko'?'✕':'≈');
        const mine=cls==='ok'?'':' <i>Ta réponse : '+s.chosen.map(v=>v||'rien').join(' et ')+'.</i>';
        return '<li><span class="m '+cls+'">'+sym+'</span><div><b>'+c.label+'</b> '+c.why+mine+'</div></li>';
      }).join('')+'</ul>';
      return {raw:o.points*ok/total,explain:ex(o.answerText,why,ok<total?ok+' case'+(ok>1?'s':'')+' correcte'+(ok>1?'s':'')+' sur '+total+'. Chaque case juste vaut '+fmt(o.points/total)+' point.':'')};
    },
    solve:r=>{o.cards.forEach((c,ci)=>{(c.slots||[]).forEach((s,j)=>{$('select[data-slot="'+ci+'-'+j+'"]',r).value=String(s.accept[Math.min(j,s.accept.length-1)])})})}};
}

  return {id:o.id,tag:o.tag,title:o.title,points:o.points,aides:o.aides,
    body:()=>'<div class="prog">'+o.tree.map(render).join('')+'</div>',

      return {raw:o.points*n/keys.length,explain:ex(o.answerText,why,n<keys.length?n+' blanc'+(n>1?'s':'')+' correct'+(n>1?'s':'')+' sur '+keys.length+'. Les bonnes valeurs sont affichées en vert à côté des blancs à corriger.':'')};

}

/* ---------- Application ---------- */
const QS=S.QS,MAX=QS.reduce((s,q)=>s+q.pts,0);
const results={},nav=$('#nav'),stage=$('#stage'),scoreVal=$('#scoreVal');
const partIndex={};QS.forEach((q,qi)=>{q.parts.forEach(p=>{p.q=qi;partIndex[p.id]=p})});
$('#brandName').textContent=S.brand;$('#brandSub').textContent=S.sub;$('#brandIcon').innerHTML=S.icon;
$('#maxVal').textContent='/ '+MAX;

const total=()=>Object.keys(results).reduce((s,k)=>s+results[k].earned,0);
function updatePills(){
  QS.forEach((q,i)=>{
    const done=q.parts.filter(p=>results[p.id]).length,p=nav.children[i];
    p.classList.toggle('complete',done===q.parts.length);
    $('.ps',p).textContent=done===q.parts.length?fmt(q.parts.reduce((s,x)=>s+results[x.id].earned,0))+'/'+q.pts:(done?done+'/'+q.parts.length:'—');
  });
}
function updateScore(){scoreVal.textContent=fmt(total());updatePills()}

function mountPart(def){
  const sec=document.createElement('section');sec.className='part';sec.id='p-'+def.id;
  sec.innerHTML='<div class="part-head"><span class="tag">'+def.tag+'</span><h3>'+def.title+'</h3><span class="pts">'+fmt(def.points)+' '+pl(def.points)+'</span></div>'+
   '<div class="part-body">'+def.body()+'</div><div class="aid-list" aria-live="polite"></div>'+
   '<div class="actions"><button type="button" class="btn aid-btn"></button><button type="button" class="btn primary val">Valider ma réponse</button><span class="max"></span></div>'+
   '<p class="warnmsg" role="alert" hidden></p><div class="result" hidden></div>';
  let used=0;
  const list=$('.aid-list',sec),ab=$('.aid-btn',sec),vb=$('.val',sec),mx=$('.max',sec),wm=$('.warnmsg',sec),res=$('.result',sec);
  const cum=()=>def.aides.slice(0,used).reduce((s,a)=>s+a.cost,0);
  function refresh(){
    const nx=def.aides[used];ab.hidden=!nx;
    if(nx)ab.textContent='Aide '+(used+1)+' · −'+Math.round(nx.cost*100)+' % des points';
    mx.textContent='Maximum possible : '+fmt(def.points*(1-cum()))+' / '+fmt(def.points);
  }
  ab.addEventListener('click',()=>{
    const a=def.aides[used];used++;
    list.insertAdjacentHTML('beforeend','<div class="aid"><b>Aide '+used+' · −'+Math.round(a.cost*100)+' %</b><p>'+a.text+'</p></div>');
    refresh();
  });
  if(def.bind)def.bind(sec);
  vb.addEventListener('click',()=>{
    const err=def.check?def.check(sec):null;
    if(err){wm.textContent=err;wm.hidden=false;return}
    wm.hidden=true;
    const g=def.grade(sec),c=cum(),raw=Math.max(0,Math.min(def.points,g.raw)),earned=r2(raw*(1-c)),lost=r2(raw*c);
    results[def.id]={raw:raw,earned:earned,lost:lost,aides:used,points:def.points};
    $$('input,select,button.bit',$('.part-body',sec)).forEach(e=>{e.disabled=true});
    sec.classList.add('done');
    const ratio=raw/def.points,cls=ratio>=.999?'ok':(ratio<=.001?'ko':'partial');
    const label=cls==='ok'?'✓ Bonne réponse':(cls==='ko'?'✕ Pas cette fois':'≈ En partie juste');
    let pen='';
    if(raw>0&&used>0)pen='Avec '+used+' aide'+(used>1?'s':'')+' (−'+Math.round(c*100)+' %), tes '+fmt(raw)+' '+pl(raw)+' deviennent '+fmt(earned)+' '+pl(earned)+'.';
    else if(raw>0)pen='Aucune aide utilisée : tu gardes tous les points gagnés.';
    else if(used>0)pen='Tu as utilisé '+used+' aide'+(used>1?'s':'')+', mais la réponse ne rapporte pas de point ici.';
    res.className='result '+cls;
    res.innerHTML='<div class="verdict"><span class="badge">'+label+'</span><span class="sline">'+fmt(earned)+' / '+fmt(def.points)+' '+pl(def.points)+'</span></div>'+(pen?'<p class="pen">'+pen+'</p>':'')+'<div class="explain">'+g.explain+'</div>';
    res.hidden=false;
    if(def.after)def.after(sec);
    updateScore();
    res.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
  refresh();
  return sec;
}

function show(i){
  $$('.qsec').forEach((s,k)=>{s.hidden=k!==i});
  $$('.pill').forEach((p,k)=>{p.setAttribute('aria-current',k===i?'page':'false')});
  if(i===QS.length)renderBilan();
  window.scrollTo(0,0);
}
function pill(label,i){
  const b=document.createElement('button');b.type='button';b.className='pill';
  b.innerHTML='<span class="pl">'+label+'</span><span class="ps">—</span>';
  b.addEventListener('click',()=>show(i));nav.appendChild(b);
}
const HOWTO='<div class="how"><b>Comment ça marche</b><span>Réponds, puis valide : l’explication s’affiche toujours, même quand ta réponse est juste. Tu peux demander des aides avant de valider. Elles font avancer mais retirent des points sur la partie : par exemple −20 %, puis −30 %, puis −30 %. Le score en haut se met à jour à chaque validation.</span></div>';

function build(){
  Object.keys(results).forEach(k=>{delete results[k]});
  nav.innerHTML='';stage.innerHTML='';
  QS.forEach((q,i)=>{
    const sec=document.createElement('section');sec.className='qsec';sec.hidden=true;
    sec.innerHTML='<div class="q-head"><p class="eyebrow">Question '+(i+1)+' · '+q.pts+' points</p><h2 class="q-title">'+q.title+'</h2></div>'+(i===0?HOWTO:'')+(q.intro?'<p class="intro">'+q.intro+'</p>':'')+'<div class="docs">'+q.docs()+'</div><div class="parts"></div><div class="qfoot"></div>';
    const parts=$('.parts',sec);q.parts.forEach(p=>{parts.appendChild(mountPart(p))});
    const foot=$('.qfoot',sec);
    const prev=document.createElement('button');prev.type='button';prev.className='btn';prev.textContent=i===0?'':'← Question '+i;prev.hidden=i===0;
    prev.addEventListener('click',()=>show(i-1));
    const next=document.createElement('button');next.type='button';next.className='btn primary';next.textContent=i===QS.length-1?'Voir mon bilan →':'Question '+(i+2)+' →';
    next.addEventListener('click',()=>show(i+1));
    foot.appendChild(prev);foot.appendChild(next);
    stage.appendChild(sec);pill('Q'+(i+1),i);
  });
  const b=document.createElement('section');b.className='qsec';b.hidden=true;b.id='bilan';stage.appendChild(b);pill('Bilan',QS.length);
  show(0);updateScore();
}

function renderBilan(){
  const b=$('#bilan'),tot=total(),all=Object.keys(partIndex),done=all.filter(k=>results[k]).length;
  const lost=all.reduce((s,k)=>s+(results[k]?results[k].lost:0),0);
  const aides=all.reduce((s,k)=>s+(results[k]?results[k].aides:0),0);
  const r=tot/MAX;
  const msg=r>=.88?'Excellent : tu maîtrises presque tout le sujet.':r>=.72?'Très bien : il ne reste que quelques détails à consolider.':r>=.52?'Bon travail : les bases sont là, relis les explications des parties manquées.':r>=.32?'À consolider : reprends les explications et refais les parties où tu as perdu des points.':'À reprendre : relis les explications question par question, puis recommence.';
  let html='<div class="q-head"><p class="eyebrow">Bilan</p><h2 class="q-title">Ton résultat</h2></div>'+
   '<div class="big"><b>'+fmt(tot)+'</b><span>/ '+MAX+' · soit '+fmt(tot/MAX*20)+' / 20</span></div><p>'+(done<all.length?'Il reste '+(all.length-done)+' partie'+(all.length-done>1?'s':'')+' à traiter. ':'')+msg+'</p>'+
   '<div class="stats"><div class="stat"><b>'+done+' / '+all.length+'</b><span>parties validées</span></div><div class="stat"><b>'+aides+'</b><span>aide'+(aides>1?'s':'')+' utilisée'+(aides>1?'s':'')+'</span></div><div class="stat"><b>−'+fmt(lost)+'</b><span>point'+(lost>1?'s':'')+' retiré'+(lost>1?'s':'')+' par les aides</span></div></div>'+
   '<div class="block"><h3 class="sec-h">Détail par question</h3>';
  QS.forEach((q,i)=>{
    let e=0,l=0;q.parts.forEach(p=>{if(results[p.id]){e+=results[p.id].earned;l+=results[p.id].lost}});
    html+='<div class="brow"><div class="brow-h"><span>Question '+(i+1)+' · '+q.title+'</span><span>'+fmt(e)+' / '+q.pts+'</span></div><div class="bar" role="img" aria-label="'+fmt(e)+' points gagnés, '+fmt(l)+' perdus par les aides, sur '+q.pts+'"><i class="e" style="width:'+(e/q.pts*100)+'%"></i><i class="l" style="width:'+(l/q.pts*100)+'%"></i></div></div>';
  });
  html+='<div class="legend"><span><i style="background:var(--ok)"></i>points gagnés</span><span><i style="background:var(--warn)"></i>points retirés par les aides</span><span><i style="background:var(--line)"></i>points non obtenus</span></div></div>';
  const rev=all.filter(k=>!results[k]||results[k].raw<results[k].points-.001);
  html+='<div class="block"><h3 class="sec-h">À revoir</h3>';
  if(!rev.length)html+='<p>Toutes les parties sont réussies sans erreur. Les aides ont seulement coûté des points.</p>';
  else html+='<ul class="rev">'+rev.map(k=>{const p=partIndex[k];return '<li><span><b>'+p.tag+'</b> · '+(results[k]?fmt(results[k].raw)+' / '+fmt(p.points)+' avant aides':'pas encore traitée')+'</span><button type="button" class="btn" data-go="'+k+'">Revoir</button></li>'}).join('')+'</ul>';
  html+='</div><div class="block"><h3 class="sec-h">À retenir</h3><ol class="keep">'+QS.map(q=>'<li>'+q.keep+'</li>').join('')+'</ol></div>'+
   '<div class="qfoot"><button type="button" class="btn" id="back">← Question '+QS.length+'</button><button type="button" class="btn primary" id="reset">Tout recommencer</button></div>';
  b.innerHTML=html;
  $$('[data-go]',b).forEach(btn=>{btn.addEventListener('click',()=>{const p=partIndex[btn.dataset.go];show(p.q);const t=document.getElementById('p-'+p.id);if(t)t.scrollIntoView({block:'start'})})});
  $('#back',b).addEventListener('click',()=>show(QS.length-1));
  const rs=$('#reset',b);let armed=false;
  rs.addEventListener('click',()=>{if(!armed){armed=true;rs.textContent='Confirmer : effacer mes réponses';return}build()});
}

window.__solveAll=()=>{QS.forEach(q=>q.parts.forEach(p=>{const sec=$('#p-'+p.id);p.solve(sec);$('.val',sec).click()}));return total()};
build();

})();
</script>
</body>
</html>
