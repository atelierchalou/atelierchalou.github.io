<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comment apprend un réseau de neurones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12101E; --bg-deep:#0C0A16; --panel:#1C1830; --panel-line: rgba(241,237,251,0.08);
    --text:#F1EDFB; --muted:#A79FC4; --mint:#6EE7B7; --coral:#FB7185; --amber:#FBBF24;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background: radial-gradient(120% 140% at 50% -10%, #201A38 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color:var(--text); font-family:'Inter', sans-serif;
  }

  /* Cadre fixe 1280 x 720, mis à l'échelle pour toujours tenir dans la fenêtre */
  #app{
    position:absolute; left:50%; top:50%;
    width:1280px; height:720px; padding:12px 16px 14px;
    transform: translate(-50%,-50%) scale(var(--s,1)); transform-origin:center center;
    display:flex; flex-direction:column; gap:8px;
  }

  header.top{ flex:none; }
  h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:25px; line-height:1.15;
    margin:0 0 4px; letter-spacing:-0.01em;
  }
  h1 span{ color: var(--mint); }
  .intro{ color: var(--muted); font-size:13.5px; line-height:1.4; margin:0; }

  .stage{
    flex:1; min-height:0;
    background: var(--panel); border:1px solid var(--panel-line); border-radius:16px;
    padding:10px 10px 10px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:6px;
  }
  .stage::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(600px 300px at 15% 0%, rgba(110,231,183,0.06), transparent 60%);
  }

  /* Choix du domaine et de la carte, sur une seule ligne */
  .pickers{ display:flex; align-items:center; gap:8px; flex:none; position:relative; }
  .picker-label{ font-size:12.5px; color:var(--muted); margin-right:2px; }
  .picker-sep{ width:1px; height:22px; background: var(--panel-line); margin:0 8px; }
  .theme-btn, .animal-btn{
    font-family:'Inter', sans-serif; font-size:13px; font-weight:600;
    background:transparent; color:var(--muted);
    border:1px solid var(--panel-line); border-radius:999px; padding:6px 13px;
    cursor:pointer; transition: all .15s ease; white-space:nowrap;
  }
  .theme-btn:hover, .animal-btn:hover{ color:var(--text); }
  .theme-btn.active{ background:rgba(251,191,36,0.14); border-color:rgba(251,191,36,0.5); color:var(--text); }
  .animal-btn.active{ background:rgba(110,231,183,0.14); border-color:rgba(110,231,183,0.5); color:var(--text); }

  /* Zone centrale : caméra | réseau | écran */
  .main{ flex:1; min-height:0; display:flex; align-items:stretch; gap:8px; position:relative; }
  .side{ flex:none; display:flex; flex-direction:column; align-items:center; }
  .side.left{ width:212px; }
  .side.right{ width:256px; }
  .panel-svg{ display:block; width:100%; height:auto; }
  canvas#net{ flex:none; width:740px; height:530px; display:block; border-radius:12px; }

  .example-text{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted);
    line-height:1.55; text-align:left; width:100%; margin-top:14px; padding:0 4px;
  }
  .example-text b{ color:var(--text); font-weight:600; }

  .readouts{ display:flex; gap:26px; font-family:'JetBrains Mono', monospace; margin-top:22px; justify-content:center; }
  .readout .label{ font-size:10.5px; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; text-align:center; }
  .readout .value{ font-size:26px; font-weight:600; color:var(--amber); text-align:center; }
  .readout .value.loss{ color: var(--coral); }

  /* Légende + Recommencer */
  .controls{ display:flex; align-items:center; gap:12px; flex:none; position:relative; }
  button{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    background:var(--mint); color:#0C0A16; border:none; border-radius:10px; padding:9px 18px; cursor:pointer;
    transition: transform .12s ease, opacity .12s ease;
  }
  button:hover{ transform: translateY(-1px); }
  button:active{ transform: translateY(0); }
  button.secondary{ background:transparent; color:var(--text); border:1px solid var(--panel-line); }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .legend{
    display:flex; gap:18px; margin-left:auto; align-items:center;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
  }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .swatch{ width:16px; height:3px; border-radius:2px; display:inline-block; }

  /* Scène : photo -> caméra -> réseau -> écran */
  .scene-label{ fill:#A79FC4; font:600 11.5px 'Inter', sans-serif; text-anchor:middle; letter-spacing:.05em; text-transform:uppercase; }
  .arr{ stroke:#6EE7B7; stroke-width:3; stroke-opacity:.4; stroke-linecap:round; fill:none; }
  #app[data-state="seeing"] .arr1, #app[data-state="seeing"] .arr2,
  #app[data-state="answer"] .arr3, #app[data-state="verdict"] .arr3{
    stroke-opacity:1; stroke-dasharray:7 6; animation: sceneFlow .9s linear infinite;
  }
  @keyframes sceneFlow{ to{ stroke-dashoffset:-26; } }
  .cam-flash{ opacity:.25; transform-box: fill-box; transform-origin:center; }
  .cam-flash.go{ animation: camFlash 0.9s ease-out; }
  @keyframes camFlash{ 0%{opacity:.25; transform:scale(1);} 25%{opacity:1; transform:scale(2.6);} 100%{opacity:.25; transform:scale(1);} }
  .scr-l1{ font:700 16.5px 'Space Grotesk','Inter',sans-serif; text-anchor:middle; }
  .scr-l2{ font:600 12.5px 'Inter',sans-serif; text-anchor:middle; }
  .blink{ animation: sceneBlink 1.1s ease-in-out infinite; }
  @keyframes sceneBlink{ 0%,100%{opacity:1;} 50%{opacity:.45;} }
  #screenGroup{ transform-box: fill-box; transform-origin:center; }
  #screenGroup.shake{ animation: screenShake .55s ease; }
  @keyframes screenShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(3px);} }
  @media (prefers-reduced-motion: reduce){
    .arr, .cam-flash.go, .blink, #screenGroup.shake{ animation:none !important; }
    button{ transition:none; }
  }
</style>
</head>
<body>

        <div class="example-text"></div>
      </aside>

      <canvas id="net" width="740" height="530" aria-label="Animation du réseau de neurones en cours d'apprentissage" role="img"></canvas>

      <!-- À droite : l'écran (sortie) -->
      <aside class="side right">
        <svg class="panel-svg" viewBox="0 0 260 345" role="img" aria-label="Le résultat s'affiche sur un écran">
          <line class="arr arr3" x1="2" y1="220" x2="34" y2="220" marker-end="url(#sceneArrHead)"/>
          <g id="screenGroup">
            <rect id="screenFrame" x="42" y="134" width="214" height="172" rx="12" fill="#0C0A16" stroke="#6EE7B7" stroke-width="2.5"/>
            <rect x="50" y="142" width="198" height="156" rx="8" fill="rgba(110,231,183,0.05)"/>
            <text id="scrL1" class="scr-l1" x="149" y="213" fill="#A79FC4">En attente…</text>
            <text id="scrL2" class="scr-l2" x="149" y="241" fill="#A79FC4">d'une image</text>
          </g>
          <path d="M128 306 L170 306 L176 320 L122 320 Z" fill="rgba(110,231,183,0.12)" stroke="#6EE7B7" stroke-width="2" stroke-linejoin="round"/>
          <line x1="108" y1="320" x2="190" y2="320" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round"/>
          <text class="scene-label" x="149" y="340">L'écran</text>
        </svg>
        <div class="readouts">
          <div class="readout"><div class="label">Essai n°</div><div class="value" id="epochVal">0</div></div>
          <div class="readout"><div class="label">Erreur</div><div class="value loss" id="lossVal">–</div></div>
        </div>
      </aside>

    </div>

    <div class="controls">
      <button id="resetBtn" class="secondary">Recommencer</button>
      <div class="legend">
        <span><i class="swatch" style="background:var(--mint)"></i>« oui, cet indice compte »</span>
        <span><i class="swatch" style="background:var(--coral)"></i>« non, pas important »</span>
      </div>
    </div>

  </div>

  <!-- Banque d'icônes : sources de la « photo » (jamais affichées telles quelles) -->
  <div id="iconBank" style="display:none">
    <svg class="example-icon" id="iconCatPos" width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

          <g stroke="#A79FC4" stroke-width="1.3" stroke-linecap="round" opacity="0.7">
            <path d="M20 62 L2 58"/><path d="M20 68 L2 68"/><path d="M20 74 L3 78"/>
            <path d="M80 62 L98 58"/><path d="M80 68 L98 68"/><path d="M80 74 L97 78"/>

        </svg>
    <svg class="example-icon hidden" id="iconCatNeg" width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

<script>
(function(){
  const canvas = document.getElementById('net');
  const ctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Layout ----------
  const LOGICAL_W = 740, LOGICAL_H = 530;
  const NET_CY = 212;            // centre vertical du réseau (la bande du bas est réservée aux bulles)
  const BUBBLE_TOP = 372;        // début de la bande des bulles
  const TEMPO = 1;               // 1 = lent (par défaut) ; mettre 0.6 pour accélérer, 1.5 pour ralentir encore
  let scale = 1;

  // Le cadre (1280 x 720) est mis à l'échelle pour tenir dans la fenêtre ;
  // le canevas est redessiné à la bonne résolution pour rester net.
  const appEl = document.getElementById('app');
  let appScale = 1;
  function resize(){
    const dpr = window.devicePixelRatio || 1;
    const k = dpr * appScale;
    canvas.width = Math.round(LOGICAL_W * k);
    canvas.height = Math.round(LOGICAL_H * k);
    ctx.setTransform(k,0,0,k,0,0);
  }
  function fit(){
    appScale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    appEl.style.setProperty('--s', appScale);
    resize();
  }
  window.addEventListener('resize', fit);

  const themes = {
    chat: {
      inputLabels: ['Oreilles pointues','Poils courts'],
      outputLabels: ['Chat','Chien'],
      titleText: 'reconnaître un chat',
      introText: 'deviner « chat » ou « chien » à partir de deux indices',
      cases: {
        positif: { inputs:[0.92,0.70], trueIdx:0, traitText:'oreilles pointues, poils courts', icon:'iconCatPos', label:'🐱 Chat' },
        normal:  { inputs:[0.15,0.80], trueIdx:1, traitText:'oreilles tombantes, poils courts', icon:'iconCatNeg', label:'🐶 Chien' },
      },
      trueLabelWho: 'donnée par le prof',
      answerTexts: ['C\u2019est un chat !', 'C\u2019est un chien !'],
    },
    poumons: {
      inputLabels: ['Opacité visible','Étendue de la zone'],
      outputLabels: ['Pneumonie','Sain'],
      titleText: 'repérer une pneumonie',
      introText: 'deviner « pneumonie » ou « poumons sains » à partir de deux indices visuels sur une radio',
      cases: {
        positif: { inputs:[0.88,0.75], trueIdx:0, traitText:'opacité marquée, zone étendue', icon:'iconLungsPos', label:'🫁 Pneumonie' },
        normal:  { inputs:[0.10,0.15], trueIdx:1, traitText:'poumons clairs, pas d\u2019opacité', icon:'iconLungsNeg', label:'🫁 Sain' },
      },
      trueLabelWho: 'confirmée par le médecin',
      answerTexts: ['Je vois une pneumonie', 'Poumons sains'],
    },
    peau: {
      inputLabels: ['Bord irrégulier','Couleur non uniforme'],
      outputLabels: ['À surveiller','Normal'],
      titleText: 'repérer un grain de beauté suspect',
      introText: 'deviner si un grain de beauté est « à surveiller » ou « normal » à partir de deux indices visuels',
      cases: {
        positif: { inputs:[0.85,0.80], trueIdx:0, traitText:'bords irréguliers, couleur non uniforme', icon:'iconMolePos', label:'🔬 À surveiller' },
        normal:  { inputs:[0.10,0.12], trueIdx:1, traitText:'bords réguliers, couleur uniforme', icon:'iconMoleNeg', label:'🔬 Normal' },
      },
      trueLabelWho: 'confirmée par le dermatologue',
      answerTexts: ['Grain à surveiller', 'Grain normal'],
    },
    os: {
      inputLabels: ['Ligne visible','Os déplacé'],
      outputLabels: ['Fracture','Normal'],
      titleText: 'repérer une fracture',
      introText: 'deviner « fracture » ou « normal » à partir de deux indices visuels sur une radio',
      cases: {
        positif: { inputs:[0.90,0.70], trueIdx:0, traitText:'ligne de fracture visible, os déplacé', icon:'iconBonePos', label:'🦴 Fracture' },
        normal:  { inputs:[0.08,0.05], trueIdx:1, traitText:'os intact, bien aligné', icon:'iconBoneNeg', label:'🦴 Normal' },
      },
      trueLabelWho: 'confirmée par le médecin',
      answerTexts: ['Fracture détectée', 'Os normal'],
    },
  };

  let currentTheme = 'chat';
  let currentCase = 'positif';
  let inputLabels = themes.chat.inputLabels;
  let outputLabels = themes.chat.outputLabels;
  let trueIdx = themes.chat.cases.positif.trueIdx;
  let inputs = themes.chat.cases.positif.inputs;

  function verticalPositions(n, spread){
    if(n<=1) return [NET_CY];
    const arr = [];
    for(let i=0;i<n;i++){ arr.push(NET_CY + (i-(n-1)/2) * spread); }
    return arr;
  }

  function layout(){
    const inX = 185, outX = LOGICAL_W-110, hidX = (inX + outX)/2;
    const inY = verticalPositions(inputLabels.length, 140);
    const hidY = verticalPositions(3, 115);
    const outY = verticalPositions(outputLabels.length, 120);
    const inputNodes = inputLabels.map((l,i)=>({ x: inX, y: inY[i], label:l }));
    const hiddenNodes = hidY.map((y)=>({ x: hidX, y }));
    const outputNodes = outputLabels.map((l,i)=>({ x: outX, y: outY[i], label:l }));
    return {inputNodes, hiddenNodes, outputNodes};
  }
  let {inputNodes, hiddenNodes, outputNodes} = layout();

  // ---------- Model state ----------
  let w1, w2, w1Before, w2Before, hiddenAct, outputProbs, loss, dOut, dHidden, epoch;
  let firstMistakeShown = false;
  let firstMistakeBanner = false;
  let currentMistake = false;

  function rand(){ return (Math.random()*2 - 1); }

  function initModel(){
    // w1[i][j] = poids de l'entrée i vers le neurone caché j.
    // Réglé pour que les 3 neurones aient chacun un rôle net et lisible dès le départ :
    // neurone 0 → "opacité visible" fort, neurone 1 → "étendue de la zone" fort, neurone 2 → "les deux" forts.
    const jitter = ()=> (Math.random()-0.5)*0.1;
    w1 = [
      [1.2+jitter(), 0.05+jitter(), 1.1+jitter()], // opacité visible    -> h0, h1, h2
      [0.05+jitter(), 1.2+jitter(), 1.1+jitter()]  // étendue de la zone -> h0, h1, h2
    ];
    // Le réseau démarre volontairement très confiant... et dans le mauvais sens,
    // pour que la toute première erreur soit spectaculaire et bien visible.
    w2 = hiddenNodes.map(()=> [ -(1.6 + Math.random()*0.4), (1.6 + Math.random()*0.4) ]);
    hiddenAct = hiddenNodes.map(()=>0);
    outputProbs = outputLabels.map(()=>0.5);
    loss = null;
    epoch = 0;
    lossHistory = [];
    firstMistakeShown = false;
    currentMistake = false;
    w1Before = null;
    w2Before = null;
  }

  function sigmoid(x){ return 1/(1+Math.exp(-x)); }

  function forwardAndGrad(){
    // forward
    hiddenAct = hiddenNodes.map((_,j)=>{
      let s = 0;
      inputs.forEach((v,i)=> s += v * w1[i][j]);
      return sigmoid(s);
    });
    const raw = outputLabels.map((_,k)=>{
      let s = 0;
      hiddenAct.forEach((h,j)=> s += h * w2[j][k]);
      return s;
    });
    const maxRaw = Math.max(...raw);
    const exps = raw.map(r=> Math.exp(r-maxRaw));
    const sumExp = exps.reduce((a,b)=>a+b,0);
    outputProbs = exps.map(e=> e/sumExp);
    loss = -Math.log(Math.max(outputProbs[trueIdx], 1e-6));

    // gradients (softmax + cross-entropy, then sigmoid backprop)
    dOut = outputProbs.map((p,k)=> p - (k===trueIdx?1:0));
    dHidden = hiddenNodes.map((_,j)=>{
      let s = 0;
      dOut.forEach((d,k)=> s += d * w2[j][k]);
      return s * hiddenAct[j] * (1-hiddenAct[j]);
    });
  }

  function cloneMatrix(m){ return m.map(row=> row.slice()); }

  function applyUpdate(){
    w1Before = cloneMatrix(w1);
    w2Before = cloneMatrix(w2);
    const lr = 0.6;
    for(let j=0;j<hiddenNodes.length;j++){
      for(let k=0;k<outputLabels.length;k++){
        w2[j][k] -= lr * hiddenAct[j] * dOut[k];
      }
    }
    for(let i=0;i<inputLabels.length;i++){
      for(let j=0;j<hiddenNodes.length;j++){
        w1[i][j] -= lr * inputs[i] * dHidden[j];
      }
    }
  }

  function lerpMatrix(before, after, t){
    return before.map((row,i)=> row.map((v,j)=> v + (after[i][j]-v)*t));
  }

  function topDeltas(before, after, tag, count){
    const items = [];
    before.forEach((row,i)=> row.forEach((v,j)=>{
      items.push({ tag, i, j, delta: after[i][j]-v });
    }));
    items.sort((a,b)=> Math.abs(b.delta)-Math.abs(a.delta));
    return items.slice(0, count);
  }

  let lossHistory = [];

  // ---------- Phase machine ----------
  const PHASES = [
    { key:'init', tag:'00', label:'Au tout début, le réseau n\u2019a jamais vu d\u2019exemple. Chaque connexion affiche déjà son poids (le petit chiffre sur chaque trait) : ce sont ces poids-là qui vont être ajustés au fil de l\u2019entraînement. Le rôle de chaque neurone caché est indiqué juste en dessous de lui.', dur: 6500 },
    { key:'forward', tag:'01', label:'Il regarde la carte choisie : chaque indice est multiplié par l\u2019importance que le neurone caché lui donne, additionné, puis transmis jusqu\u2019à la réponse finale.', dur: 10000 },
    { key:'error', tag:'02', label:'Il annonce un pourcentage de chances pour chaque réponse possible. La vraie réponse est alors révélée : l\u2019écart entre les deux donne un chiffre, l\u2019erreur — plus il était sûr de lui et faux, plus l\u2019erreur est grande.', dur: 7000 },
    { key:'backward', tag:'03', label:'Il remonte l\u2019enquête à l\u2019envers : pour chaque neurone caché, il se demande « est-ce toi qui m\u2019as fait me tromper, et à quel point ? ». Il refait ce calcul jusqu\u2019aux 2 indices de départ, pour savoir lequel a le plus pesé dans l\u2019erreur.', dur: 10000 },
    { key:'update', tag:'04', label:'Il corrige ses réglages : si un indice l\u2019a bien aidé, il augmente son importance ; s\u2019il l\u2019a trompé, il la diminue. Ce petit ajustement, répété à chaque carte, rend le réseau un peu meilleur.', dur: 7500 },
  ];
  let phaseIdx = 0;
  let phaseStart = 0;
  // Progression pilotée par l'élève : l'animation joue un segment, puis attend le clic sur l'icône « suite »
  let phaseProg = 0;          // avancement de la phase (0 → 1)
  let lastNow = 0;
  let bubbleIdx = 0;          // numéro de la bulle affichée dans la phase
  let bubbleChangedAt = 0;
  let bubbleHit = null;       // zone cliquable de l'icône (coordonnées du canevas)
  let playing = true;
  let firstCycle = true;

  const epochVal = document.getElementById('epochVal');
  const lossVal = document.getElementById('lossVal');

  function enterPhase(idx, now){
    phaseIdx = idx;
    phaseStart = now;
    phaseProg = 0;
    lastNow = now;
    bubbleIdx = 0;
    bubbleChangedAt = now;
    const ph = PHASES[idx];

    if(ph.key === 'forward'){
      forwardAndGrad();
    }

    if(ph.key === 'error'){
      const predicted = outputProbs[0] > outputProbs[1] ? 0 : 1;
      currentMistake = (predicted !== trueIdx);
      // la toute première erreur est mise en scène (titre de la bulle, écran qui tremble)
      firstMistakeBanner = false;
      if(currentMistake && !firstMistakeShown){
        firstMistakeShown = true;
        firstMistakeBanner = true;
      }
    }

    if(ph.key === 'update'){
      applyUpdate();
      lossHistory.push(loss);
      if(lossHistory.length>40) lossHistory.shift();
    }

  }

  function advancePhase(now){
    let next = phaseIdx + 1;
    if(next >= PHASES.length){
      next = 1; // loop forward->error->backward->update, skip init after first time
      epoch += 1;
      epochVal.textContent = epoch;
    }
    if(firstCycle && next===1){ firstCycle = false; }
    enterPhase(next, now);
  }

  function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

  // ---------- Drawing ----------
  function edgeColor(weight, alpha){
    const w = Math.max(-1, Math.min(1, weight));
    const mag = Math.sqrt(Math.abs(w));
    if(w>=0){
      const a = Math.min(0.85, 0.14 + mag*0.68) * alpha;
      return `rgba(110,231,183,${a})`;
    } else {
      const a = Math.min(0.85, 0.14 + mag*0.68) * alpha;
      return `rgba(251,113,133,${a})`;
    }
  }

  function drawNodeGlow(x,y,r,intensity,color){
    const grd = ctx.createRadialGradient(x,y,0,x,y,r*2.6);
    grd.addColorStop(0, color.replace('ALPHA', 0.55*intensity+0.08));
    grd.addColorStop(1, color.replace('ALPHA', 0));
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x,y,r*2.6,0,Math.PI*2);
    ctx.fill();
  }

  function drawNode(x,y,r,fillAlpha,strokeColor,label,labelSide, valueText){
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = `rgba(28,24,48,${0.9})`;
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = strokeColor;
    ctx.stroke();

    ctx.fillStyle = `rgba(241,237,251,${0.85})`;
    ctx.font = '600 12px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if(valueText !== undefined){
      ctx.fillText(valueText, x, y+1);
    }

    if(label){
      ctx.font = '500 12.5px "Inter", sans-serif';
      ctx.fillStyle = 'rgba(241,237,251,0.9)';
      if(labelSide==='left'){
        ctx.textAlign = 'right';
        ctx.fillText(label, x-r-12, y);
      } else if(labelSide==='right'){
        ctx.textAlign = 'left';
        ctx.fillText(label, x+r+12, y);
      }
    }
  }

  function drawEdges(pairs, weightMatrix, glowProgress, direction){
    // direction: 'fwd' (from->to) or 'bwd'
    pairs.forEach(({from, to, wi, wj})=>{
      const w = weightMatrix[wi][wj];
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.lineWidth = 0.8 + Math.sqrt(Math.abs(w))*2.6;
      ctx.strokeStyle = edgeColor(w, 1);
      ctx.stroke();

      if(glowProgress !== null){
        const t = easeInOut(Math.max(0, Math.min(1, glowProgress)));
        // aller : de gauche à droite ; erreur : de droite à gauche (elle remonte le réseau)
        const a = direction==='fwd' ? from : to, b = direction==='fwd' ? to : from;
        const px = a.x + (b.x-a.x)*t;
        const py = a.y + (b.y-a.y)*t;
        const color = direction==='fwd' ? '110,231,183' : '251,113,133';
        ctx.beginPath();
        ctx.arc(px,py, 4.2, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${color},0.95)`;
        ctx.shadowColor = `rgba(${color},0.9)`;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    });
  }

  function allInHiddenPairs(){
    const arr = [];
    inputNodes.forEach((from,i)=> hiddenNodes.forEach((to,j)=> arr.push({from,to,wi:i,wj:j})));
    return arr;
  }
  function allHiddenOutPairs(){
    const arr = [];
    hiddenNodes.forEach((from,j)=> outputNodes.forEach((to,k)=> arr.push({from,to,wi:j,wj:k})));
    return arr;
  }

  function drawSparkline(){
    const x0 = LOGICAL_W-230, y0 = 54, w = 200, h = 44;
    ctx.save();
    ctx.font = '500 10.5px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(167,159,196,0.9)';
    ctx.textAlign = 'left';
    ctx.fillText('COURBE D\u2019ERREUR', x0, y0-10);

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x0, y0, w, h);

    if(lossHistory.length>1){
      const maxL = Math.max(...lossHistory, 0.6);
      ctx.beginPath();
      lossHistory.forEach((l,i)=>{
        const px = x0 + (i/(Math.max(lossHistory.length-1,1)))*w;
        const py = y0 + h - (l/maxL)*h;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      });
      ctx.strokeStyle = '#FBBF24';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }
    ctx.restore();
  }

  function hiddenRoleLabel(wA, wB){
    // wA = poids du 1er indice, wB = poids du 2e indice, pour ce neurone
    const th = 0.15;
    const aPos = wA > th, bPos = wB > th, aNeg = wA < -th, bNeg = wB < -th;
    const nameA = inputLabels[0], nameB = inputLabels[1];
    if(aPos && bPos){
      if(Math.abs(wA-wB) < 0.25) return 'Combine les deux indices';
      return wA > wB ? ('Réagit surtout à « ' + nameA + ' »') : ('Réagit surtout à « ' + nameB + ' »');
    }
    if(aPos && !bPos) return 'Réagit surtout à « ' + nameA + ' »';
    if(bPos && !aPos) return 'Réagit surtout à « ' + nameB + ' »';
    if(aNeg && bNeg) return 'S\u2019active si les 2 indices sont absents';
    return 'Rôle encore incertain';
  }

  function drawRoleLabel(x, y, text){
    ctx.save();
    ctx.font = '500 10px "Inter", sans-serif';
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = 'rgba(28,24,48,0.85)';
    ctx.fillRect(x-tw/2-7, y-9, tw+14, 18);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x-tw/2-7, y-9, tw+14, 18);
    ctx.fillStyle = 'rgba(167,159,196,0.95)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y+1);
    ctx.restore();
  }

  function drawWeightLabel(from, to, t, weight){
    const x = from.x + (to.x-from.x)*t;
    const y = from.y + (to.y-from.y)*t;
    const txt = (weight>=0?'+':'') + weight.toFixed(2);
    const color = weight>=0 ? '110,231,183' : '251,113,133';
    ctx.save();
    ctx.font = '600 9.5px "JetBrains Mono", monospace';
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(12,10,22,0.75)';
    ctx.fillRect(x-tw/2-4, y-7.5, tw+8, 14);
    ctx.fillStyle = `rgba(${color},0.95)`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y+0.5);
    ctx.restore();
  }

  function drawDeltaLabels(progress){
    const d1 = topDeltas(w1Before, w1, 'w1', 2); // oreilles/poils -> neurones cachés
    const d2 = topDeltas(w2Before, w2, 'w2', 2); // neurones cachés -> sortie
    const all = d1.concat(d2);
    const pairs1 = allInHiddenPairs();
    const pairs2 = allHiddenOutPairs();
    const fadeIn = Math.min(1, progress/0.35);

    all.forEach(item=>{
      const edge = item.tag==='w1'
        ? pairs1.find(p=> p.wi===item.i && p.wj===item.j)
        : pairs2.find(p=> p.wi===item.i && p.wj===item.j);
      if(!edge || Math.abs(item.delta) < 0.003) return;

      const mx = (edge.from.x+edge.to.x)/2;
      const my = (edge.from.y+edge.to.y)/2;
      const txt = (item.delta>=0?'+':'') + item.delta.toFixed(2);
      const color = item.delta>=0 ? '110,231,183' : '251,113,133';

      ctx.save();
      ctx.globalAlpha = fadeIn;
      ctx.font = '700 12px "JetBrains Mono", monospace';
      const tw = ctx.measureText(txt).width;
      ctx.fillStyle = 'rgba(12,10,22,0.88)';
      ctx.fillRect(mx-tw/2-6, my-19, tw+12, 17);
      ctx.strokeStyle = `rgba(${color},0.5)`;
      ctx.lineWidth = 1;
      ctx.strokeRect(mx-tw/2-6, my-19, tw+12, 17);
      ctx.fillStyle = `rgba(${color},1)`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(txt, mx, my-10.5);
      ctx.restore();
    });
  }

  // ---------- Bulles explicatives ----------
  // Chaque phase déroule une suite de bulles (s = début, e = fin, en part de la durée de la phase).
  // La dernière bulle d'une phase reste affichée jusqu'au clic suivant (e > 1).
  const fmt = (x)=> x.toFixed(2);
  const pct = (p)=> Math.round(p*100) + ' %';
  const predictedIdx = ()=> outputProbs[0] >= outputProbs[1] ? 0 : 1;
  const edgePoint = (from, to, t)=> ({ x: from.x+(to.x-from.x)*t, y: from.y+(to.y-from.y)*t, r: 13 });
  const nodePoint = (n, r)=> ({ x: n.x, y: n.y, r: r||24 });
  const importancePoint = (n)=> ({ x: n.x, y: n.y + 30, r: 11, rect: { w: 150, h: 18 } });

  function biggestChange(){
    if(!w1Before || !w2Before) return null;
    const cands = topDeltas(w1Before, w1, 'w1', 1).concat(topDeltas(w2Before, w2, 'w2', 1));
    cands.sort((a,b)=> Math.abs(b.delta)-Math.abs(a.delta));
    const c = cands[0];
    if(!c) return null;
    const from = c.tag==='w1' ? inputNodes[c.i] : hiddenNodes[c.i];
    const to   = c.tag==='w1' ? hiddenNodes[c.j] : outputNodes[c.j];
    const before = (c.tag==='w1' ? w1Before : w2Before)[c.i][c.j];
    const after  = (c.tag==='w1' ? w1 : w2)[c.i][c.j];
    return { from, to, before, after, delta: c.delta, t: c.tag==='w1' ? 0.44 : 0.70 };
  }

  const BUBBLES = {
    init: [
      { s:0, e:0.25, title:'Les indices de la carte',
        anchors: ()=> inputNodes.map(n=> nodePoint(n,26)),
        body: ()=> 'Voici ce que l\u2019IA « voit » : ' + inputLabels[0] + ' (' + fmt(inputs[0]) + ') et ' + inputLabels[1] + ' (' + fmt(inputs[1]) + '). Proche de 1 = l\u2019indice est très présent.' },
      { s:0.25, e:0.5, title:'Deux nombres à ne pas confondre',
        anchors: ()=> inputNodes.map(n=> nodePoint(n,26)).concat(inputNodes.map(n=> importancePoint(n))),
        body: ()=> 'Dans le rond : ce que montre la carte. Il ne change jamais (c\u2019est la photo). Dessous, « Importance donnée » : la confiance que l\u2019IA accorde à cet indice. Elle, elle va évoluer en apprenant.' },
      { s:0.5, e:0.75, title:'Les poids',
        anchors: ()=> allInHiddenPairs().map(p=> edgePoint(p.from,p.to,0.44)).concat(allHiddenOutPairs().map(p=> edgePoint(p.from,p.to,0.70))),
        body: ()=> 'Chaque trait porte un petit chiffre : le poids. C\u2019est l\u2019importance de cette connexion. L\u2019« Importance donnée » d\u2019un indice additionne les poids des traits qui partent de lui. Au départ, le réseau ne sait rien : ces chiffres sont à corriger.' },
      { s:0.75, e:1.01, title:'Les neurones cachés',
        anchors: ()=> hiddenNodes.map(n=> nodePoint(n,22)),
        body: ()=> 'Ils se spécialisent : le rôle de chacun est écrit sous lui. Ils combinent les indices avant de donner la réponse.' },
    ],
    forward: [
      { s:0, e:0.2, title:'1 · Le départ',
        anchors: ()=> inputNodes.map(n=> nodePoint(n,26)),
        body: ()=> 'Les indices de la carte entrent dans le réseau et partent le long des traits.' },
      { s:0.2, e:0.5, title:'2 · Le calcul',
        anchors: ()=> hiddenNodes.map(n=> nodePoint(n,22)),
        body: ()=> {
          const j = hiddenNodes.length-1;
          const sum = inputs[0]*w1[0][j] + inputs[1]*w1[1][j];
          return 'Chaque neurone multiplie chaque indice par le poids du trait, puis additionne. Exemple, neurone du bas : ' +
            fmt(inputs[0]) + ' × ' + fmt(w1[0][j]) + ' + ' + fmt(inputs[1]) + ' × ' + fmt(w1[1][j]) + ' = ' + fmt(sum) +
            ', ramené entre 0 et 1 : ' + fmt(hiddenAct[j]) + '.';
        } },
      { s:0.5, e:0.8, title:'3 · Les avis',
        anchors: ()=> allHiddenOutPairs().map(p=> edgePoint(p.from,p.to,0.70)),
        body: ()=> 'Les neurones cachés transmettent leur avis à la sortie, eux aussi multipliés par un poids.' },
      { s:0.8, e:1.01, title:'4 · La réponse',
        anchors: ()=> outputNodes.map(n=> nodePoint(n,28)),
        body: ()=> { const k = predictedIdx(); return 'Le réseau conclut : ' + pct(outputProbs[k]) + ' de chances que ce soit « ' + outputLabels[k] + ' ».'; } },
    ],
    error: [
      { s:0, e:0.5, title:'La réponse de l’IA',
        anchors: ()=> [ nodePoint(outputNodes[predictedIdx()], 28) ],
        body: ()=> { const k = predictedIdx(); return 'Elle pense à ' + pct(outputProbs[k]) + ' que c’est « ' + outputLabels[k] + ' ». Mais est-ce vrai ?'; } },
      { s:0.5, e:1.01, title: ()=> (firstMistakeBanner ? '\u274C Première erreur : elle s\u2019est trompée !' : 'La vraie réponse'),
        anchors: ()=> [ nodePoint(outputNodes[trueIdx], 28) ],
        body: ()=> {
          const wrong = predictedIdx() !== trueIdx;
          return 'Le prof révèle : « ' + outputLabels[trueIdx] + ' ». ' +
            (wrong ? 'L’IA s’est trompée ! ' : 'L’IA a vu juste, mais elle peut être plus sûre d’elle. ') +
            'Erreur = ' + fmt(loss) + ' : plus elle est grande, plus il faut corriger.';
        } },
    ],
    backward: [
      { s:0, e:0.25, title:'1 · L’erreur repart',
        anchors: ()=> outputNodes.map(n=> nodePoint(n,28)),
        body: ()=> 'On part de la sortie, là où on a mesuré l’écart avec la bonne réponse. Les points rouges remontent le réseau.' },
      { s:0.25, e:0.5, title:'2 · Qui est responsable ?',
        anchors: ()=> hiddenNodes.map(n=> nodePoint(n,22)),
        body: ()=> 'L’erreur arrive aux neurones cachés. Chacun calcule sa part de responsabilité : « ai-je poussé vers la mauvaise réponse ? »' },
      { s:0.5, e:0.8, title:'3 · Jusqu’aux indices',
        anchors: ()=> inputNodes.map(n=> nodePoint(n,26)),
        body: ()=> 'Elle atteint les indices de départ : on regarde quels traits ont le plus contribué à l’erreur.' },
      { s:0.8, e:1.01, title:'Fin de l’enquête',
        anchors: ()=> [],
        body: ()=> 'Chaque poids sait maintenant s’il doit augmenter ou diminuer, et de combien. Il reste à le corriger.' },
    ],
    update: [
      { s:0, e:0.5, title:'Les poids bougent',
        anchors: ()=> { const c = biggestChange(); return c ? [ edgePoint(c.from, c.to, c.t) ] : []; },
        body: ()=> {
          const c = biggestChange();
          if(!c) return 'Chaque poids est corrigé pour réduire l\u2019erreur.';
          return 'Chaque poids est corrigé pour réduire l\u2019erreur. Exemple : celui-ci passe de ' + fmt(c.before) + ' à ' + fmt(c.after) +
            '. L’étiquette ' + (c.delta>=0?'+':'') + fmt(c.delta) + ' montre le changement.';
        } },
      { s:0.5, e:1.01, title:'On recommence !',
        anchors: ()=> inputNodes.map(n=> importancePoint(n)),
        body: ()=> 'Regarde « Importance donnée » sous les indices : elle a changé, car les poids ont été corrigés. L\u2019IA fera un peu moins d\u2019erreur au prochain essai. Répété des milliers de fois, c\u2019est comme ça qu\u2019elle apprend.' },
    ],
  };

  function wrapText(text, maxW){
    const words = text.split(' ');
    const lines = [];
    let line = '';
    words.forEach(w=>{
      const test = line ? line + ' ' + w : w;
      if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
      else line = test;
    });
    if(line) lines.push(line);
    return lines;
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawBubble(def, alpha, now, pos, total, isLast, ready){
    const anchors = def.anchors();
    const bodyFont = '500 13.5px "Inter", sans-serif';
    const titleFont = '700 14px "Space Grotesk", sans-serif';
    const smallFont = '600 10.5px "Inter", sans-serif';
    const maxTextW = 380, padX = 16, padY = 12, lineH = 18.5;
    const nextLabel = isLast ? 'Étape suivante' : 'Suite';

    ctx.save();
    ctx.globalAlpha = alpha;

    // anneaux qui pulsent sur les éléments expliqués
    const pulse = 0.5 + 0.5*Math.sin(now/260);
    anchors.forEach(a=>{
      if(a.rect){
        roundRect(a.x - a.rect.w/2 - 4 - pulse*2, a.y - a.rect.h/2 - 4 - pulse*2, a.rect.w + 8 + pulse*4, a.rect.h + 8 + pulse*4, 9);
      } else {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r + 2 + pulse*4, 0, Math.PI*2);
      }
      ctx.strokeStyle = 'rgba(251,191,36,' + (0.55 + 0.4*pulse) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    // taille de la bulle (texte + colonne de l'icône « suite » à droite)
    ctx.font = bodyFont;
    const lines = wrapText(def.body(), maxTextW);
    const textW = Math.max(...lines.map(l=> ctx.measureText(l).width));
    ctx.font = titleFont;
    const titleText = typeof def.title === 'function' ? def.title() : def.title;
    const titleW = ctx.measureText(titleText).width + 34;   // + place pour le compteur « 2/4 »
    ctx.font = smallFont;
    const colW = Math.max(60, ctx.measureText(nextLabel).width + 18);
    const textBlockW = Math.min(maxTextW, Math.max(textW, titleW));
    const w = textBlockW + padX*2 + colW;
    const h = Math.max(padY*2 + 22 + lines.length*lineH, 84);

    // position : dans la bande du bas, sous les éléments concernés
    const cx = anchors.length ? anchors.reduce((s,a)=> s+a.x, 0)/anchors.length : LOGICAL_W/2;
    const bx = Math.max(10, Math.min(LOGICAL_W - w - 10, cx - w/2));
    const by = BUBBLE_TOP + 8;

    // traits pointillés jusqu'aux éléments expliqués
    ctx.setLineDash([3,4]);
    ctx.strokeStyle = 'rgba(251,191,36,0.5)';
    ctx.lineWidth = 1.3;
    // trait pointillé seulement si peu d'éléments sont désignés (sinon les anneaux suffisent)
    (anchors.length <= 3 ? anchors : []).forEach(a=>{
      const sx = Math.max(bx+16, Math.min(bx+w-colW-16, a.x));
      ctx.beginPath();
      ctx.moveTo(sx, by);
      ctx.lineTo(a.x, a.y + a.r + 4);
      ctx.stroke();
    });
    ctx.setLineDash([]);

    // cadre de la bulle
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(14,12,26,0.97)';
    roundRect(bx, by, w, h, 14);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(251,191,36,0.75)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // texte
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = titleFont;
    ctx.fillStyle = '#FBBF24';
    ctx.fillText(titleText, bx+padX, by+padY+14);
    ctx.font = bodyFont;
    ctx.fillStyle = 'rgba(241,237,251,0.96)';
    lines.forEach((l,i)=> ctx.fillText(l, bx+padX, by+padY+22+14+i*lineH-2));

    // compteur « 2/4 »
    ctx.font = smallFont;
    ctx.fillStyle = 'rgba(167,159,196,0.95)';
    ctx.textAlign = 'right';
    ctx.fillText((pos+1) + '/' + total, bx + w - colW - 6, by + padY + 13);

    // séparateur + icône « suite » (zone cliquable = toute la colonne de droite)
    const colX = bx + w - colW;
    ctx.strokeStyle = 'rgba(251,191,36,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(colX, by+12);
    ctx.lineTo(colX, by+h-12);
    ctx.stroke();

    const icx = colX + colW/2, icy = by + h/2 - 8, ir = 16;
    const beat = ready ? (0.5 + 0.5*Math.sin(now/330)) : 0;       // bat quand la lecture peut continuer
    ctx.globalAlpha = alpha * (ready ? 1 : 0.55);
    if(ready){
      ctx.beginPath();
      ctx.arc(icx, icy, ir + 3 + beat*5, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(251,191,36,' + (0.5*(1-beat)) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(icx, icy, ir, 0, Math.PI*2);
    ctx.fillStyle = ready ? '#FBBF24' : 'rgba(251,191,36,0.35)';
    ctx.fill();
    // flèche (chevron double pour « étape suivante », simple pour « suite »)
    ctx.strokeStyle = '#12101E';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const chevron = (ox)=>{
      ctx.beginPath();
      ctx.moveTo(icx+ox-3, icy-6);
      ctx.lineTo(icx+ox+3, icy);
      ctx.lineTo(icx+ox-3, icy+6);
      ctx.stroke();
    };
    if(isLast){ chevron(-3.5); chevron(3.5); } else { chevron(0); }
    ctx.globalAlpha = alpha;
    ctx.font = smallFont;
    ctx.textAlign = 'center';
    ctx.fillStyle = ready ? '#FBBF24' : 'rgba(251,191,36,0.6)';
    ctx.fillText(nextLabel, icx, icy + ir + 16);
    ctx.restore();

    bubbleHit = { x: colX, y: by, w: colW, h: h };
  }

  function drawBubbles(phKey, progress, now){
    bubbleHit = null;
    const list = BUBBLES[phKey];
    if(!list) return;
    const idx = Math.min(bubbleIdx, list.length-1);
    const def = list[idx];
    const alpha = Math.max(0, Math.min(1, (now - bubbleChangedAt) / 280));
    const cap = Math.min(1, def.e);
    const ready = reducedMotion || progress >= cap - 0.0001;
    drawBubble(def, alpha, now, idx, list.length, idx === list.length-1, ready);
  }

  // Passer à la bulle suivante ; après la dernière, on passe à l'étape suivante.
  function nextBubble(){
    const ph = PHASES[phaseIdx];
    const list = BUBBLES[ph.key] || [];
    const now = performance.now();
    if(bubbleIdx < list.length-1){
      bubbleIdx += 1;
      bubbleChangedAt = now;
      phaseProg = Math.max(phaseProg, list[bubbleIdx].s);   // si l'élève a cliqué tôt, l'animation saute au bon endroit
    } else {
      advancePhase(now);
    }
  }

  // ---------- Scène photo -> caméra -> réseau -> écran ----------
  const sceneEl = document.getElementById('app');
  const sceneIconEl = document.getElementById('sceneIcon');
  const scrL1 = document.getElementById('scrL1');
  const scrL2 = document.getElementById('scrL2');
  const camFlashEl = document.getElementById('camFlash');
  const screenFrame = document.getElementById('screenFrame');
  const screenGroup = document.getElementById('screenGroup');
  let sceneKey = '';

  function setSceneIcon(iconId){
    const src = document.getElementById(iconId);
    if(src) sceneIconEl.innerHTML = src.innerHTML;
  }

  function setScreen(l1, c1, l2, c2, blink){
    scrL1.textContent = l1; scrL1.setAttribute('fill', c1);
    scrL2.textContent = l2; scrL2.setAttribute('fill', c2);
    scrL1.classList.toggle('blink', !!blink);
  }

  function updateScene(phKey){
    const theme = themes[currentTheme];
    let state = 'wait';
    if(phKey === 'forward')       state = bubbleIdx >= 3 ? 'answer' : 'seeing';
    else if(phKey === 'error')    state = bubbleIdx >= 1 ? 'verdict' : 'answer';
    else if(phKey === 'backward') state = 'searching';
    else if(phKey === 'update')   state = 'learning';

    const k = predictedIdx();
    const wrong = k !== trueIdx;
    const p = Math.round(outputProbs[k]*100);
    const key = [state, currentTheme, currentCase, k, p, wrong].join('|');
    if(key === sceneKey) return;
    const prevState = sceneKey.split('|')[0];
    sceneKey = key;
    sceneEl.dataset.state = state;

    const MINT = '#6EE7B7', AMBER = '#FBBF24', CORAL = '#FB7185', MUTED = '#A79FC4', TEXT = '#F1EDFB';
    if(state === 'wait')            setScreen('En attente…', MUTED, 'd’une image', MUTED, false);
    else if(state === 'seeing')     setScreen('Je regarde…', AMBER, 'analyse en cours', MUTED, true);
    else if(state === 'answer')     setScreen(theme.answerTexts[k], MINT, p + ' % de confiance', TEXT, false);
    else if(state === 'verdict')    setScreen(theme.answerTexts[k], MINT,
                                        wrong ? '✘ Faux ! C’était : ' + outputLabels[trueIdx] : '✔ Bonne réponse !',
                                        wrong ? CORAL : MINT, false);
    else if(state === 'searching')  setScreen('Je cherche mon erreur…', CORAL, 'elle remonte le réseau', MUTED, true);
    else if(state === 'learning')   setScreen('Je m’ajuste…', AMBER, 'les poids changent', MUTED, true);

    // cadre de l'écran : rouge quand l'IA s'est trompée
    screenFrame.setAttribute('stroke', (state === 'verdict' && wrong) ? CORAL : MINT);
    if(state === 'verdict' && wrong && firstMistakeBanner && prevState !== 'verdict'){
      screenGroup.classList.remove('shake');
      void screenGroup.getBoundingClientRect();
      screenGroup.classList.add('shake');
    }

    // petit flash de la caméra quand une nouvelle image entre dans le réseau
    if(state === 'seeing' && prevState !== 'seeing'){
      camFlashEl.classList.remove('go');
      void camFlashEl.getBoundingClientRect();
      camFlashEl.classList.add('go');
    }
  }

  function render(now){
    ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);

    // section labels
    ctx.font = '600 11.5px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(167,159,196,0.8)';
    ctx.textAlign = 'center';
    ctx.fillText('ENTRÉES', inputNodes[0].x, 20);
    ctx.fillText('COUCHE CACHÉE', hiddenNodes[0].x, 20);
    ctx.fillText('SORTIE', outputNodes[0].x, 20);

    const ph = PHASES[phaseIdx];
    // Le temps ne s'écoule que jusqu'à la fin du segment de la bulle affichée : ensuite, on attend l'élève.
    const dt = Math.min(100, Math.max(0, now - lastNow));
    lastNow = now;
    const bubbleList = BUBBLES[ph.key] || [];
    const cap = bubbleList.length ? Math.min(1, bubbleList[Math.min(bubbleIdx, bubbleList.length-1)].e) : 1;
    if(!reducedMotion) phaseProg = Math.min(cap, phaseProg + dt / (ph.dur * TEMPO));
    const progress = reducedMotion ? 1 : phaseProg;

    let fwdGlow = null, bwdGlow = null, phase1Half = null;

    if(ph.key === 'forward'){
      if(progress < 0.5){ fwdGlow = progress/0.5; phase1Half = 1; }
      else { fwdGlow = (progress-0.5)/0.5; phase1Half = 2; }
    }
    if(ph.key === 'backward'){
      if(progress < 0.5){ bwdGlow = progress/0.5; phase1Half = 1; }
      else { bwdGlow = (progress-0.5)/0.5; phase1Half = 2; }
    }

    // Interpolate weights from their pre-update values so coefficients visibly move
    let w1Disp = w1, w2Disp = w2;
    if(ph.key === 'update' && w1Before && w2Before){
      const updateT = easeInOut(Math.min(1, progress/0.5));
      w1Disp = lerpMatrix(w1Before, w1, updateT);
      w2Disp = lerpMatrix(w2Before, w2, updateT);
    }

    // Edges input->hidden
    drawEdges(allInHiddenPairs(), w1Disp,
      (ph.key==='forward' && phase1Half===1) ? fwdGlow : ((ph.key==='backward' && phase1Half===2) ? bwdGlow : null),
      (ph.key==='forward') ? 'fwd' : 'bwd'
    );
    // Edges hidden->output
    drawEdges(allHiddenOutPairs(), w2Disp,
      (ph.key==='forward' && phase1Half===2) ? fwdGlow : ((ph.key==='backward' && phase1Half===1) ? bwdGlow : null),
      (ph.key==='forward') ? 'fwd' : 'bwd'
    );

    // Always show the actual weight value on every connection, from the very first frame
    allInHiddenPairs().forEach(edge=> drawWeightLabel(edge.from, edge.to, 0.44, w1Disp[edge.wi][edge.wj]));
    allHiddenOutPairs().forEach(edge=> drawWeightLabel(edge.from, edge.to, 0.70, w2Disp[edge.wi][edge.wj]));

    if(ph.key === 'update' && w1Before && w2Before){
      drawDeltaLabels(progress);
    }

    // Node intensities depending on phase
    let inputInt = 1;
    let hiddenInt = hiddenAct.map(()=>0.15);
    let outputInt = outputProbs.map(()=>0.15);

    if(ph.key==='init'){
      hiddenInt = hiddenNodes.map(()=>0.1);
      outputInt = outputNodes.map(()=>0.1);
    } else if(ph.key==='forward'){
      if(phase1Half===1){ hiddenInt = hiddenAct.map((v)=> 0.15 + v*fwdGlow*0.85); }
      else { hiddenInt = hiddenAct.map((v)=> v); outputInt = outputProbs.map((p)=> 0.15 + p*fwdGlow*0.85); }
    } else if(ph.key==='error'){
      hiddenInt = hiddenAct.map((v)=>v);
      outputInt = outputProbs.map((p)=>p);
    } else if(ph.key==='backward'){
      hiddenInt = hiddenAct.map((v)=>v);
      outputInt = outputProbs.map((p)=>p);
    } else if(ph.key==='update'){
      hiddenInt = hiddenAct.map((v)=>v*0.6);
      outputInt = outputProbs.map((p)=>p*0.6);
    }

    // glows
    inputNodes.forEach((n)=> drawNodeGlow(n.x,n.y,16,1,'rgba(110,231,183,ALPHA)'));
    hiddenNodes.forEach((n,j)=> drawNodeGlow(n.x,n.y,15,hiddenInt[j],'rgba(110,231,183,ALPHA)'));
    outputNodes.forEach((n,k)=>{
      const isTrue = k===trueIdx;
      drawNodeGlow(n.x,n.y,17,outputInt[k], isTrue ? 'rgba(110,231,183,ALPHA)' : 'rgba(251,113,133,ALPHA)');
    });

    // nodes
    inputNodes.forEach((n,i)=> drawNode(n.x,n.y,16,1,'rgba(110,231,183,0.8)', inputLabels[i], 'left', inputs[i].toFixed(2)));
    hiddenNodes.forEach((n,j)=> drawNode(n.x,n.y,13,1,'rgba(241,237,251,0.35)', null, null, ph.key==='init'? '' : hiddenAct[j].toFixed(2)));
    outputNodes.forEach((n,k)=>{
      const isTrue = k===trueIdx;
      const highlightErr = (ph.key==='error'||ph.key==='backward'||ph.key==='update') && !isTrue;
      const stroke = isTrue ? 'rgba(110,231,183,0.9)' : (highlightErr ? 'rgba(251,113,133,0.9)' : 'rgba(241,237,251,0.35)');
      drawNode(n.x,n.y,17,1, stroke, outputLabels[k], 'right', ph.key==='init' ? '' : (outputProbs[k]*100).toFixed(0)+'%');
    });

    // what each hidden neuron currently "pays attention to"
    const w1ForRoles = (ph.key==='update') ? w1Disp : w1;
    hiddenNodes.forEach((n,j)=>{
      const role = hiddenRoleLabel(w1ForRoles[0][j], w1ForRoles[1][j]);
      drawRoleLabel(n.x, n.y + 30, role);
    });

    // how much influence each input currently carries (this DOES move with training,
    // unlike the fixed 0,92 / 0,70 value shown on the node itself)
    inputNodes.forEach((n,i)=>{
      const importance = w1ForRoles[i].reduce((s,v)=> s + Math.abs(v), 0);
      drawRoleLabel(n.x, n.y + 30, 'Importance donnée : ' + importance.toFixed(2));
    });

    // true label marker
    if(ph.key!=='init'){
      const tn = outputNodes[trueIdx];
      ctx.beginPath();
      ctx.arc(tn.x, tn.y, 24, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(110,231,183,0.55)';
      ctx.setLineDash([3,4]);
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '500 10px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(110,231,183,0.85)';
      ctx.textAlign='center';
      ctx.fillText('la bonne réponse', tn.x, tn.y+38);
    }

    drawSparkline();

    // bulles explicatives (par-dessus le réseau, dans la bande du bas)
    drawBubbles(ph.key, progress, now);
    updateScene(ph.key);

    // HUD text updates
    lossVal.textContent = loss===null ? '–' : loss.toFixed(3);
  }

  // ---------- Loop ----------
  function loop(now){
    render(now);
    requestAnimationFrame(loop);
  }

  function start(){
    fit();
    initModel();
    refreshCardUI();
    enterPhase(0, performance.now());
    requestAnimationFrame(loop);
  }

  // ---------- Controls ----------
  const resetBtn = document.getElementById('resetBtn');
  const themeTitleEl = document.getElementById('themeTitle');
  const themeIntroEl = document.getElementById('themeIntro');
  const allIconIds = ['iconCatPos','iconCatNeg','iconLungsPos','iconLungsNeg','iconMolePos','iconMoleNeg','iconBonePos','iconBoneNeg'];

  function refreshCardUI(){
    const theme = themes[currentTheme];
    const c = theme.cases[currentCase];

    allIconIds.forEach(id=>{
      document.getElementById(id).classList.toggle('hidden', id !== c.icon);
    });
    setSceneIcon(c.icon);
    sceneKey = '';
    document.querySelector('.example-text').innerHTML =
      'Carte montrée à l\'IA : <b>' + c.traitText + '</b><br>' +
      'Vraie réponse (' + theme.trueLabelWho + ') : <b style="color:var(--mint)">' + outputLabels[trueIdx] + '</b>';

    document.querySelectorAll('.theme-btn').forEach(b=> b.classList.toggle('active', b.dataset.theme === currentTheme));
    const btnPositif = document.getElementById('btnPositif');
    const btnNormal = document.getElementById('btnNormal');
    btnPositif.textContent = theme.cases.positif.label;
    btnNormal.textContent = theme.cases.normal.label;
    document.querySelectorAll('#btnPositif, #btnNormal').forEach(b=>{
      b.classList.toggle('active', b.dataset.case === currentCase);
    });

    themeTitleEl.textContent = theme.titleText;
    themeIntroEl.textContent = theme.introText;
  }

  function setCase(caseName){
    currentCase = caseName;
    const c = themes[currentTheme].cases[caseName];
    inputs = c.inputs;
    trueIdx = c.trueIdx;
    refreshCardUI();
  }

  function setTheme(themeName){
    currentTheme = themeName;
    currentCase = 'positif';
    const theme = themes[themeName];
    inputLabels = theme.inputLabels;
    outputLabels = theme.outputLabels;
    inputs = theme.cases.positif.inputs;
    trueIdx = theme.cases.positif.trueIdx;

    // Nouveau domaine = nouveau réseau : les anciens poids n'ont plus de sens ici.
    initModel();
    firstCycle = true;
    refreshCardUI();
    enterPhase(0, performance.now());
  }

  document.querySelectorAll('.theme-btn').forEach(b=>{
    b.addEventListener('click', ()=> setTheme(b.dataset.theme));
  });
  document.querySelectorAll('#btnPositif, #btnNormal').forEach(b=>{
    b.addEventListener('click', ()=> setCase(b.dataset.case));
  });


  // Icône « suite » dessinée dans la bulle : clic (ou toucher) sur la colonne de droite
  function canvasPoint(e){
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * LOGICAL_W / r.width, y: (e.clientY - r.top) * LOGICAL_H / r.height };
  }
  function overHit(pt){
    return bubbleHit && pt.x >= bubbleHit.x && pt.x <= bubbleHit.x + bubbleHit.w && pt.y >= bubbleHit.y && pt.y <= bubbleHit.y + bubbleHit.h;
  }
  canvas.addEventListener('click', (e)=>{ if(overHit(canvasPoint(e))) nextBubble(); });
  canvas.addEventListener('mousemove', (e)=>{ canvas.style.cursor = overHit(canvasPoint(e)) ? 'pointer' : 'default'; });
  document.addEventListener('keydown', (e)=>{
    // flèche droite = « suite » (pratique en classe, sans la souris)
    if(e.key === 'ArrowRight' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) nextBubble();
  });

  resetBtn.addEventListener('click', ()=>{
    initModel();
    firstCycle = true;
    enterPhase(0, performance.now());
  });

  start();
})();
</script>
</body>
</html>
