<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeux sérieux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#152720;
    --panel:#1c332a;
    --chalk:#f4f0e2;
    --chalk-dim:#b9c2b6;
    --accent:#e8c468;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:40px 20px;
    background:var(--bg);
    color:var(--chalk);
    font-family:'Nunito Sans',system-ui,sans-serif;
  }
  h1{
    font-family:'Kalam',cursive;
    font-size:2rem;
    margin:0;
    text-align:center;
  }
  .back{
    color:var(--chalk-dim);
    text-decoration:none;
    font-size:.9rem;
    margin-top:-14px;
    margin-bottom:14px;
  }
  .back:hover{color:var(--accent);}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:18px;
    width:100%;
    max-width:640px;
    margin-top:28px;
  }
  a.card{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:24px;
    border-radius:14px;
    background:var(--panel);
    border:1px solid rgba(244,240,228,.14);
    color:var(--chalk);
    text-decoration:none;
    transition:border-color .15s, transform .1s;
  }
  a.card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
  }
  a.card .emoji{font-size:1.8rem;}
  a.card .name{font-weight:800; font-size:1.1rem;}
  a.card .desc{color:var(--chalk-dim); font-size:.9rem; line-height:1.4;}
  .site-logo{
    position:fixed;
    top:16px;
    left:16px;
    z-index:10;
  }
  .site-logo img{
    display:block;
    height:36px;
    width:auto;
  }
</style>
</head>
<body>
  <a class="site-logo" href="index.html">
    <img src="logo-blanc.png" alt="Atelier Chalou">
  </a>
  <a class="back" href="index.html">← Retour à l'accueil</a>
  <h1>🎲 Jeux sérieux</h1>
  <div class="grid">
    <a class="card" href="jeu-plateau-techno-5eme.html" target="_blank" rel="noopener">
      <span class="emoji">🎲</span>
      <span class="name">TechnoQuest</span>
      <span class="desc">Jeu de plateau pour réviser la technologie en 5ème.</span>
    </a>
  </div>
</body>
</html>
