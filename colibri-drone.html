<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import ManifoldModule from 'manifold-3d';

/* ================= Géométrie (Manifold) ================= */
function makeGeom(M){
const {Manifold, CrossSection} = M;
let bin = [];
const keep = m => (bin.push(m), m);
const flush = () => { bin.forEach(m => { try { m.delete(); } catch(e) {} }); bin = []; };
const num = v => { if (v === null || v === undefined) return NaN; const s = String(v).trim().replace(',', '.'); return s === '' ? NaN : Number(s); };
const rect = (x0, y0, x1, y1) => keep(keep(CrossSection.square([x1 - x0, y1 - y0], false)).translate([x0, y0]));
const circ = (x, y, r, n = 64) => keep(keep(CrossSection.circle(r, n)).translate([x, y]));
const rrect = (x0, y0, x1, y1, r) => keep(keep(CrossSection.square([x1 - x0 - 2*r, y1 - y0 - 2*r], false)).translate([x0 + r, y0 + r]).offset(r, 'Round', 2, 40));
const sub = (a, ...l) => { let r = a; for (const b of l) r = keep(r.subtract(b)); return r; };
const add = (a, ...l) => { let r = a; for (const b of l) r = keep(r.add(b)); return r; };
const extr = (cs, z0, z1) => keep(keep(Manifold.extrude(cs, z1 - z0)).translate([0, 0, z0]));
const cylZ = (r, z0, z1, x, y, n = 48) => keep(keep(Manifold.cylinder(z1 - z0, r, r, n, false)).translate([x, y, z0]));
const sub3 = (a, ...l) => { let r = a; for (const b of l) r = keep(r.subtract(b)); return r; };
const add3 = (a, ...l) => { let r = a; for (const b of l) r = keep(r.add(b)); return r; };
const mv = (m, v) => keep(m.translate(v));

/* ---------- Drone Colibri ---------- */
const DR = {bw:54, bh:44, aw:12, hs:10, sy:16, sl:28, sw:3, swx:-21, post:10, base:3, cup:9, deckH:12};
function droneDims(S, f){
  const h = k => { const v = num(S.holes[k]); return isFinite(v) && v > 0 ? v : num(S.comp[k]) + .3; };
  const diag = S.opt.diag, m = diag / 2 / Math.SQRT2, dm = h('motor'), ds = h('screw'), dsw = h('sw');
  const Rend = Math.max(dm / 2 + 3, 7.5);
  const mot = [[m, m], [m, -m], [-m, -m], [-m, m]];
  return {diag, m, dm, ds, dsw, Rend, mot, prop:diag / Math.SQRT2 - 6};
}
function droneOutline(S){
  const d = droneDims(S); let cs = rrect(-DR.bw/2, -DR.bh/2, DR.bw/2, DR.bh/2, 8);
  for (const [x, y] of d.mot) {
    const L = Math.hypot(x, y), ang = Math.atan2(y, x) * 180 / Math.PI;
    const arm = keep(keep(keep(CrossSection.square([L, DR.aw], false)).translate([0, -DR.aw/2])).rotate(ang));
    cs = add(cs, arm, circ(x, y, d.Rend));
  }
  return cs;
}
const standoffHoles = d => [[DR.hs, DR.hs], [DR.hs, -DR.hs], [-DR.hs, -DR.hs], [-DR.hs, DR.hs]].map(([x, y]) => circ(x, y, d.ds / 2, 32));
function droneHoles(S, {motors = true, slots = true, standoffs = true, sw = true} = {}){
  const d = droneDims(S), l = [];
  if (motors) d.mot.forEach(([x, y]) => l.push(circ(x, y, d.dm / 2)));
  if (standoffs) l.push(...standoffHoles(d));
  if (slots) for (const s of [-1, 1]) l.push(rect(-DR.sl/2, s*DR.sy - DR.sw/2, DR.sl/2, s*DR.sy + DR.sw/2));
  if (sw) l.push(circ(DR.swx, 0, d.dsw / 2, 32));
  return l;
}
const droneLayers = t => Math.max(1, Math.ceil(8 / t));
function droneLaser(S){
  const t = S.ply, d = droneDims(S), k = droneLayers(t);
  const plates = [{id:'cadre', name:'Cadre', cs:sub(droneOutline(S), ...droneHoles(S, {sw:false})), t, group:'cadre', place:b => b}];
  d.mot.forEach(([x, y], i) => {
    for (let j = 1; j < k; j++) plates.push({id:`bague_m${i + 1}_${j}`, name:`Bague M${i + 1}`, ring:true, cs:sub(circ(x, y, d.Rend), circ(x, y, d.dm / 2)), t, group:'bague', j, place:b => mv(b, [0, 0, j * t])});
  });
  plates.push({id:'platine', name:'Platine', cs:sub(rrect(-DR.bw/2, -DR.bh/2, DR.bw/2, DR.bh/2, 8), ...standoffHoles(d), circ(DR.swx, 0, d.dsw / 2, 32)), t, group:'platine', place:b => mv(b, [0, 0, t + DR.deckH])});
  return plates;
}
function dronePrint(S){
  const d = droneDims(S);
  let solid = extr(droneOutline(S), 0, DR.base);
  d.mot.forEach(([x, y]) => { solid = add3(solid, cylZ(d.Rend, 0, DR.cup, x, y)); });
  [[DR.hs, DR.hs], [DR.hs, -DR.hs], [-DR.hs, -DR.hs], [-DR.hs, DR.hs]].forEach(([x, y]) => { solid = add3(solid, cylZ(d.ds / 2 + 2.2, 0, DR.base + DR.post, x, y, 32)); });
  const holes = droneHoles(S);
  const cut = holes.reduce((a, h) => a ? add(a, h) : h, null);
  const man = sub3(solid, extr(cut, -1, DR.base + DR.post + 1));
  return [{id:'cadre', name:'Cadre du drone', man, group:'cadre', file:'cadre', bed:(x, y, z) => [x, y, z]}];
}

/* ---------- Boîtier de la manette ---------- */
const RB = {L:150, W:84, H:30, wall:2.4, floor:2.4, lid:2.4, lip:3, r:8, post:[[7, -35], [7, 35], [143, -35], [143, 35]],
  pos:{joyL:[38, 0], joyR:[112, 0], arm:[75, -20], led:[75, 1], pwr:[75, 22]}};
function boxPrint(S){
  const h = k => { const v = num(S.holes[k]); return isFinite(v) && v > 0 ? v : num(S.comp[k]) + .3; };
  const {L, W, H, wall, floor, lid, lip, r} = RB;
  let tub = sub3(extr(rrect(0, -W/2, L, W/2, r), 0, H), extr(rrect(wall, -W/2 + wall, L - wall, W/2 - wall, r - wall), floor, H + 1));
  for (const [x, y] of RB.post) tub = add3(tub, cylZ(4.4, floor - .1, H - .5, x, y, 32));
  for (const [x, y] of RB.post) tub = sub3(tub, cylZ(1.3, H - 14, H + 1, x, y, 20));
  let lidM = extr(rrect(0, -W/2, L, W/2, r), H, H + lid);
  const ring = sub(rrect(wall + .3, -W/2 + wall + .3, L - wall - .3, W/2 - wall - .3, r - wall), rrect(wall + 2.3, -W/2 + wall + 2.3, L - wall - 2.3, W/2 - wall - 2.3, Math.max(1, r - wall - 2)));
  const notches = RB.post.map(([x, y]) => circ(x, y, 5.6, 32));
  lidM = add3(lidM, extr(sub(ring, ...notches), H - lip, H + .01));
  const holes = [circ(...RB.pos.joyL, h('joy') / 2), circ(...RB.pos.joyR, h('joy') / 2), circ(...RB.pos.arm, h('arm') / 2), circ(...RB.pos.led, h('led') / 2), circ(...RB.pos.pwr, h('pwr') / 2), ...RB.post.map(([x, y]) => circ(x, y, 1.75, 24))];
  const cut = holes.reduce((a, b) => add(a, b));
  lidM = sub3(lidM, extr(cut, H - lip - 1, H + lid + 1));
  return [
    {id:'cuve', name:'Cuve', man:tub, group:'cuve', file:'cuve', bed:(x, y, z) => [x, y, z]},
    {id:'couvercle', name:'Couvercle', man:lidM, group:'couvercle', file:'couvercle', bed:(x, y, z) => [x, -y, H + lid - z]}
  ];
}
return {DR, droneDims, droneLaser, dronePrint, RB, boxPrint, flush, keep, num, droneLayers};
}

/* ================= Sorties : STL, ZIP, téléchargement ================= */
function toGeometry(m){
  const mesh = m.getMesh(), np = mesh.numProp, vp = mesh.vertProperties, tv = mesh.triVerts;
  const pos = new Float32Array(tv.length * 3);
  for (let i = 0; i < tv.length; i++) { const v = tv[i] * np; pos[i*3] = vp[v]; pos[i*3 + 1] = vp[v + 1]; pos[i*3 + 2] = vp[v + 2]; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.computeVertexNormals();
  return g;
}
function stlMulti(list, head){
  const n = list.reduce((s, it) => s + it.geo.attributes.position.count / 3, 0);
  const buf = new ArrayBuffer(84 + 50 * n), dv = new DataView(buf);
  for (let i = 0; i < 80; i++) dv.setUint8(i, i < head.length ? head.charCodeAt(i) : 32);
  dv.setUint32(80, n, true);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), nn = new THREE.Vector3(), e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
  let o = 84;
  for (const {geo, map} of list) {
    const pos = geo.attributes.position, m = pos.count / 3;
