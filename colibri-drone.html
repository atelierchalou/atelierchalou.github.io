<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colibri, drone quadricoptère Arduino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>

/* Layout: stand de tir en bandeau, puis organigramme (gauche) et programme Arduino collant (droite) */
:root{
  --paper:#edf2f1; --grid:rgba(20,70,80,.07); --ink:#15232c; --muted:#56696f; --line:#c3cfd1;
  --surface:#ffffff; --node-empty:#f8fbfa; --node-solved:#dcf0ec; --node-run:#ffe0e3;
  --teal:#00737b; --teal-ink:#ffffff; --laser:#d4213a; --ok:#1c8650; --bad:#b3261e;
  --code-bg:#0f1b21; --code-fg:#d9e5e7; --code-dim:#5f7680; --code-line:#1c2b33; --vp-bg:#dfe7e6;
  --f-display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1418; --grid:rgba(150,200,210,.05); --ink:#e2eaec; --muted:#93a5ab; --line:#2b3a41;
  --surface:#151f25; --node-empty:#131c21; --node-solved:#113935; --node-run:#4a1820;
  --teal:#35bcc4; --teal-ink:#06181b; --laser:#ff4d61; --ok:#46c985; --bad:#ff6b61;
  --code-bg:#0a1216; --code-line:#16232a; --vp-bg:#0b1317; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1418; --grid:rgba(150,200,210,.05); --ink:#e2eaec; --muted:#93a5ab; --line:#2b3a41;
  --surface:#151f25; --node-empty:#131c21; --node-solved:#113935; --node-run:#4a1820;
  --teal:#35bcc4; --teal-ink:#06181b; --laser:#ff4d61; --ok:#46c985; --bad:#ff6b61;
  --code-bg:#0a1216; --code-line:#16232a; --vp-bg:#0b1317; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* En-tête */
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.top .intro{min-width:0;flex:1 1 420px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;color:var(--teal);margin:0 0 4px;font-weight:600}
h1{font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:.01em}
.lede{margin:8px 0 0;color:var(--muted);max-width:62ch}
.progress{display:flex;flex-direction:column;gap:6px;min-width:240px;flex:0 1 300px}
.progress .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;font-size:14px}
.progress b{font-family:var(--f-display);font-size:18px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s ease}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:13px}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

/* Stand de tir : panneau volontairement sombre dans les deux thèmes */
.range{background:#0c1419;color:#d7e2e6;border-radius:12px;overflow:hidden;border:1px solid #22323b}
.range-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:baseline;padding:14px 18px 0}
.range-head h2{font-size:20px;color:#fff}
.range-head p{margin:0;font-size:13.5px;color:#8ea3ab}
#t-sim,#r-sim,#l-sim,#s-sim{display:block;width:100%;height:clamp(220px,32vw,320px);cursor:crosshair}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px 16px;border-top:1px solid #1d2b33}
.seg{display:flex;border:1px solid #33454f;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#b8c7cd;padding:8px 12px;font-family:var(--f-display);font-weight:600;font-size:14px}
.seg button+button{border-left:1px solid #33454f}
.seg button[aria-pressed="true"]{background:#233640;color:#fff}
.btn{border:0;border-radius:8px;padding:9px 16px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.03em}
.btn-fire{background:#d4213a;color:#fff}
.btn-fire:active{transform:translateY(1px)}
.btn-reload{background:#2f8fd0;color:#fff}
.btn-plain{background:transparent;color:#b8c7cd;border:1px solid #33454f}
.kbd{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:6px;font-weight:400}
.readout{margin-left:auto;display:flex;gap:14px;align-items:center;font-family:var(--f-mono);font-size:14px;color:#9fb3ba}
.readout b{color:#fff;font-size:18px}
.simmsg{padding:0 18px 14px;margin:-6px 0 0;font-size:14px;color:#9fb3ba;min-height:1.5em}
.legend-sim{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:#8ea3ab}
.legend-sim span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}

/* Zone de travail */
.work{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.work{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:20px}
.shapes{display:flex;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.shapes svg{vertical-align:middle;margin-right:5px}
.flow-scroll{overflow-x:auto;padding:8px 8px 14px}
#flow,#c-flow,#u-flow{display:block;width:100%;min-width:470px;max-width:600px;margin:0 auto;height:auto}
.tip{margin:0;padding:0 18px 14px;font-size:13.5px;color:var(--muted)}

/* SVG organigramme */
.edge{fill:none;stroke:var(--muted);stroke-width:1.6}
.arrowhead{fill:var(--muted)}
.dot{fill:var(--muted)}
.elbl{font-family:var(--f-display);font-weight:600;font-size:12.5px;fill:var(--teal)}
.anno{font-family:var(--f-body);font-size:11.5px;fill:var(--muted)}
.terminal rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.terminal text{font-family:var(--f-display);font-weight:600;font-size:14px;fill:var(--ink)}
.node{cursor:pointer}
.node .shape{fill:var(--node-empty);stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 4;transition:fill .25s,stroke .25s}
.node:hover .shape,.node:focus-visible .shape{stroke:var(--laser);stroke-dasharray:none;stroke-width:2.2}
.node:focus{outline:none}
.node .q{font-family:var(--f-display);font-weight:700;font-size:21px;fill:var(--muted)}
.node .lbl{font-family:var(--f-body);font-size:13.5px;fill:var(--ink);font-weight:700}
.node .badge circle{fill:var(--muted)}
.node .badge text{font-family:var(--f-display);font-size:11.5px;font-weight:700;fill:var(--surface)}
.node.solved{cursor:default}
.node.solved .shape{fill:var(--node-solved);stroke:var(--teal);stroke-dasharray:none;stroke-width:1.8}
.node.solved .badge circle{fill:var(--teal)}
.node.solved:hover .shape{stroke:var(--teal);stroke-width:1.8}
.node.run .shape{fill:var(--node-run);stroke:var(--laser);stroke-width:2.6;stroke-dasharray:none}
.node.pop .shape{animation:pop .5s ease}
@keyframes pop{0%{stroke-width:6}100%{stroke-width:1.8}}

/* Programme */
.code-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;max-height:calc(100vh - 24px);overflow:hidden;background:var(--code-bg);border-color:var(--code-line)}
@media (max-width:920px){.code-panel{position:static;max-height:none}}
.code-panel .panel-head{border-bottom-color:var(--code-line)}
.code-panel h2{color:#fff}
.code-sub{margin:2px 0 0;font-size:13px;color:#8ea3ab}
.btn-copy{background:#00979d;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-family:var(--f-display);font-weight:700;font-size:14.5px}
.btn-copy:disabled{background:#26363e;color:#71858d;cursor:not-allowed}
.code-body{overflow:auto;padding:10px 0 14px;font-family:var(--f-mono);font-size:13px;line-height:1.62;color:var(--code-fg);min-height:0}
.ln{display:flex;white-space:pre;padding-right:14px;transition:background .6s}
.ln .no{flex:0 0 3.2em;text-align:right;padding-right:1em;color:var(--code-dim);user-select:none;font-variant-numeric:tabular-nums}
.ln .tx{flex:1 0 auto}
.ln.fresh{background:rgba(0,151,157,.28)}
.ln.run{background:rgba(212,33,58,.3)}
.mask{display:inline-block;height:1.05em;vertical-align:-.15em;border-radius:3px;background:repeating-linear-gradient(135deg,#1d2c34 0 6px,#172329 6px 12px);position:relative}
.mask em{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-style:normal;font-size:10.5px;color:#6f8790;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.k{color:#5fb8ff}.f{color:#f0a04b}.c{color:#4fd1c5}.n{color:#c9a3ff}.cm{color:#6f8790;font-style:italic}
.code-foot{border-top:1px solid var(--code-line);padding:10px 18px;font-size:13px;color:#8ea3ab}
.code-dl{border-top:1px solid var(--code-line);padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.code-dl small{color:#8ea3ab;font-size:13px}
.test-block{margin-top:1rem;padding-top:.8rem;border-top:1px dashed var(--line)}.test-block h3{margin:0 0 .3rem}.test-btns{display:flex;flex-wrap:wrap;gap:8px;margin:.5rem 0}.test-btns .btn-flash{width:auto}.test-btns .btn-plain{color:var(--ink);background:var(--surface);border:1.5px solid var(--teal);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
#codeRaw,#c-codeRaw,#u-codeRaw{width:100%;height:160px;font-family:var(--f-mono);font-size:12px;background:#0f1b21;color:#d9e5e7;border:1px solid #33454f;border-radius:6px;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-family:var(--f-display);font-weight:600;letter-spacing:.04em}
.pill.wait{background:#1d2c34;color:#8ea3ab}
.pill.done{background:#1c8650;color:#fff}

/* Section téléversement */
.upload{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.upload .panel{padding:16px 18px}
.upload h2{font-size:19px;margin-bottom:10px}
.upload ol,.upload ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.upload p{margin:10px 0 0;font-size:14.5px;color:var(--muted);max-width:65ch}
.upload a{color:var(--teal)}
.pins{width:100%;border-collapse:collapse;font-size:14.5px}
.pins td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pins td:first-child{font-family:var(--f-mono);font-weight:600;white-space:nowrap;color:var(--teal)}
.menu{font-family:var(--f-mono);font-size:13.5px;background:var(--node-solved);padding:0 4px;border-radius:3px}
.safety{border-left:3px solid var(--laser);padding-left:10px}
.boards{border:0;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
.boards legend{font-size:14px;color:var(--muted);margin-bottom:6px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--teal);background:var(--node-solved)}
.opt input{margin-top:4px;accent-color:var(--teal)}
.opt span{display:flex;flex-direction:column;min-width:0}
.opt small{color:var(--muted);font-size:13px}
.btn-flash{width:100%;background:var(--teal);color:var(--teal-ink);border:0;border-radius:8px;padding:11px 14px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.03em}
.btn-flash:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.fbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.fbar i{display:block;height:100%;width:0;background:var(--teal);transition:width .15s}
.fbar.ok i{background:var(--ok)} .fbar.err i{background:var(--bad)}
.upload .flash-msg{color:var(--ink);font-weight:700;margin-top:8px}
.flash-msg.ok{color:var(--ok)} .flash-msg.err{color:var(--bad)}

/* Fenêtre de choix */
.sheet{position:fixed;inset:0;background:rgba(6,12,16,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet-card{background:var(--surface);color:var(--ink);border-radius:14px;max-width:480px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 32px);overflow:auto}
.sheet-kind{margin:0;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px}
.sheet-card h3{font-size:19px;font-family:var(--f-body);font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:10px;text-align:left;background:var(--node-empty);border:1.5px solid var(--line);color:var(--ink);border-radius:9px;padding:11px 14px;font-weight:700;font-size:15px}
.choice:hover:not(:disabled){border-color:var(--teal)}
.choice.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through;opacity:.75;animation:shake .35s}
.choice.right{border-color:var(--ok);background:var(--node-solved)}
.choice svg{flex:0 0 auto}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{margin:0;font-size:14.5px;color:var(--bad);min-height:1.4em}
.hint.ok{color:var(--ok)}
.sheet-foot{display:flex;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .readout{margin-left:0;width:100%}
  .wrap{padding-inline:16px}
}

/* Onglets des modules */
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px 10px 4px;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted)}
.tabs button span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--ink);font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.tabs button[aria-selected="true"] span{background:var(--teal);color:var(--teal-ink)}
.module{display:flex;flex-direction:column;gap:20px}
.mod-intro{margin:0;color:var(--muted);max-width:70ch}

/* Modeleur : configuration */
.cad-setup{padding:18px}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.bigchoice{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.bigchoice legend{font-family:var(--f-display);font-weight:700;font-size:18px;margin-bottom:10px;padding:0}
.card-opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--node-empty)}
.card-opt:has(input:checked){border-color:var(--teal);background:var(--node-solved)}
.card-opt input{margin-top:5px;accent-color:var(--teal)}
.co-body{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;min-width:0}
.co-body b{font-size:16.5px}
.co-body small{grid-column:1/-1;color:var(--muted);font-size:14px}
.co-body:not(:has(.co-ic)) b,.co-body:not(:has(.co-ic)) small{grid-column:1/-1}
.co-ic{width:40px;height:28px;color:var(--ink);grid-row:1}
.setup-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:16px}
.setup-foot p{margin:0;color:var(--muted)}
.btn-auto{width:auto;padding-inline:28px}

.cad-bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 16px;font-size:15px}
.cad-bar .ghost{margin-left:auto}
.pill.warn{background:var(--node-run);color:var(--bad)}
.cad-work{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:20px;align-items:start}
@media (max-width:960px){.cad-work{grid-template-columns:minmax(0,1fr)}}

/* Vue 3D */
.vp-panel{overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:960px){.vp-panel{position:static}}
.vp-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.seg2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{background:transparent;border:0;padding:6px 11px;font-family:var(--f-display);font-weight:600;font-size:13.5px;color:var(--muted)}
.seg2 button+button{border-left:1px solid var(--line)}
.seg2 button:hover{color:var(--ink);background:var(--node-empty)}
.tog{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--teal)}
.vp{position:relative;height:clamp(340px,58vh,600px);background:var(--vp-bg);touch-action:none}
.vp canvas{display:block;width:100%;height:100%}
.vp-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted);font-size:15px}
.vp-help{margin:0;padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.ax-x{color:#e5484d}.ax-y{color:#30a46c}.ax-z{color:#3e63dd}

/* Panneau latéral */
.cad-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side-block{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.side-block h3{font-size:18px}
.side-block h4{margin:6px 0 0;font-family:var(--f-display);font-size:15px}
.proc-note{margin:0;font-size:14px;color:var(--muted);background:var(--node-empty);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.easy-list{display:flex;flex-direction:column;gap:8px}
.hole-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px}
.hole-row.ok{border-color:var(--ok)}
.hole-row.bad{border-color:var(--bad)}
.hr-name b{display:block;font-size:15px}
.hr-name small{color:var(--muted);font-size:13px}
.hr-in{display:flex;align-items:center;gap:6px;font-size:14px}
.hr-in input,.sizes .other input{width:5.2em;font:inherit;font-family:var(--f-mono);font-size:14.5px;padding:5px 7px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);text-align:right}
.hr-in input:focus,.sizes .other input:focus{border-color:var(--teal);outline:none}
.sizes{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sizes button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px;font-family:var(--f-mono);font-size:13px}
.sizes button:hover{border-color:var(--teal)}
.sizes button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.sizes.big button{font-size:14.5px;padding:6px 14px}

const TEST_MOTEURS = `// Essai des moteurs : chaque moteur tourne 1 seconde à 30 %, l'un après l'autre.
// HÉLICES RETIRÉES ! Alimente par la batterie, drone fixé ou tenu hors d'atteinte.
// Ordre attendu : M1 (avant-gauche), M2 (avant-droit), M3 (arrière-droit), M4 (arrière-gauche).
const int MOTEUR[4] = {3, 5, 6, 9};

void setup() {
  for (int i = 0; i < 4; i++) {
    pinMode(MOTEUR[i], OUTPUT);
    analogWrite(MOTEUR[i], 0);
  }
  delay(3000);                       // 3 secondes pour s'écarter
}

void loop() {
  for (int i = 0; i < 4; i++) {
    analogWrite(MOTEUR[i], 77);      // 77 sur 255 = 30 %
    delay(1000);
    analogWrite(MOTEUR[i], 0);
    delay(500);
  }
}
`;
const TEST_JOYSTICKS = `// Essai des joysticks : affiche les 4 axes dans le moniteur série (9600 bauds).
// Au repos, chaque axe doit afficher environ 512. Pousse le joystick : il va de 0 à 1023.
void setup() {
  Serial.begin(9600);
  pinMode(2, INPUT_PULLUP);
}

void loop() {
  Serial.print("gaz ");     Serial.print(analogRead(A0));
  Serial.print("  lacet "); Serial.print(analogRead(A1));
  Serial.print("  tangage "); Serial.print(analogRead(A2));
  Serial.print("  roulis ");  Serial.print(analogRead(A3));
  Serial.print("  ARM ");     Serial.println(digitalRead(2) == LOW ? "ON" : "OFF");
  delay(200);
}
`;

const $g = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastT;
function toast(msg){ const t = $g('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
const lsGet = (k, d) => { try { const s = JSON.parse(localStorage.getItem(k) || 'null'); return s === null ? d : s; } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
function downloadText(name, text){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'}), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ================= Module « Programmer » : organigramme + programme Arduino ================= */
function ProgramModule(P, cfg){
  const {NODES, EDGES, DOTS, CODE} = cfg, TOTAL = NODES.length;
  NODES.forEach(n => { n.w = n.w || (n.type === 'rect' ? 224 : 236); n.h = n.h || (n.type === 'rect' ? 48 : 92); });
  const rawCode = () => CODE.map(c => c[1]).join('\n') + '\n';
  const KEY = cfg.key;
  let solved = new Set(), errors = 0;
  { const s = lsGet(KEY, null); if (s) { solved = new Set(s.solved || []); errors = s.errors || 0; } }
  const save = () => lsSet(KEY, {solved:[...solved], errors});
  const $ = id => $g(P + id);

  /* ---------- Organigramme SVG ---------- */
  const svg = $('flow'), nodeEls = {};
  function buildFlow(){
    const defs = svgEl('defs', {}, svg);
    const m = svgEl('marker', {id:P + 'arr', viewBox:'0 0 10 10', refX:'9', refY:'5', markerWidth:'8', markerHeight:'8', orient:'auto-start-reverse'}, defs);
    svgEl('path', {d:'M0,0 L10,5 L0,10 z', class:'arrowhead'}, m);
    EDGES.forEach(e => {
      svgEl('polyline', {points:e.p.map(p => p.join(',')).join(' '), class:'edge', ...(e.a ? {'marker-end':`url(#${P}arr)`} : {})}, svg);
      if (e.l) { const t = svgEl('text', {x:e.l[1], y:e.l[2], class:'elbl', 'text-anchor':e.l[3] || 'start'}, svg); t.textContent = e.l[0]; }
    });
    DOTS.forEach(d => svgEl('circle', {cx:d[0], cy:d[1], r:3.2, class:'dot'}, svg));
    (cfg.annos || []).forEach(a => { const t = svgEl('text', a.rot ? {x:a.x, y:a.y, class:'anno', transform:`rotate(-90 ${a.x} ${a.y})`, 'text-anchor':'middle'} : {x:a.x, y:a.y, class:'anno'}, svg); t.textContent = a.t; });
    const term = svgEl('g', {class:'terminal'}, svg);
    svgEl('rect', {x:220, y:22, width:120, height:36, rx:18}, term);
    const tt = svgEl('text', {x:280, y:45, 'text-anchor':'middle'}, term); tt.textContent = 'Début';
    NODES.forEach(n => {
      const g = svgEl('g', {class:'node', tabindex:'0', role:'button', 'data-id':n.id}, svg);
      if (n.type === 'rect') svgEl('rect', {class:'shape', x:n.cx - n.w/2, y:n.cy - n.h/2, width:n.w, height:n.h, rx:3}, g);
      else svgEl('polygon', {class:'shape', points:`${n.cx},${n.cy - n.h/2} ${n.cx + n.w/2},${n.cy} ${n.cx},${n.cy + n.h/2} ${n.cx - n.w/2},${n.cy}`}, g);
      const bx = n.type === 'rect' ? n.cx - n.w/2 : n.cx - n.w/2 + 14, by = n.type === 'rect' ? n.cy - n.h/2 : n.cy - n.h/2 + 10;
      const b = svgEl('g', {class:'badge'}, g);
      svgEl('circle', {cx:bx, cy:by, r:10.5}, b);
      const bt = svgEl('text', {x:bx, y:by + 4, 'text-anchor':'middle'}, b); bt.textContent = n.id;
      const txt = svgEl('g', {class:'txt'}, g);
      nodeEls[n.id] = {g, txt};
      const ic = svgEl('g', {class:'info-ic', tabindex:'0', role:'button', 'aria-label':`Explication du bloc ${n.id}`}, g);
      const [icx, icy] = n.ic || [Math.max(14, n.cx - n.w/2 - 17), n.cy];
      svgEl('circle', {cx:icx, cy:icy, r:10}, ic);
      const it = svgEl('text', {x:icx, y:icy + 4.5, 'text-anchor':'middle'}, ic); it.textContent = 'i';
      ic.addEventListener('click', e => { e.stopPropagation(); openInfo(n); });
      ic.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInfo(n); } });
      g.addEventListener('click', () => openSheet(n));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(n); } });
      paintNode(n);
    });
  }
  function showInfo(kind, title, html, codeHtml){
    $g('infoKind').textContent = kind; $g('infoTitle').textContent = title; $g('infoBody').innerHTML = html;
    const c = $g('infoCode'); c.hidden = !codeHtml; c.innerHTML = codeHtml || '';
    $g('infoSheet').hidden = false; $g('infoClose').focus();
  }
  function openInfo(n){
    const done = solved.has(n.id), kind = n.type === 'rect' ? 'action' : 'test';
    const lines = CODE.filter(c => c[0] === n.id).map(c => c[1]);
    let html = `<p>${n.info || ''}</p><p class="info-meta">${n.type === 'rect' ? 'Rectangle : une action' : 'Losange : un test, avec une sortie Oui et une sortie Non'}.</p>`;
    let code = '';
    if (done) code = '<p class="info-cap">Dans le programme Arduino :</p>' + lines.map(l => `<div class="ln"><span class="tx">${hl(l) || ' '}</span></div>`).join('');
    else html += '<p class="info-meta">Réponds d’abord au quiz de ce bloc : les lignes de code correspondantes s’afficheront ici.</p>';
    showInfo(`Bloc ${n.id} · ${kind}`, done ? n.label.join(' ') : 'Bloc à compléter', html, code);
  }
  $('flowInfo').addEventListener('click', () => showInfo('Mode d’emploi', 'Comment lire cet organigramme', cfg.guide.map(t => `<p>${t}</p>`).join(''), ''));
  function paintNode(n){
    const {g, txt} = nodeEls[n.id];
    txt.innerHTML = '';
    const isSolved = solved.has(n.id), kind = n.type === 'rect' ? 'action' : 'test';
    g.classList.toggle('solved', isSolved);
    if (isSolved) {
      const lh = 16, y0 = n.cy - (n.label.length - 1) * lh/2 + 5;
      n.label.forEach((s, i) => { const t = svgEl('text', {x:n.cx, y:y0 + i*lh, 'text-anchor':'middle', class:'lbl'}, txt); t.textContent = s; });
      g.setAttribute('aria-label', `Bloc ${n.id}, ${kind} : ${n.label.join(' ')}`);
    } else {
      const t = svgEl('text', {x:n.cx, y:n.cy + 7, 'text-anchor':'middle', class:'q'}, txt); t.textContent = '?';
      g.setAttribute('aria-label', `Bloc ${n.id}, ${kind} à compléter`);
    }
  }

  /* ---------- Code ---------- */
  const codeBox = $('code'), lineEls = [];
  const KW = /(#include|\b(?:const|int|int16_t|long|byte|float|unsigned|struct|void|if|else|while|for|return|RF24|bool)\b)|\b(pinMode|digitalWrite|digitalRead|analogRead|analogWrite|delay|delayMicroseconds|micros|millis|setup|loop|begin|beginTransmission|endTransmission|requestFrom|setClock|openWritingPipe|openReadingPipe|setPALevel|stopListening|startListening|available|read|write|abs|sizeof|map|constrain|atan2|sqrt|print|println)\b|\b(HIGH|LOW|INPUT_PULLUP|INPUT|OUTPUT|RF24_PA_LOW|A[0-7]|Wire|Serial|SPI)\b|(\b\d+\.?\d*\b)/g;
  function hl(src){
    let code = src, com = '';
    const i = src.indexOf('//'); if (i >= 0) { code = src.slice(0, i); com = src.slice(i); }
    let out = esc(code).replace(KW, (m, a, b, c) => a ? `<span class="k">${m}</span>` : b ? `<span class="f">${m}</span>` : c ? `<span class="c">${m}</span>` : `<span class="n">${m}</span>`);
    if (com) out += `<span class="cm">${esc(com)}</span>`;
    return out;
  }
  function renderCode(fresh){
    codeBox.innerHTML = '';
    const labelled = new Set();
    CODE.forEach(([b, text], i) => {
      const d = document.createElement('div'); d.className = 'ln'; d.dataset.b = b;
      let tx;
      if (!b || solved.has(b)) tx = hl(text) || ' ';
      else {
        const indent = text.match(/^ */)[0];
        const len = Math.max(10, text.replace(/\s+\/\/.*$/, '').length - indent.length);
        const lab = labelled.has(b) ? '' : `<em>bloc ${b}</em>`; labelled.add(b);
        tx = `${indent}<span class="mask" style="width:${len}ch">${lab}</span>`;
      }
      d.innerHTML = `<span class="no">${i + 1}</span><span class="tx">${tx}</span>`;
      if (fresh && b === fresh) d.classList.add('fresh');
      codeBox.appendChild(d); lineEls[i] = d;
    });
    if (fresh) {
      const first = lineEls.find(d => d.classList.contains('fresh'));
      if (first) codeBox.scrollTo({top:Math.max(0, first.offsetTop - codeBox.clientHeight/3), behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
      setTimeout(() => lineEls.forEach(d => d.classList.remove('fresh')), 1600);
    }
  }

  /* ---------- Progression ---------- */
  function updateProgress(){
    const n = solved.size, done = n === TOTAL;
    $('progN').textContent = n;
    $('progBar').style.width = (n / TOTAL * 100) + '%';
    $('errTxt').textContent = errors + (errors > 1 ? ' erreurs' : ' erreur');
    const next = NODES.find(x => !solved.has(x.id));
    $('progState').textContent = next ? `Prochain bloc conseillé : ${next.id}` : 'Organigramme complet';
    $('copyBtn').disabled = !done;
    $('codeState').textContent = done ? 'complet' : 'incomplet';
    $('codeState').className = 'pill ' + (done ? 'done' : 'wait');
    if (!flashing) { $('flashBtn').disabled = !done; setFlash(done ? 'Branche la carte en USB, choisis le type de carte, puis clique.' : `Se débloque quand les ${TOTAL} blocs sont trouvés.`); }
    $('copyFoot').textContent = done ? 'Programme complet. Copie-le puis colle-le dans l’IDE Arduino.' : `Le bouton « Copier » se débloque quand les ${TOTAL} blocs sont trouvés.`;
  }

  /* ---------- Fenêtre de choix ---------- */
  const sheet = $g('sheet');
  let current = null, lastFocus = null;
  const shapeIcon = t => t === 'rect'
    ? '<svg width="22" height="12" aria-hidden="true"><rect x="1" y="1" width="20" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'
    : '<svg width="22" height="14" aria-hidden="true"><polygon points="11,1 21,7 11,13 1,7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  function openSheet(n){
    if (solved.has(n.id)) { toast(`Bloc ${n.id} déjà trouvé : ${n.label.join(' ')}`); return; }
    current = n; lastFocus = document.activeElement;
    $g('sheetKind').innerHTML = `${shapeIcon(n.type)} Bloc ${n.id} · ${n.type === 'rect' ? 'Action (rectangle)' : 'Test (losange)'}`;
    $g('sheetQ').textContent = n.q;
    $g('sheetHint').textContent = ''; $g('sheetHint').className = 'hint';
    const box = $g('choices'); box.innerHTML = '';
    const good = n.label.join(' ');
    shuffle([good, ...n.wrong]).forEach(txt => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choice';
      b.innerHTML = shapeIcon(n.type) + '<span></span>'; b.lastChild.textContent = txt;
      b.addEventListener('click', () => answer(b, txt === good));
      box.appendChild(b);
    });
    sheet.hidden = false; window.__sheetOwner = P;
    box.firstChild.focus();
  }
  function closeSheet(){ if (window.__sheetOwner !== P) return; sheet.hidden = true; current = null; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function answer(btn, ok){
    const n = current; if (!n) return;
    if (!ok) {
      errors++; save(); updateProgress();
      btn.classList.add('wrong'); btn.disabled = true;
      $g('sheetHint').textContent = n.hint; $g('sheetHint').className = 'hint';
      return;
    }
    btn.classList.add('right');
    [...$g('choices').children].forEach(c => c.disabled = true);
    const added = CODE.filter(c => c[0] === n.id).length;
    $g('sheetHint').textContent = `Bonne réponse. ${added} ligne${added > 1 ? 's' : ''} ajoutée${added > 1 ? 's' : ''} au programme.`;
    $g('sheetHint').className = 'hint ok';
    solved.add(n.id); save();
    setTimeout(() => {
      closeSheet(); paintNode(n);
      const g = nodeEls[n.id].g; g.classList.remove('pop'); void g.getBBox(); g.classList.add('pop');
      renderCode(n.id); updateProgress();
      if (solved.size === TOTAL) toast('Organigramme complet ! Tu peux copier le programme.');
      else toast(`Bloc ${n.id} : +${added} ligne${added > 1 ? 's' : ''} de code`);
    }, 650);
  }
  $g('sheetClose').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  if (!window.__infoWired) {
    window.__infoWired = true;
    $g('infoClose').addEventListener('click', () => { $g('infoSheet').hidden = true; });
    $g('infoSheet').addEventListener('click', e => { if (e.target === $g('infoSheet')) $g('infoSheet').hidden = true; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $g('infoSheet').hidden = true; });
  }

  /* ---------- Téléchargement, copie, remise à zéro ---------- */
  $('dlBtn').addEventListener('click', () => { downloadText(cfg.file, rawCode()); toast(cfg.file + ' téléchargé : ouvre-le dans l’IDE Arduino.'); });
  $('copyBtn').addEventListener('click', () => {
    const fallback = () => {
      const foot = $('copyFoot');
      foot.textContent = 'La copie automatique est bloquée ici. Sélectionne tout le texte ci-dessous (Ctrl+A) puis copie-le (Ctrl+C).';
      const ta = document.createElement('textarea'); ta.id = P + 'codeRaw'; ta.readOnly = true; ta.value = rawCode();
      foot.appendChild(ta); ta.focus(); ta.select();
    };
    try { navigator.clipboard.writeText(rawCode()).then(() => { toast('Code copié. Colle-le dans l’IDE Arduino (Ctrl+V).'); $('copyBtn').textContent = 'Copié ✓'; setTimeout(() => $('copyBtn').textContent = 'Copier le code', 2000); }, fallback); }
    catch(e) { fallback(); }
  });
  $('resetBtn').addEventListener('click', () => {
    const b = $('resetBtn');
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Confirmer ?'; setTimeout(() => { b.dataset.confirm = ''; b.textContent = 'Recommencer'; }, 3000); return; }
    b.dataset.confirm = ''; b.textContent = 'Recommencer';
    solved = new Set(); errors = 0; save();
    NODES.forEach(paintNode); renderCode(); updateProgress();
    codeBox.scrollTop = 0; toast('Organigramme remis à zéro');
  });

  /* ---------- Trace d'exécution (organigramme + code) ---------- */
  let traceTimers = [];
  function trace(ids){
    traceTimers.forEach(clearTimeout); traceTimers = [];
    const clear = () => { svg.querySelectorAll('.node.run').forEach(g => g.classList.remove('run')); lineEls.forEach(d => d.classList.remove('run')); };
    clear();
    ids.forEach((id, k) => traceTimers.push(setTimeout(() => {
      clear();
      if (nodeEls[id]) nodeEls[id].g.classList.add('run');
      lineEls.forEach(d => { if (+d.dataset.b === id) d.classList.add('run'); });
    }, k * 130)));
    traceTimers.push(setTimeout(clear, ids.length * 130 + 160));
  }


  /* ---------- Envoi dans la Nano (Web Serial + protocole STK500v1) ---------- */
  const PAGE = 128;
  function parseHex(txt){
    const mem = new Map(); let base = 0, max = 0;
    txt.trim().split(/\r?\n/).forEach(line => {
      line = line.trim(); if (line[0] !== ':') return;
      const b = []; for (let i = 1; i < line.length; i += 2) b.push(parseInt(line.substr(i, 2), 16));
      const len = b[0], addr = (b[1] << 8) | b[2], type = b[3];
      if (type === 0) for (let i = 0; i < len; i++) { mem.set(base + addr + i, b[4 + i]); max = Math.max(max, base + addr + i + 1); }
      else if (type === 2) base = ((b[4] << 8) | b[5]) << 4;
      else if (type === 4) base = ((b[4] << 8) | b[5]) << 16;
    });
    const size = Math.ceil(max / PAGE) * PAGE, out = new Uint8Array(size).fill(0xFF);
    mem.forEach((v, k) => out[k] = v);
    return out;
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let flashing = false;
  function setFlash(msg, cls, pct){
    const m = $('flashMsg'); m.textContent = msg; m.className = 'flash-msg' + (cls ? ' ' + cls : '');
    if (pct !== undefined) $('flashBar').style.width = pct + '%';
    $('flashBar').parentNode.className = 'fbar' + (cls ? ' ' + cls : '');
  }
  class Link {
    constructor(port){ this.port = port; this.buf = []; this.wake = null; }
    start(){
      this.reader = this.port.readable.getReader(); this.writer = this.port.writable.getWriter();
      (async () => { try { for (;;) { const {value, done} = await this.reader.read(); if (done) break; if (value) { for (const b of value) this.buf.push(b); if (this.wake) this.wake(); } } } catch(e) {} })();
    }
    write(a){ return this.writer.write(new Uint8Array(a)); }
    async read(n, ms){
      const end = performance.now() + ms;
      while (this.buf.length < n) {
        const left = end - performance.now();
        if (left <= 0) throw new Error('timeout');
        await new Promise(r => { this.wake = r; setTimeout(r, Math.min(left, 40)); });
      }
      return this.buf.splice(0, n);
    }
    async cmd(bytes, n, ms = 1000){
      await this.write(bytes);
      const [a] = await this.read(1, ms);
      if (a !== 0x14) throw new Error('réponse inattendue');
      const data = n ? await this.read(n, ms) : [];
      const [z] = await this.read(1, ms);
      if (z !== 0x10) throw new Error('réponse inattendue');
      return data;
    }
    async close(){
      try { await this.reader.cancel(); } catch(e) {}
      try { this.reader.releaseLock(); } catch(e) {}
      try { this.writer.releaseLock(); } catch(e) {}
      try { await this.port.close(); } catch(e) {}
    }
  }
  async function flash(alt){
    if (flashing || (!alt && solved.size !== TOTAL)) return;
    if (!('serial' in navigator)) { setFlash('Ce navigateur n’a pas accès au port USB. Ouvre le fichier .html dans Chrome ou Edge sur un ordinateur.', 'err', 0); return; }
    let port;
    try { port = await navigator.serial.requestPort(); }
    catch(e) {
      if (e.name === 'NotFoundError') setFlash('Aucun port choisi. Branche la carte puis recommence.', 'err', 0);
      else setFlash('Accès USB bloqué ici. Télécharge le fichier .html et ouvre-le dans Chrome ou Edge.', 'err', 0);
      return;
    }
    const baud = +document.querySelector(`input[name="${P}board"]:checked`).value;
    const image = parseHex(alt ? alt.hex : cfg.hex), pages = image.length / PAGE;
    flashing = true; $('flashBtn').disabled = true; $('testFlashBtn').disabled = true;
    let link = null;
    try {
      try { await port.open({baudRate: baud}); }
      catch(e) { throw new Error('Port déjà utilisé : ferme l’IDE Arduino ou le moniteur série, puis recommence.'); }
      link = new Link(port); link.start();
      setFlash('Redémarrage de la carte…', '', 2);
      await port.setSignals({dataTerminalReady:false, requestToSend:false}); await sleep(250);
      await port.setSignals({dataTerminalReady:true, requestToSend:true}); await sleep(50);
      link.buf.length = 0;
      let ok = false;
      for (let i = 0; i < 12 && !ok; i++) {
        await link.write([0x30, 0x20]);
        try { const r = await link.read(2, 200); ok = r[0] === 0x14 && r[1] === 0x10; } catch(e) {}
        if (!ok) link.buf.length = 0;
      }
      if (!ok) throw new Error('La carte ne répond pas. Vérifie le câble et le port, puis essaie l’autre choix de carte.');
      await sleep(50); link.buf.length = 0;
      const sig = await link.cmd([0x75, 0x20], 3);
      if (sig[0] !== 0x1E || sig[1] !== 0x95) throw new Error('Cette carte n’est pas une Nano ATmega328P (signature ' + sig.map(x => x.toString(16).padStart(2, '0')).join(' ') + ').');
      await link.cmd([0x50, 0x20], 0);
      for (let p = 0; p < pages; p++) {
        const w = (p * PAGE) >> 1;
        await link.cmd([0x55, w & 0xFF, w >> 8, 0x20], 0);
        await link.cmd([0x64, 0, PAGE, 0x46, ...image.subarray(p * PAGE, (p + 1) * PAGE), 0x20], 0);
        setFlash(`Écriture ${Math.round((p + 1) / pages * 100)} %`, '', 5 + (p + 1) / pages * 65);
      }
      for (let p = 0; p < pages; p++) {
        const w = (p * PAGE) >> 1;
        await link.cmd([0x55, w & 0xFF, w >> 8, 0x20], 0);
        const got = await link.cmd([0x74, 0, PAGE, 0x46, 0x20], PAGE);
        for (let i = 0; i < PAGE; i++) if (got[i] !== image[p * PAGE + i]) throw new Error('Erreur de vérification à l’adresse ' + (p * PAGE + i) + '. Recommence l’envoi.');
        setFlash(`Vérification ${Math.round((p + 1) / pages * 100)} %`, '', 70 + (p + 1) / pages * 28);
      }
      await link.cmd([0x51, 0x20], 0);
      setFlash(alt ? `Programme d’essai envoyé et vérifié (${image.length} octets). ${alt.msg}` : `Programme envoyé et vérifié (${image.length} octets). ${cfg.doneMsg}`, 'ok', 100);
      toast(alt ? 'Programme d’essai envoyé dans la Nano' : 'Programme envoyé dans la Nano');
    } catch(e) {
      setFlash(e.message === 'timeout' || e.message === 'réponse inattendue' ? 'La communication avec la carte s’est interrompue. Recommence, ou essaie l’autre choix de carte.' : e.message, 'err');
    } finally {
      if (link) await link.close(); else { try { await port.close(); } catch(e) {} }
      flashing = false; $('flashBtn').disabled = solved.size !== TOTAL; $('testFlashBtn').disabled = false;
    }
  }
  $('flashBtn').addEventListener('click', () => flash());
  $('testFlashBtn').addEventListener('click', () => flash({hex:cfg.test.hex, msg:cfg.test.msg}));
  $('testDlBtn').addEventListener('click', () => { downloadText(cfg.test.name, cfg.test.ino); toast(cfg.test.name + ' téléchargé : ouvre-le dans l’IDE Arduino.'); });

  buildFlow(); renderCode(); updateProgress();
  return {trace, get solved(){ return solved; }, rawCode, NODES};
}

/* ================= Simulation : manette + drone ================= */
function FlightSim(P, prog, kind){
  const cv = $g(P + 'sim'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, lay = null;
  const KP = 2, KD = 0.8, G = 9.8;
  const S = {thr:0, yaw:0, pit:0, rol:0, arm:false, lost:false, lostT:0,
    cmd:{thr:0, yaw:0, pit:0, rol:0, arm:false},
    x:2, y:0, z:0, vx:0, vy:0, vz:0, psi:0, dpsi:0, th:0, ph:0, dth:0, dph:0, m:[0, 0, 0, 0], spin:[0, 0, 0, 0], crashT:0, t:0};
  const keys = new Set(); let drag = null;
  const $ = id => $g(P + id);

  function resize(){
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const rw = Math.min(W * (W < 620 ? .5 : .42), 380), r0 = Math.max(22, Math.min(rw * .19, H * .24));
    const cy = Math.max(H * .5, H - r0 - 28);
    lay = {rw, r:r0, L:{cx:rw * .26, cy}, R:{cx:rw * .74, cy}, sw:{cx:rw * .5, cy:Math.min(118, cy - r0 - 40)}, led:{cx:rw * .5, cy:44}, sceneX:rw};
  }
  new ResizeObserver(resize).observe(cv); resize();

  /* ---------- Entrées ---------- */
  function pos(e){ const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
  function moveStick(which, p){
    const s = lay[which], k = lay.r * .8;
    const nx = clamp((p.x - s.cx) / k, -1, 1), ny = clamp(-(p.y - s.cy) / k, -1, 1);
    if (which === 'L') { S.yaw = nx; S.thr = (ny + 1) / 2; } else { S.rol = nx; S.pit = ny; }
  }
  cv.addEventListener('pointerdown', e => {
    cv.focus(); const p = pos(e); if (!lay) return;
    const dsw = Math.abs(p.x - lay.sw.cx) < 26 && Math.abs(p.y - lay.sw.cy) < 36;
    if (dsw) { toggleArm(); return; }
    for (const which of ['L', 'R']) {
      const s = lay[which];
      if (Math.hypot(p.x - s.cx, p.y - s.cy) < lay.r * 1.15) { drag = which; cv.setPointerCapture(e.pointerId); moveStick(which, p); e.preventDefault(); return; }
    }
  });
  cv.addEventListener('pointermove', e => { if (drag) moveStick(drag, pos(e)); });
  const endDrag = () => { if (!drag) return; if (drag === 'R') { S.rol = 0; S.pit = 0; } else S.yaw = 0; drag = null; };
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  const HANDLED = ['w', 's', 'a', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '];
  cv.addEventListener('keydown', e => {
    const k = e.key.toLowerCase(); if (!HANDLED.includes(k)) return;
    e.preventDefault(); if (k === ' ') { if (!e.repeat) toggleArm(); return; } keys.add(k);
  });
  cv.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  cv.addEventListener('blur', () => keys.clear());

  function toggleArm(){
    S.arm = !S.arm; const b = $('btnArm'); if (b) { b.setAttribute('aria-pressed', String(S.arm)); b.firstChild.textContent = S.arm ? 'Armé (ON)' : 'Désarmé (OFF)'; }
    runTrace();
  }
  if ($('btnArm')) $('btnArm').addEventListener('click', toggleArm);
  if ($('btnLost')) $('btnLost').addEventListener('click', () => {
    S.lost = !S.lost; const b = $('btnLost'); b.setAttribute('aria-pressed', String(S.lost)); b.firstChild.textContent = S.lost ? 'Radio coupée' : 'Couper la radio';
    $('simMsg').textContent = S.lost ? 'Radio coupée : au bout de 0,5 s sans message, le drone coupe ses moteurs (blocs 7 et 8).' : cfg0.msg;
  });
  if ($('btnReset')) $('btnReset').addEventListener('click', () => {
    Object.assign(S, {thr:0, yaw:0, pit:0, rol:0, arm:false, lost:false, lostT:0, x:2, y:0, z:0, vx:0, vy:0, vz:0, psi:0, th:0, ph:0, dth:0, dph:0, crashT:0});
    S.cmd = {thr:0, yaw:0, pit:0, rol:0, arm:false};
    if ($('btnArm')) { $('btnArm').setAttribute('aria-pressed', 'false'); $('btnArm').firstChild.textContent = 'Désarmé (OFF)'; }
    if ($('btnLost')) { $('btnLost').setAttribute('aria-pressed', 'false'); $('btnLost').firstChild.textContent = 'Couper la radio'; }
    $('simMsg').textContent = cfg0.msg;
  });
  const cfg0 = {msg:$('simMsg').textContent};

  /* ---------- Physique ---------- */
  function step(dt){
    S.t += dt;
    /* manette */
    if (!(drag === 'L')) {
      const up = (keys.has('w') ? 1 : 0) - (keys.has('s') ? 1 : 0), yw = (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0);
      S.thr = clamp(S.thr + up * dt * .3, 0, 1); S.yaw = approach(S.yaw, yw, dt * (yw ? 5 : 8));
    }
    if (!(drag === 'R')) {
      const pt = (keys.has('arrowup') ? 1 : 0) - (keys.has('arrowdown') ? 1 : 0), rl = (keys.has('arrowright') ? 1 : 0) - (keys.has('arrowleft') ? 1 : 0);
      S.pit = approach(S.pit, pt, dt * (pt ? 5 : 8)); S.rol = approach(S.rol, rl, dt * (rl ? 5 : 8));
    }
    const dz = v => Math.abs(v) < .05 ? 0 : v;
    const live = {thr:S.arm ? S.thr : 0, yaw:dz(S.yaw), pit:dz(S.pit), rol:dz(S.rol), arm:S.arm};
    if (!S.lost) { S.cmd = live; S.lostT = 0; } else S.lostT += dt;
    const cut = S.lostT > .5;
    const gaz = cut ? 0 : S.cmd.thr * 255, armed = S.cmd.arm && !cut;
    const on = armed && gaz > 15;
    /* régulateur + mélangeur : les mêmes formules que le programme */
    if (on) {
      const eR = S.cmd.rol * 20 - S.ph, eP = -S.cmd.pit * 20 - S.th;
      const cR = KP * eR - KD * S.dph, cP = KP * eP - KD * S.dth, lac = S.cmd.yaw * 50;
      S.m = [gaz + cP + cR - lac, gaz + cP - cR + lac, gaz - cP - cR - lac, gaz - cP + cR + lac].map(v => clamp(v, 0, 255));
    } else S.m = [0, 0, 0, 0];
    const [m1, m2, m3, m4] = S.m, tf = (m1 + m2 + m3 + m4) / 4 / 255, k = tf / .5;
    const airborne = S.z > .005 || k > 1;
    if (airborne) {
      S.dph += (2.5 * ((m1 + m4) - (m2 + m3)) - 2.2 * S.dph) * dt; S.dth += (2.5 * ((m1 + m2) - (m3 + m4)) - 2.2 * S.dth) * dt;
      S.ph += S.dph * dt; S.th += S.dth * dt;
      S.ph = clamp(S.ph, -60, 60); S.th = clamp(S.th, -60, 60);
      const rate = -((m2 + m4) - (m1 + m3)) * .35; S.dpsi += (rate - S.dpsi) * Math.min(1, dt * 4); S.psi += S.dpsi * dt;
    } else {
      S.ph *= Math.exp(-12 * dt); S.th *= Math.exp(-12 * dt); S.dph = S.dth = S.dpsi = 0;
    }
    const thR = S.th * Math.PI / 180, phR = S.ph * Math.PI / 180, psR = S.psi * Math.PI / 180;
    const az = (k * Math.cos(thR) * Math.cos(phR) - 1) * 6 - 1.3 * S.vz;
    let af = -k * G * Math.sin(thR), ar = k * G * Math.sin(phR);
    if (!airborne) af = ar = 0;
    S.vz += (airborne || az > 0 ? az : 0) * dt;
    S.vx += (af * Math.cos(psR) + ar * Math.sin(psR) - 1.1 * S.vx) * dt;
    S.vy += (af * Math.sin(psR) - ar * Math.cos(psR) - 1.1 * S.vy) * dt;
    S.x += S.vx * dt; S.y += S.vy * dt; S.z += S.vz * dt;
    if (S.z <= 0) {
      if (S.vz < -4 && S.crashT <= 0) { S.crashT = 2.5; toast('Atterrissage brutal ! Descends plus doucement (réduis les gaz progressivement).'); }
      S.z = 0; S.vz = Math.max(0, S.vz); S.vx *= Math.exp(-6 * dt); S.vy *= Math.exp(-6 * dt);
    }
    if (S.z > 3) { S.z = 3; S.vz = Math.min(0, S.vz); }
    if (S.x < -2 || S.x > 8) { S.x = clamp(S.x, -2, 8); S.vx = 0; }
    if (S.y < -4 || S.y > 4) { S.y = clamp(S.y, -4, 4); S.vy = 0; }
    S.crashT = Math.max(0, S.crashT - dt);
    for (let i = 0; i < 4; i++) S.spin[i] += (S.m[i] / 255) * dt * 70 * (i % 2 ? -1 : 1);
    S.on = on; S.cut = cut;
  }

  /* ---------- Dessin ---------- */
  const COL = {bg:'#0c1419', floor:'#13232b', grid:'rgba(120,170,185,.22)', front:'#e8743b', rear:'#35bcc4', led:'#3cff8f'};
  function drawRemote(){
    const rw = lay.rw, r = lay.r;
    ctx.save();

  function drawWires(){

    const R = rects(), ext = {t:Infinity, b:-Infinity, l:Infinity, r:-Infinity};
    COMPS.forEach(c => { const o = off(c); ext.t = Math.min(ext.t, o.y); ext.b = Math.max(ext.b, o.y + c.h); ext.l = Math.min(ext.l, o.x); ext.r = Math.max(ext.r, o.x + c.w); });
    S.wires.forEach((w, i) => {
      const d = rounded(route(w, i, R, ext));
      svgEl('path', {class:'wire-bg', d}, gWire);
      const p = svgEl('path', {class:'wire' + (i === selected ? ' sel' : ''), d, stroke:w.color}, gWire);
      const h = svgEl('path', {class:'wire-hit', d}, gWire);
      const t = svgEl('title', {}, h); t.textContent = pinName(w.a) + ' ↔ ' + pinName(w.b);
      h.addEventListener('click', ev => { ev.stopPropagation(); selected = selected === i ? -1 : i; drawWires(); updateTools(); });
    });
  }

  /* ---------- Tracer un fil ---------- */
  function setStatus(t){ $('cabStatus').textContent = t; }
  function pinClick(f){
    if (!pending) { pending = f; pinEls[f].classList.add('armed'); setStatus('Départ : ' + pinName(f) + '. Clique sur la broche à relier.'); return; }
    if (pending === f) { cancelPending(); return; }
    const a = pending; cancelPending();
    if (S.wires.some(w => (w.a === a && w.b === f) || (w.a === f && w.b === a))) { setStatus('Ce fil existe déjà.'); return; }
    if (byId[PINS[a].comp] === byId[PINS[f].comp] && !byId[PINS[a].comp].nano) { setStatus('Un fil doit relier deux composants différents.'); return; }
    S.wires.push({a, b:f, color:S.color}); selected = -1; save(); drawWires(); updateTools(); changed();
    setStatus(`Fil posé : ${pinName(a)} ↔ ${pinName(f)}.`);
  }
  function cancelPending(){ if (pending) pinEls[pending].classList.remove('armed'); pending = null; }
  svg.addEventListener('click', () => { cancelPending(); if (selected >= 0) { selected = -1; drawWires(); updateTools(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cancelPending(); if ((e.key === 'Delete' || e.key === 'Backspace') && selected >= 0 && svg.closest('.module') && !svg.closest('.module').hidden && !/INPUT|TEXTAREA/.test((e.target || {}).tagName)) { e.preventDefault(); delSelected(); } });
  function delSelected(){ if (selected < 0) return; S.wires.splice(selected, 1); selected = -1; save(); drawWires(); updateTools(); changed(); }
  function updateTools(){ $('cabDel').disabled = selected < 0; }
  $('cabDel').addEventListener('click', delSelected);
  $('cabUndo').addEventListener('click', () => { S.wires.pop(); selected = -1; save(); drawWires(); updateTools(); changed(); });
  $('cabClear').addEventListener('click', () => {
    const b = $('cabClear');
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Confirmer ?'; setTimeout(() => { b.dataset.confirm = ''; b.textContent = 'Tout débrancher'; }, 3000); return; }
    b.dataset.confirm = ''; b.textContent = 'Tout débrancher'; S.wires = []; selected = -1; S.checked = false; save(); drawWires(); updateTools(); render();
  });
  $('cabLayout').addEventListener('click', () => { S.pos = {}; save(); COMPS.forEach(applyPos); drawWires(); });
  svg.closest('.panel').querySelectorAll('[data-wire]').forEach(b => b.addEventListener('click', () => {
    S.color = b.dataset.wire; save(); paintSwatches();
    if (selected >= 0) { S.wires[selected].color = S.color; save(); drawWires(); }
  }));
  const paintSwatches = () => svg.closest('.panel').querySelectorAll('[data-wire]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.wire === S.color)));

  /* ---------- Analyse électrique ---------- */
  function analyze(){
    const par = {}, find = x => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; }, uni = (a, b) => { a = find(a); b = find(b); if (a !== b) par[a] = b; };
    Object.keys(PINS).forEach(k => par[k] = k);
    (cfg.equiv || []).forEach(g => g.slice(1).forEach(p => uni(g[0], p)));
    const eq = {}; Object.keys(PINS).forEach(k => eq[k] = find(k));
    const netPre = {}; cfg.nets.forEach(n => n.pins.forEach(p => { netPre[eq[p]] = n; }));
    S.wires.forEach(w => uni(w.a, w.b));
    let total = 0, done = 0;
    const res = cfg.nets.map(n => {
      const cnt = new Map(); n.pins.forEach(p => { const r = find(p); cnt.set(r, (cnt.get(r) || 0) + 1); });
      const top = [...cnt.entries()].sort((a, b) => b[1] - a[1])[0];
      total += n.pins.length - 1; done += top[1] - 1;
      return {n, ok:cnt.size === 1, started:top[1] > 1, missing:n.pins.filter(p => find(p) !== top[0])};
    });
    const alerts = [];
    /* court-circuit : des broches de deux réseaux différents sont reliées entre elles */
    const groups = new Map(); Object.keys(PINS).forEach(k => { const r = find(k); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(k); });
    const wired = new Set(); S.wires.forEach(w => wired.add(find(w.a)));
    for (const r of wired) {
      const members = groups.get(r), touched = cfg.nets.filter(n => n.pins.some(p => members.includes(p)));
      if (touched.length > 1) alerts.push({danger:true, msg:`Ces broches sont reliées entre elles alors qu’elles ne vont pas ensemble : <b>${touched.map(n => n.name).join('</b> et <b>')}</b>.`});
    }
    (cfg.hazards || []).forEach(h => { if (find(h.a) === find(h.b)) alerts.push({danger:true, msg:h.msg}); });
    S.wires.forEach(w => { if (!netPre[eq[w.a]] || !netPre[eq[w.b]]) alerts.push({danger:false, msg:`Le fil <b>${pinName(w.a)} ↔ ${pinName(w.b)}</b> n’est pas prévu dans ce montage.`}); });
    return {res, alerts, total, done, ok:res.every(r => r.ok) && !alerts.some(a => a.danger), find};
  }
  function render(){
    const A = analyze();
    $('cabCount').textContent = `${Math.min(A.done, A.total)} / ${A.total} fils`; $('cabCount').className = 'pill ' + (A.ok ? 'done' : 'wait');
    $('cabAmmo').innerHTML = `<b>${S.wires.length}</b> fil${S.wires.length > 1 ? 's' : ''} posé${S.wires.length > 1 ? 's' : ''}`;
    const al = $('cabAlerts'), ls = $('cabList');
    if (!S.checked) { al.innerHTML = ''; ls.innerHTML = ''; $('cabVerdict').textContent = 'Clique sur « Vérifier mon câblage » quand tu penses avoir fini.'; clearMarks(); return A; }
    al.innerHTML = A.alerts.map(a => `<div class="alert ${a.danger ? 'danger' : ''}">${a.danger ? '<b>Attention :</b> ' : ''}${a.msg}</div>`).join('') + (A.ok ? `<div class="alert good"><b>Câblage correct !</b> ${cfg.okMsg}</div>` : '');
    ls.innerHTML = A.res.map(r => `<li class="${r.ok ? 'ok' : r.started ? 'bad' : 'todo'}"><i>${r.ok ? '✓' : r.started ? '!' : '·'}</i><span>${r.n.name}</span>${r.ok ? '' : `<small>${r.started ? 'À compléter : il manque ' + r.missing.map(pinName).join(', ') + '.' : r.n.why}</small>`}</li>`).join('');
    $('cabVerdict').textContent = A.ok ? 'Tous les fils sont bons.' : 'Il reste des fils à poser ou à corriger.';
    clearMarks();
    if (!A.ok) A.res.forEach(r => { if (!r.ok) r.n.pins.forEach(p => { if (A.find(p) !== A.find(r.n.pins[0]) || r.missing.includes(p)) pinEls[p].classList.add('hit'); }); });
    return A;
  }
  function clearMarks(){ svg.querySelectorAll('.pin.hit').forEach(e => e.classList.remove('hit')); }
  function changed(){ if (S.checked) render(); else render(); refreshHelp(); }
  $('cabCheck').addEventListener('click', () => { S.checked = true; save(); render(); const A = analyze(); toast(A.ok ? 'Câblage correct !' : 'Il y a des erreurs ou des fils manquants.'); });

  /* ---------- Aide au câblage (facultative) ---------- */
  const helpBox = $('cabHelpBox'), helpBtn = $('cabHelp');
  function pairs(){ const out = []; cfg.nets.forEach(n => n.pins.slice(1).forEach(p => out.push({net:n, a:n.pins[0], b:p}))); return out; }
  function refreshHelp(){
    if (helpBox.hidden) return;
    const A = analyze(), find = A.find; let done = 0, html = '';
    cfg.nets.forEach(n => {
      html += `<div class="help-grp"><h4>${n.name}</h4><p class="why">${n.why}</p><ul>`;
      n.pins.slice(1).forEach(p => {
        const ok = find(p) === find(n.pins[0]); if (ok) done++;
        html += `<li><button type="button" class="${ok ? 'ok' : 'todo'}" data-a="${n.pins[0]}" data-b="${p}"><i>${ok ? '✓' : '○'}</i><span>${pinName(n.pins[0])} ↔ ${pinName(p)}</span></button></li>`;
      });
      html += '</ul></div>';
    });
    $('cabHelpList').innerHTML = html; $('cabHelpCount').textContent = `${done} / ${pairs().length}`;
    $('cabHelpList').querySelectorAll('button').forEach(b => b.addEventListener('click', () => showPins([b.dataset.a, b.dataset.b])));
  }
  function showPins(ids){
    helpPins.forEach(f => pinEls[f].classList.remove('help')); helpPins = ids; ids.forEach(f => pinEls[f].classList.add('help'));
    setStatus('Relie ' + pinName(ids[0]) + ' à ' + pinName(ids[1]) + '.');
    clearTimeout(showPins.t); showPins.t = setTimeout(() => { helpPins.forEach(f => pinEls[f].classList.remove('help')); helpPins = []; }, 4500);
  }
  helpBtn.addEventListener('click', () => { const on = helpBox.hidden; helpBox.hidden = !on; helpBtn.setAttribute('aria-pressed', String(on)); refreshHelp(); });
  $('cabHelpNext').addEventListener('click', () => {
    const A = analyze(), nxt = pairs().find(p => A.find(p.a) !== A.find(p.b));
    if (nxt) showPins([nxt.a, nxt.b]); else toast('Tous les fils sont posés.');
  });

  drawComponents(); drawWires(); paintSwatches(); updateTools(); render(); refreshHelp();
  return {S, analyze};
}

    <button type="button" role="tab" id="${P}tabCad" aria-selected="false" aria-controls="${P}modCad"><span>3</span>${c.cadTab}</button>

  <div id="${P}modProg" class="module" role="tabpanel" aria-labelledby="${P}tabProg">
  <div class="mod-top">
    <p class="mod-intro">${c.progIntro}</p>
    <div class="progress" aria-live="polite">
      <div class="row"><span><b id="${P}progN">0</b> / ${c.nBlocks} blocs trouvés</span><span id="${P}errTxt">0 erreur</span></div>

    </div>
  </div>

  <section class="range" aria-label="Simulation : ${c.short}">
    <div class="range-head">
      <h2>${c.simTitle}</h2>
      <div class="legend-sim"><span style="--c:#d8e1e5">joysticks</span><span style="--c:#e8743b">avant du drone</span><span style="--c:#3cff8f">LED : armé</span></div>
    </div>
    <canvas id="${P}sim" tabindex="0" aria-label="Manette à gauche, drone en vol à droite. Clique sur les joysticks de la manette ou utilise le clavier pour piloter le drone."></canvas>
    <div class="controls">

    </div>
    <p class="simmsg" id="${P}simMsg">${c.simMsg}</p>
  </section>

  <main class="work">
    <section class="panel" aria-label="Organigramme : ${c.short}">
      <div class="panel-head">
        <h2>Organigramme <button type="button" class="info-btn" id="${P}flowInfo" aria-label="Comment lire l'organigramme" title="Comment lire l'organigramme">i</button></h2>
        <div class="shapes">
          <span><svg width="26" height="14" aria-hidden="true"><rect x="1" y="1" width="24" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Action</span>
          <span><svg width="26" height="16" aria-hidden="true"><polygon points="13,1 25,8 13,15 1,8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Test (oui / non)</span>

      </div>
      <div class="flow-scroll"><svg id="${P}flow" viewBox="0 0 560 ${c.flowH}" role="img" aria-label="Organigramme : ${c.short}"></svg></div>
      <p class="tip">${c.tip}</p>
    </section>

    <section class="panel code-panel" aria-label="Programme Arduino : ${c.short}">

        <div><h2>Programme Arduino</h2><p class="code-sub">${c.file} · <span class="pill wait" id="${P}codeState">incomplet</span></p></div>

    </section>
  </main>

  <section class="upload">
    <div class="panel">
      <h2>Câblage sur la Nano</h2>
      <table class="pins">${c.pinsRows}</table>
      ${c.pinsNote}
    </div>
    <div class="panel flash">
      <h2>Envoyer directement dans la Nano</h2>
      <fieldset class="boards">
        <legend>Quelle carte ?</legend>
        <label class="opt"><input type="radio" name="${P}board" value="57600" checked><span><b>Nano clone ou ancienne</b><small>puce CH340 · « Old Bootloader » · 57 600 bauds</small></span></label>
        <label class="opt"><input type="radio" name="${P}board" value="115200"><span><b>Nano officielle récente</b><small>bootloader Optiboot · 115 200 bauds</small></span></label>
      </fieldset>
      <button class="btn-flash" id="${P}flashBtn" type="button" disabled>Envoyer dans la Nano</button>
      <div class="fbar" aria-hidden="true"><i id="${P}flashBar"></i></div>
      <p class="flash-msg" id="${P}flashMsg" aria-live="polite">Se débloque quand les ${c.nBlocks} blocs sont trouvés.</p>
      <p>Fonctionne dans <strong>Chrome ou Edge</strong> sur ordinateur, avec le fichier .html ouvert sur le poste. Ferme l’IDE Arduino et son moniteur série avant l’envoi. ${c.flashNote}</p>
    </div>
    <div class="panel">
      <h2>Avec l’IDE Arduino</h2>
      <ol>
        <li>Installe la bibliothèque <strong>RF24</strong> : <span class="menu">Outils › Gérer les bibliothèques</span>, cherche « RF24 » (de TMRh20) et clique sur Installer.</li>
        <li>Clique sur <strong>Copier le code</strong>, puis colle-le dans l’IDE (<span class="menu">Fichier › Nouveau</span>).</li>
        <li><span class="menu">Outils › Type de carte › Arduino Nano</span>, puis <span class="menu">Processeur › ATmega328P (Old Bootloader)</span> pour la plupart des clones.</li>
        <li><span class="menu">Outils › Port</span> : choisis le port USB, puis clique sur la flèche <strong>Téléverser</strong>.</li>
      </ol>
      <p>Pendant le téléversement, débranche le module radio si l’envoi échoue.</p>
    </div>
    <div class="panel">
      <h2>${c.testTitle}</h2>
      ${c.testBody}
      <div class="test-btns"><button class="btn btn-plain" id="${P}testFlashBtn" type="button" style="color:var(--ink);border-color:var(--line)">Envoyer l’essai dans la Nano</button><button class="btn btn-plain" id="${P}testDlBtn" type="button" style="color:var(--ink);border-color:var(--line)">⬇ Télécharger ${c.testFile}</button></div>
    </div>
    ${c.cam || ''}
  </section>
  </div>

  <div id="${P}modCab" class="module" role="tabpanel" aria-labelledby="${P}tabCab" hidden>
    <p class="mod-intro">${c.cabIntro}</p>
    <div class="cab-work">
      <section class="panel cab-board" aria-label="Plan de câblage : ${c.short}">
        <div class="cab-tools">
          <div class="swatches" role="group" aria-label="Couleur du fil">
            <span class="sw-lbl">Fil</span>
            <button type="button" data-wire="#d4213a" style="--c:#d4213a" aria-label="Fil rouge"></button>
            <button type="button" data-wire="#1d2226" style="--c:#1d2226" aria-label="Fil noir"></button>
            <button type="button" data-wire="#e6b400" style="--c:#e6b400" aria-label="Fil jaune"></button>
            <button type="button" data-wire="#1f7ae0" style="--c:#1f7ae0" aria-label="Fil bleu"></button>
            <button type="button" data-wire="#1c9a57" style="--c:#1c9a57" aria-label="Fil vert"></button>
            <button type="button" data-wire="#ef7d22" style="--c:#ef7d22" aria-label="Fil orange"></button>
          </div>
          <button type="button" class="ghost" id="${P}cabDel" disabled>Supprimer le fil</button>
          <button type="button" class="ghost" id="${P}cabUndo">Annuler le dernier fil</button>
          <button type="button" class="ghost" id="${P}cabClear">Tout débrancher</button>
          <button type="button" class="ghost" id="${P}cabLayout">Replacer les composants</button>
          <button type="button" class="ghost help-toggle" id="${P}cabHelp" aria-pressed="false">Aide</button>
        </div>
        <div class="cab-svgwrap"><svg id="${P}cab" class="cab-svg" viewBox="0 0 880 740" role="img" aria-label="Carte Arduino Nano et composants à relier : ${c.short}"></svg></div>
        <p class="cab-status" id="${P}cabStatus">Survole ou touche une broche pour voir son nom.</p>
      </section>
      <aside class="cab-side">
        <section class="panel side-block help-box" id="${P}cabHelpBox" hidden>
          <div class="cab-check-head"><h3>Aide au câblage</h3><span class="pill wait" id="${P}cabHelpCount"></span></div>
          <ol class="help-steps"><li>Clique sur une broche : elle devient jaune.</li><li>Clique sur la broche à relier : le fil se dessine tout seul.</li><li>Clique sur une ligne de la liste : les deux broches clignotent sur le schéma.</li></ol>
          <button class="btn-flash btn-auto" id="${P}cabHelpNext" type="button">Montre-moi le prochain fil</button>
          <div id="${P}cabHelpList" class="help-list"></div>
        </section>
        <section class="panel side-block">
          <div class="cab-check-head"><h3>Mon câblage</h3><span class="pill wait" id="${P}cabCount">0 fils</span></div>
          <p class="cab-ammo" id="${P}cabAmmo"></p>
          <button class="btn-flash" id="${P}cabCheck" type="button">Vérifier mon câblage</button>
          <p class="export-msg" id="${P}cabVerdict"></p>
          <div class="cab-alerts" id="${P}cabAlerts"></div>
          <ul class="cab-list" id="${P}cabList"></ul>
        </section>
        <section class="panel side-block">
          <h3>Comment faire</h3>
          <ul class="cab-tips">${c.cabTips}</ul>
        </section>
        <section class="panel side-block">
          <h3>Matériel</h3>
          <table class="vis">${c.materials}</table>
        </section>
      </aside>
    </div>
  </div>

  <div id="${P}modCad" class="module" role="tabpanel" aria-labelledby="${P}tabCad" hidden>
    <p class="mod-intro">${c.cadIntro}</p>
    <section class="panel cad-setup" id="${P}cadSetup">
      <fieldset class="bigchoice">
        <legend>${c.cadQuestion}</legend>

          <label class="card-opt" ${c.laser ? '' : 'hidden'}><input type="radio" name="${P}proc" value="laser" id="${P}procLaser">

              <svg class="co-ic" viewBox="0 0 48 32" aria-hidden="true"><rect x="6" y="4" width="36" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 10h36" stroke="currentColor" stroke-width="2"/><path d="M21 10v5h6v-5M24 15v4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M14 25h20" stroke="var(--laser)" stroke-width="3"/></svg>
              <b>Impression 3D</b><small>${c.printText}</small></span></label>
        </div>
      </fieldset>
      <div class="setup-foot"><p id="${P}setupMsg">Choisis un procédé de fabrication.</p><button class="btn-flash btn-auto" id="${P}cadStart" type="button" disabled>Commencer</button></div>
    </section>

    <div id="${P}cadMain" hidden>
      <div class="cad-bar panel">
        <span>Fabrication : <b id="${P}barProc"></b></span>
        <span class="pill wait" id="${P}barState"></span>
        <button class="ghost" id="${P}cadChange" type="button">Changer de procédé</button>
      </div>
      <div class="cad-work">
        <section class="panel vp-panel" aria-label="Vue 3D : ${c.short}">
          <div class="vp-tools">
            <div class="seg2" role="group" aria-label="Point de vue">
              <button type="button" data-view="iso">3D</button><button type="button" data-view="side">Face avant</button><button type="button" data-view="top">Dessus</button><button type="button" data-view="front">Côté droit</button>
            </div>
            <label class="tog"><input type="checkbox" id="${P}optComp" checked> Composants</label>
            <label class="tog"><input type="checkbox" id="${P}optXray"> Transparent</label>
            <label class="tog"><input type="checkbox" id="${P}optExplode"> <span id="${P}explodeLbl">Vue éclatée</span></label>
          </div>
          <div class="vp" id="${P}vp"><div class="vp-msg" id="${P}vpMsg">Chargement du modeleur 3D…</div></div>
          <p class="vp-help">Glisser : tourner · Molette : zoom · Clic droit : déplacer · Repère : <b class="ax-x">X</b> vers l'avant, <b class="ax-y">Y</b> vers la gauche, <b class="ax-z">Z</b> vers le haut</p>
        </section>
        <aside class="cad-side">
          <section class="panel side-block" id="${P}optBlock" hidden>
            <h3 id="${P}optTitle"></h3>
            <div class="sizes big" id="${P}optBtns" role="group"></div>
            <p class="small-note" id="${P}optNote"></p>
          </section>
          <section class="panel side-block" id="${P}plyBlock" hidden>
            <h3>Épaisseur des plaques</h3>
            <div class="sizes big" role="group" aria-label="Épaisseur des plaques">
              <button type="button" data-ply="2">2 mm</button><button type="button" data-ply="3">3 mm</button><button type="button" data-ply="4">4 mm</button><button type="button" data-ply="5">5 mm</button>
            </div>
            <p class="small-note" id="${P}plyNote"></p>
          </section>
          <section class="panel side-block"><h3>Assemblage</h3><p class="small-note" id="${P}asmNote"></p></section>
          <section class="panel side-block"><h3>Visserie à prévoir</h3><div id="${P}visList"></div></section>
          <section class="panel side-block">
            <h3>Diamètres des trous</h3>
            <p class="proc-note" id="${P}procNote"></p>
            <div id="${P}holeList" class="easy-list"></div>
          </section>
          <section class="panel side-block" id="${P}exportBlock">
            <h3>Fichier de fabrication</h3>
            <p id="${P}exportMsg" class="export-msg"></p>
            <div id="${P}exportPreview" class="export-prev"></div>
            <p id="${P}layoutNote" class="small-note"></p>
            <button class="btn-flash" id="${P}exportBtn" type="button" disabled>Télécharger</button>
            <p id="${P}exportNote" class="small-note"></p>
          </section>
        </aside>
      </div>
    </div>
  </div>`;
}

/* ================= Navigation : projets et onglets ================= */
function setupTabs(P){
  const tabs = ['Prog', 'Cab', 'Cad'].map(k => ({btn:$g(P + 'tab' + k), mod:$g(P + 'mod' + k)}));
  const sel = i => {
    tabs.forEach((t, j) => { t.btn.setAttribute('aria-selected', String(i === j)); t.mod.hidden = i !== j; });
    lsSet('colibri-tab-' + P, i);
    window.dispatchEvent(new Event('resize'));
  };
  tabs.forEach((t, i) => t.btn.addEventListener('click', () => sel(i)));
  tabs.forEach((t, i) => t.btn.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length; sel(n); tabs[n].btn.focus(); }
  }));
  sel(lsGet('colibri-tab-' + P, 0));
}
const HEAD = {

function showProject(k){
  for (const p of ['d', 't']) { $g('proj' + p).hidden = p !== k; document.querySelector(`[data-proj="${p}"]`).setAttribute('aria-pressed', String(p === k)); }
  $g('appTitle').textContent = HEAD[k][0]; $g('appLede').textContent = HEAD[k][1];
  document.title = HEAD[k][0] + ' · Arduino Nano';
  lsSet('colibri-proj', k);
  window.dispatchEvent(new Event('resize'));
}

const DRONE_PROG = {NODES:DRONE_NODES, EDGES:DRONE_EDGES, DOTS:DRONE_DOTS, CODE:DRONE_CODE, key:'colibri-prog-v1', file:'colibri_drone.ino', hex:HEXES.drone, doneMsg:'Retire les hélices et lance d’abord l’essai des moteurs.', test:{hex:HEXES.test_moteurs, ino:TEST_MOTEURS, name:'test_moteurs.ino', msg:'HÉLICES RETIRÉES : après 3 s, M1 à M4 tournent 1 s chacun, à 30 %. Renvoie ensuite le vrai programme.'},
  guide:["Un organigramme est le plan du programme : on le lit de haut en bas en suivant les flèches.", "<b>Rectangle</b> = une action. <b>Losange</b> = un test : la flèche <b>Oui</b> continue vers le bas, la flèche <b>Non</b> part sur le côté et rejoint la suite plus bas (les petits points marquent les jonctions).", "Les quatre premiers blocs sont dans <code>setup()</code> : ils ne s’exécutent qu’une fois, à l’allumage. Ensuite <code>loop()</code> recommence sans fin, en suivant la grande flèche qui remonte sur la gauche.", "Clique sur un bloc « ? » pour répondre à sa question ; le bouton <b>i</b> d’un bloc explique son rôle et montre ses lignes de code."],

function boot(){
  for (const [P, k] of [['d-', 'd'], ['t-', 't']]) {
    $g('proj' + k).innerHTML = projectHTML(P, PROJECTS[k]);
  }
  const dProg = ProgramModule('d-', DRONE_PROG), tProg = ProgramModule('t-', REMOTE_PROG);
  FlightSim('d-', dProg, 'drone'); FlightSim('t-', tProg, 'remote');
  CabModule('d-', DRONE_CAB); CabModule('t-', REMOTE_CAB);
  setupTabs('d-'); setupTabs('t-');
  document.querySelectorAll('[data-proj]').forEach(b => b.addEventListener('click', () => showProject(b.dataset.proj)));
  showProject(lsGet('colibri-proj', 'd'));
}


boot();
